          // ============================================================
          // STEP 7 - GOOGLE MAPS HELPER
          // ============================================================
          Future<void> openGoogleMaps(
            BuildContext context,
            String location,
          ) async {
            final cleaned = location.trim();

            if (cleaned.isEmpty) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  content: Text(
                    'Location is not available.',
                  ),
                ),
              );
              return;
            }

            final uri = Uri.https(
              'www.google.com',
              '/maps/search/',
              {
                'api': '1',
                'query': cleaned,
              },
            );

            try {
              final launched = await launchUrl(
                uri,
                mode: LaunchMode.externalApplication,
              );

              if (!launched && context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Could not open Google Maps.',
                    ),
                  ),
                );
              }
            } catch (e) {
              if (!context.mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(
                    'Could not open Google Maps: $e',
                  ),
                ),
              );
            }
          }

          class LandlordHome extends StatelessWidget {
            const LandlordHome({super.key});

            Future<void> logout() async {
              await auth.signOut();
            }

            @override
            Widget build(BuildContext context) {
              final user = auth.currentUser;

              if (user == null) {
                return const AuthScreen();
              }

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Landlord Dashboard'),
                  actions: [
                    StreamBuilder<
                        QuerySnapshot<Map<String, dynamic>>>(
                      stream: db
                          .collection('inquiries')
                          .where(
                            'landlordId',
                            isEqualTo: user.uid,
                          )
                          .snapshots(),
                      builder: (context, snapshot) {
                        var unread = 0;

                        for (final doc
                            in snapshot.data?.docs ?? []) {
                          final data = doc.data();

                          // Missing isRead means old inquiry.
                          // Treat it as unread.
                          if (data['isRead'] != true) {
                            unread++;
                          }
                        }

                        return Stack(
                          children: [
                            IconButton(
                              tooltip: 'Inquiries',
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const LandlordInquiriesScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(
                                Icons.message_outlined,
                              ),
                            ),
                            if (unread > 0)
                              Positioned(
                                right: 6,
                                top: 6,
                                child: Container(
                                  padding:
                                      const EdgeInsets.all(4),
                                  constraints:
                                      const BoxConstraints(
                                    minWidth: 20,
                                    minHeight: 20,
                                  ),
                                  decoration:
                                      const BoxDecoration(
                                    color: Colors.red,
                                    shape: BoxShape.circle,
                                  ),
                                  child: Text(
                                    unread > 99
                                        ? '99+'
                                        : '$unread',
                                    textAlign:
                                        TextAlign.center,
                                    style:
                                        const TextStyle(
                                      color: Colors.white,
                                      fontSize: 10,
                                      fontWeight:
                                          FontWeight.bold,
                                    ),
                                  ),
                                ),
                              ),
                          ],
                        );
                      },
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) =>
                            const AddPropertyScreen(),
                      ),
                    );
                  },
                  icon: const Icon(Icons.add),
                  label: const Text('Add Property'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: db
                      .collection('properties')
                      .where(
                        'landlordId',
                        isEqualTo: user.uid,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(20),
                          child: Text(
                            'Could not load your properties.\n\n${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs = [
                      ...(snapshot.data?.docs ?? [])
                    ];

                    docs.sort((a, b) {
                      final aTime =
                          a.data()['createdAt'];
                      final bTime =
                          b.data()['createdAt'];

                      if (aTime is Timestamp &&
                          bTime is Timestamp) {
                        return bTime.compareTo(aTime);
                      }

                      return 0;
                    });

                    if (docs.isEmpty) {
                      return const Center(
                        child: Padding(
                          padding: EdgeInsets.all(30),
                          child: Column(
                            mainAxisAlignment:
                                MainAxisAlignment.center,
                            children: [
                              Icon(
                                Icons.home_work_outlined,
                                size: 70,
                              ),
                              SizedBox(height: 15),
                              Text(
                                'No properties yet.',
                                style: TextStyle(
                                  fontSize: 20,
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              SizedBox(height: 6),
                              Text(
                                'Tap "Add Property" to create your first listing.',
                                textAlign: TextAlign.center,
                              ),
                            ],
                          ),
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.fromLTRB(
                        16,
                        16,
                        16,
                        100,
                      ),
                      itemCount: docs.length,
                      itemBuilder: (context, index) {
                        final doc = docs[index];

                        return LandlordPropertyCard(
                          propertyId: doc.id,
                          data: doc.data(),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

