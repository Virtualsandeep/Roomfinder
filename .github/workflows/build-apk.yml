          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            late final TextEditingController titleController;
            late final TextEditingController locationController;
            late final TextEditingController rentController;
            late final TextEditingController discountController;
            late final TextEditingController bedroomsController;
            late final TextEditingController bathroomsController;
            late final TextEditingController descriptionController;

            String propertyType = 'Room';
            bool furnished = false;
            bool available = true;
            bool saving = false;

            @override
            void initState() {
              super.initState();

              final data = widget.existingData ?? {};

              titleController = TextEditingController(
                text: data['title']?.toString() ?? '',
              );

              locationController = TextEditingController(
                text: data['location']?.toString() ?? '',
              );

              rentController = TextEditingController(
                text: data['monthlyRent']?.toString() ?? '',
              );

              discountController = TextEditingController(
                text: data['discount']?.toString() ?? '0',
              );

              bedroomsController = TextEditingController(
                text: data['bedrooms']?.toString() ?? '0',
              );

              bathroomsController = TextEditingController(
                text: data['bathrooms']?.toString() ?? '0',
              );

              descriptionController = TextEditingController(
                text: data['description']?.toString() ?? '',
              );

              propertyType =
                  data['propertyType']?.toString() ?? 'Room';

              furnished = data['furnished'] == true;
              available = data['available'] != false;
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            Future<void> saveProperty() async {
              final title = titleController.text.trim();
              final location =
                  locationController.text.trim();
              final rentText = rentController.text.trim();

              if (title.isEmpty ||
                  location.isEmpty ||
                  rentText.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Please fill title, location and rent.',
                    ),
                  ),
                );
                return;
              }

              final rent = num.tryParse(rentText);

              if (rent == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Please enter a valid rent.',
                    ),
                  ),
                );
                return;
              }

              final discount =
                  num.tryParse(
                    discountController.text.trim(),
                  ) ??
                      0;

              final bedrooms =
                  int.tryParse(
                    bedroomsController.text.trim(),
                  ) ??
                      0;

              final bathrooms =
                  int.tryParse(
                    bathroomsController.text.trim(),
                  ) ??
                      0;

              final user =
                  FirebaseAuth.instance.currentUser;

              if (user == null) return;

              setState(() {
                saving = true;
              });

              try {
                final collection = FirebaseFirestore.instance
                    .collection('properties');

                final data = <String, dynamic>{
                  'title': title,
                  'propertyType': propertyType,
                  'location': location,
                  'monthlyRent': rent,
                  'discount': discount,
                  'bedrooms': bedrooms,
                  'bathrooms': bathrooms,
                  'description':
                      descriptionController.text.trim(),
                  'furnished': furnished,
                  'available': available,
                  'landlordId': user.uid,
                };

                if (widget.isEditing) {
                  data['updatedAt'] =
                      FieldValue.serverTimestamp();

                  await collection
                      .doc(widget.propertyId)
                      .update(data);
                } else {
                  data['createdAt'] =
                      FieldValue.serverTimestamp();

                  await collection.add(data);
                }

                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      widget.isEditing
                          ? 'Property updated successfully.'
                          : 'Property added successfully.',
                    ),
                  ),
                );

                Navigator.pop(context);
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Failed to save property: $e',
                    ),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() {
                    saving = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.isEditing
                        ? 'Edit Property'
                        : 'Add Property',
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    children: [
                      TextField(
                        controller: titleController,
                        decoration: const InputDecoration(
                          labelText: 'Property Title',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      DropdownButtonFormField<String>(
                        value: propertyType,
                        decoration: const InputDecoration(
                          labelText: 'Property Type',
                          border: OutlineInputBorder(),
                        ),
                        items: const [
                          DropdownMenuItem(
                            value: 'Room',
                            child: Text('Room'),
                          ),
                          DropdownMenuItem(
                            value: '1BHK',
                            child: Text('1BHK'),
                          ),
                          DropdownMenuItem(
                            value: '2BHK',
                            child: Text('2BHK'),
                          ),
                          DropdownMenuItem(
                            value: 'Flat',
                            child: Text('Flat'),
                          ),
                        ],
                        onChanged: (value) {
                          if (value == null) return;

                          setState(() {
                            propertyType = value;
                          });
                        },
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: locationController,
                        decoration: const InputDecoration(
                          labelText: 'Location',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: rentController,
                        keyboardType:
                            const TextInputType.numberWithOptions(
                          decimal: true,
                        ),
                        decoration: const InputDecoration(
                          labelText: 'Monthly Rent',
                          prefixText: 'Rs. ',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: discountController,
                        keyboardType:
                            const TextInputType.numberWithOptions(
                          decimal: true,
                        ),
                        decoration: const InputDecoration(
                          labelText: 'Discount',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: bedroomsController,
                              keyboardType:
                                  TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Bedrooms',
                                border: OutlineInputBorder(),
                              ),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: TextField(
                              controller: bathroomsController,
                              keyboardType:
                                  TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Bathrooms',
                                border: OutlineInputBorder(),
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: descriptionController,
                        maxLines: 5,
                        decoration: const InputDecoration(
                          labelText: 'Description',
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 12),
                      SwitchListTile(
                        title: const Text('Furnished'),
                        value: furnished,
                        onChanged: (value) {
                          setState(() {
                            furnished = value;
                          });
                        },
                      ),
                      SwitchListTile(
                        title: const Text('Available'),
                        value: available,
                        onChanged: (value) {
                          setState(() {
                            available = value;
                          });
                        },
                      ),
                      const SizedBox(height: 20),
                      SizedBox(
                        width: double.infinity,
                        height: 52,
                        child: FilledButton(
                          onPressed: saving
                              ? null
                              : saveProperty,
                          child: saving
                              ? const SizedBox(
                                  width: 22,
                                  height: 22,
                                  child: CircularProgressIndicator(
                                    strokeWidth: 2,
                                  ),
                                )
                              : Text(
                                  widget.isEditing
                                      ? 'Update Property'
                                      : 'Save Property',
                                ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class LandlordPropertyCard extends StatelessWidget {
            final String propertyId;
            final Map<String, dynamic> data;

            const LandlordPropertyCard({
              super.key,
              required this.propertyId,
              required this.data,
            });

            Future<void> deleteProperty(
              BuildContext context,
            ) async {
              final confirmed = await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text('Delete Property'),
                    content: const Text(
                      'Are you sure you want to delete this property?',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(
                            dialogContext,
                            false,
                          );
                        },
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(
                            dialogContext,
                            true,
                          );
                        },
                        child: const Text('Delete'),
                      ),
                    ],
                  );
                },
              );

              if (confirmed != true) return;

              try {
                await FirebaseFirestore.instance
                    .collection('properties')
                    .doc(propertyId)
                    .delete();

                if (!context.mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Property deleted.',
                    ),
                  ),
                );
              } catch (e) {
                if (!context.mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Failed to delete property: $e',
                    ),
                  ),
                );
              }
            }

            Future<void> toggleAvailability(
              BuildContext context,
            ) async {
              final current =
                  data['available'] != false;

              try {
                await FirebaseFirestore.instance
                    .collection('properties')
                    .doc(propertyId)
                    .update({
                  'available': !current,
                  'updatedAt': FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (!context.mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Failed to update property: $e',
                    ),
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final available = data['available'] != false;

              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              data['title'] ?? 'Property',
                              style: const TextStyle(
                                fontSize: 19,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                          PopupMenuButton<String>(
                            onSelected: (value) {
                              if (value == 'edit') {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        AddPropertyScreen(
                                      propertyId: propertyId,
                                      existingData: data,
                                    ),
                                  ),
                                );
                              }

                              if (value == 'toggle') {
                                toggleAvailability(context);
                              }

                              if (value == 'delete') {
                                deleteProperty(context);
                              }
                            },
                            itemBuilder: (_) => [
                              const PopupMenuItem(
                                value: 'edit',
                                child: Text('Edit'),
                              ),
                              PopupMenuItem(
                                value: 'toggle',
                                child: Text(
                                  available
                                      ? 'Mark Unavailable'
                                      : 'Mark Available',
                                ),
                              ),
                              const PopupMenuItem(
                                value: 'delete',
                                child: Text('Delete'),
                              ),
                            ],
                          ),
                        ],
                      ),
                      const SizedBox(height: 6),
                      Text(
                        data['location'] ?? '',
                      ),
                      const SizedBox(height: 8),
                      Text(
                        'Rs. ${data['monthlyRent'] ?? 0} / month',
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 8),
                      Wrap(
                        spacing: 12,
                        children: [
                          Text(
                            data['propertyType'] ?? '',
                          ),
                          Text(
                            '${data['bedrooms'] ?? 0} bedrooms',
                          ),
                          Text(
                            available
                                ? 'Available'
                                : 'Unavailable',
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Remove default tests
        run: |
          rm -rf build_app/test

      - name: Get Flutter dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build_app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json was not found in repository root."
            exit 1
          fi

          mkdir -p build_app/android/app
          cp google-services.json build_app/android/app/google-services.json

      # ---------------------------------------------------------
      # 8. Verify Firebase package
      # ---------------------------------------------------------
      - name: Verify Firebase package
        run: |
          python3 - <<'PY'
          import json

          with open("build_app/android/app/google-services.json", "r") as f:
              data = json.load(f)

          package_name = (
              data["client"][0]["client_info"]["android_client_info"]["package_name"]
          )

          print("Firebase Android package:", package_name)

          if package_name != "com.kothafinder.nepal":
              raise SystemExit(
                  "ERROR: Firebase package must be com.kothafinder.nepal"
              )
          PY

      # ---------------------------------------------------------
      # 9. Add Firebase packages
      # ---------------------------------------------------------
      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      # ---------------------------------------------------------
      # 10. Configure Google Services Gradle plugin
      # ---------------------------------------------------------
      - name: Configure Google Services plugin
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle
          settings = Path("android/settings.gradle")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id "com.google.gms.google-services" version "4.4.2" apply false"""
              )

          settings.write_text(text)

          # app/build.gradle
          app = Path("android/app/build.gradle")
          text = app.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id "com.google.gms.google-services" """
              )

          app.write_text(text)
          PY

      # ---------------------------------------------------------
      # 11. Create application
      # ---------------------------------------------------------
      - name: Create main.dart
