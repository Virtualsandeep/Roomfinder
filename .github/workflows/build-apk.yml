          class _LandlordHomeState
              extends State<LandlordHome> {
            Future<void> logout() async {
              await auth.signOut();
            }

            @override
            Widget build(BuildContext context) {
              final user = auth.currentUser;

              if (user == null) {
                return const AuthScreen();
              }

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('Landlord Dashboard'),
                  actions: [
                    StreamBuilder<
                        QuerySnapshot<
                            Map<String, dynamic>>>(
                      stream: db
                          .collection('inquiries')
                          .where(
                            'landlordId',
                            isEqualTo: user.uid,
                          )
                          .snapshots(),
                      builder: (
                        context,
                        snapshot,
                      ) {
                        final docs =
                            snapshot.data?.docs ?? [];

                        final unread = docs
                            .where(
                              (doc) =>
                                  doc.data()['isRead'] !=
                                  true,
                            )
                            .length;

                        return Stack(
                          children: [
                            IconButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const LandlordInquiriesScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(
                                Icons.message_outlined,
                              ),
                            ),
                            if (unread > 0)
                              Positioned(
                                right: 5,
                                top: 5,
                                child: CircleAvatar(
                                  radius: 9,
                                  child: Text(
                                    unread > 9
                                        ? '9+'
                                        : '$unread',
                                    style:
                                        const TextStyle(
                                      fontSize: 9,
                                    ),
                                  ),
                                ),
                              ),
                          ],
                        );
                      },
                    ),
                    IconButton(
                      onPressed: logout,
                      icon:
                          const Icon(Icons.logout),
                    ),
                  ],
                ),
                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) =>
                            const AddPropertyScreen(),
                      ),
                    );
                  },
                  icon: const Icon(Icons.add),
                  label: const Text(
                    'Add Property',
                  ),
                ),
                body: StreamBuilder<
                    QuerySnapshot<
                        Map<String, dynamic>>>(
                  stream: db
                      .collection('properties')
                      .where(
                        'landlordId',
                        isEqualTo: user.uid,
                      )
                      .snapshots(),
                  builder: (
                    context,
                    snapshot,
                  ) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child:
                            CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding:
                              const EdgeInsets.all(
                            24,
                          ),
                          child: Text(
                            snapshot.error
                                .toString(),
                            textAlign:
                                TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs =
                        snapshot.data?.docs ?? [];

                    if (docs.isEmpty) {
                      return const Center(
                        child: Text(
                          'No properties added yet.',
                        ),
                      );
                    }

                    return ListView.builder(
                      padding:
                          const EdgeInsets.all(16),
                      itemCount: docs.length,
                      itemBuilder: (
                        context,
                        index,
                      ) {
                        return LandlordPropertyCard(
