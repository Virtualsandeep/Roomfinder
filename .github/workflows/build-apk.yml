          // =====================================================
          // ADD / EDIT PROPERTY
          // =====================================================

          class AddPropertyScreen extends StatefulWidget {
            final String? propertyId;
            final Map<String, dynamic>? existingData;

            const AddPropertyScreen({
              super.key,
              this.propertyId,
              this.existingData,
            });

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            late final TextEditingController titleController;
            late final TextEditingController locationController;
            late final TextEditingController rentController;
            late final TextEditingController discountController;
            late final TextEditingController bedroomsController;
            late final TextEditingController bathroomsController;
            late final TextEditingController descriptionController;

            String propertyType = 'Room';
            bool furnished = false;
            bool available = true;
            bool saving = false;

            bool get editing =>
                widget.propertyId != null;

            @override
            void initState() {
              super.initState();

              final data =
                  widget.existingData ?? {};

              titleController = TextEditingController(
                text: data['title'] ?? '',
              );

              locationController =
                  TextEditingController(
                text: data['location'] ?? '',
              );

              rentController = TextEditingController(
                text: data['rent']?.toString() ?? '',
              );

              discountController =
                  TextEditingController(
                text: data['discount']?.toString() ?? '',
              );

              bedroomsController =
                  TextEditingController(
                text: data['bedrooms']?.toString() ??
                    '1',
              );

              bathroomsController =
                  TextEditingController(
                text:
                    data['bathrooms']?.toString() ??
                        '1',
              );

              descriptionController =
                  TextEditingController(
                text: data['description'] ?? '',
              );

              propertyType =
                  data['propertyType'] ?? 'Room';

              furnished =
                  data['furnished'] == true;

              available =
                  data['available'] != false;
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            Future<void> saveProperty() async {
              final title =
                  titleController.text.trim();

              final location =
                  locationController.text.trim();

              final rent =
                  double.tryParse(
                rentController.text.trim(),
              );

              final discount =
                  discountController.text.trim();

              final bedrooms =
                  int.tryParse(
                bedroomsController.text.trim(),
              );

              final bathrooms =
                  int.tryParse(
                bathroomsController.text.trim(),
              );

              final description =
                  descriptionController.text.trim();

              if (title.isEmpty ||
                  location.isEmpty ||
                  rent == null ||
                  bedrooms == null ||
                  bathrooms == null) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Please complete all required fields.',
                    ),
                  ),
                );
                return;
              }

              if (rent < 0 ||
                  bedrooms < 0 ||
                  bathrooms < 0) {
                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Please enter valid numbers.',
                    ),
                  ),
                );
                return;
              }

              final user =
                  FirebaseAuth.instance.currentUser;

              if (user == null) {
                return;
              }

              setState(() => saving = true);

              try {
                final data = {
                  'title': title,
                  'propertyType': propertyType,
                  'location': location,
                  'rent': rent,
                  'discount': discount,
                  'bedrooms': bedrooms,
                  'bathrooms': bathrooms,
                  'description': description,
                  'furnished': furnished,
                  'available': available,
                  'landlordId': user.uid,
                };

                if (editing) {
                  data['updatedAt'] =
                      FieldValue.serverTimestamp();

                  await FirebaseFirestore.instance
                      .collection('properties')
                      .doc(widget.propertyId)
                      .update(data);
                } else {
                  data['createdAt'] =
                      FieldValue.serverTimestamp();

                  await FirebaseFirestore.instance
                      .collection('properties')
                      .add(data);
                }

                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      editing
                          ? 'Property updated.'
                          : 'Property added.',
                    ),
                  ),
                );

                Navigator.pop(context);
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      'Unable to save property: $e',
                    ),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() => saving = false);
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    editing
                        ? 'Edit Property'
                        : 'Add Property',
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    children: [
                      TextField(
                        controller: titleController,
                        decoration:
                            const InputDecoration(
                          labelText: 'Property title *',
                        ),
                      ),
                      const SizedBox(height: 14),
                      DropdownButtonFormField<String>(
                        value: propertyType,
                        decoration:
                            const InputDecoration(
                          labelText: 'Property type',
                        ),
                        items: const [
                          DropdownMenuItem(
                            value: 'Room',
                            child: Text('Room'),
                          ),
                          DropdownMenuItem(
                            value: '1BHK',
                            child: Text('1BHK'),
                          ),
                          DropdownMenuItem(
                            value: '2BHK',
                            child: Text('2BHK'),
                          ),
                          DropdownMenuItem(
                            value: 'Flat',
                            child: Text('Flat'),
                          ),
                        ],
                        onChanged: (value) {
                          if (value != null) {
                            setState(() {
                              propertyType =
                                  value;
                            });
                          }
                        },
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller: locationController,
                        decoration:
                            const InputDecoration(
                          labelText: 'Location *',
                        ),
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller: rentController,
                        keyboardType:
                            TextInputType.number,
                        decoration:
                            const InputDecoration(
                          labelText:
                              'Monthly rent *',
                          prefixText: 'Rs. ',
                        ),
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller: discountController,
                        decoration:
                            const InputDecoration(
                          labelText:
                              'Discount',
                          hintText:
                              'Example: 10% or Rs. 1000',
                        ),
                      ),
                      const SizedBox(height: 14),
                      Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller:
                                  bedroomsController,
                              keyboardType:
                                  TextInputType.number,
                              decoration:
                                  const InputDecoration(
                                labelText:
                                    'Bedrooms *',
                              ),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: TextField(
                              controller:
                                  bathroomsController,
                              keyboardType:
                                  TextInputType.number,
                              decoration:
                                  const InputDecoration(
                                labelText:
                                    'Bathrooms *',
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller:
                            descriptionController,
                        maxLines: 5,
                        decoration:
                            const InputDecoration(
                          labelText: 'Description',
                          alignLabelWithHint: true,
                        ),
                      ),
                      const SizedBox(height: 10),
                      SwitchListTile(
                        title:
                            const Text('Furnished'),
                        value: furnished,
                        onChanged: (value) {
                          setState(() {
                            furnished = value;
                          });
                        },
                      ),
                      SwitchListTile(
                        title:
                            const Text('Available'),
                        value: available,
                        onChanged: (value) {
                          setState(() {
                            available = value;
                          });
                        },
                      ),
                      const SizedBox(height: 18),
                      SizedBox(
                        width: double.infinity,
                        height: 54,
                        child: FilledButton(
                          onPressed:
                              saving
                                  ? null
                                  : saveProperty,
                          child: saving
                              ? const CircularProgressIndicator()
                              : Text(
                                  editing
                                      ? 'Update Property'
                                      : 'Save Property',
                                ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // =====================================================
          // LANDLORD PROPERTY CARD
          // =====================================================

          class LandlordPropertyCard
              extends StatelessWidget {
            final String propertyId;
            final Map<String, dynamic> data;

            const LandlordPropertyCard({
              super.key,
              required this.propertyId,
              required this.data,
            });

            Future<void> deleteProperty(
              BuildContext context,
            ) async {
              final confirmed =
                  await showDialog<bool>(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    title: const Text(
                      'Delete property?',
                    ),
                    content: const Text(
                      'This property will be permanently deleted.',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(
                            context,
                            false,
                          );
                        },
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(
                            context,
                            true,
                          );
                        },
                        child: const Text('Delete'),
                      ),
                    ],
                  );
                },
              );

              if (confirmed != true) return;

              await FirebaseFirestore.instance
                  .collection('properties')
                  .doc(propertyId)
                  .delete();
            }

            Future<void> toggleAvailability() async {
              final current =
                  data['available'] != false;

              await FirebaseFirestore.instance
                  .collection('properties')
                  .doc(propertyId)
                  .update({
                'available': !current,
                'updatedAt':
                    FieldValue.serverTimestamp(),
              });
            }

            @override
            Widget build(BuildContext context) {
              final available =
                  data['available'] != false;

              return Card(
                margin: const EdgeInsets.only(
                  bottom: 12,
                ),
                child: ListTile(
                  contentPadding:
                      const EdgeInsets.all(14),
                  title: Text(
                    data['title'] ??
                        'Untitled property',
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  subtitle: Padding(
                    padding:
                        const EdgeInsets.only(
                      top: 8,
                    ),
                    child: Text(
                      '${data['location'] ?? ''}\n'
                      'Rs. ${data['rent'] ?? 0}/month\n'
                      '${available ? 'Available' : 'Unavailable'}',
                    ),
                  ),
                  isThreeLine: true,
                  trailing: PopupMenuButton<String>(
                    onSelected: (value) async {
                      if (value == 'edit') {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                AddPropertyScreen(
                              propertyId:
                                  propertyId,
                              existingData: data,
                            ),
                          ),
                        );
                      }

                      if (value == 'toggle') {
                        await toggleAvailability();
                      }

                      if (value == 'delete') {
                        await deleteProperty(
                          context,
                        );
                      }
                    },
                    itemBuilder: (context) {
                      return [
                        const PopupMenuItem(
                          value: 'edit',
                          child: Text('Edit'),
                        ),
                        PopupMenuItem(
                          value: 'toggle',
                          child: Text(
                            available
                                ? 'Mark Unavailable'
                                : 'Mark Available',
                          ),
                        ),
                        const PopupMenuItem(
                          value: 'delete',
                          child: Text('Delete'),
                        ),
                      ];
                    },
                  ),
                ),
              );
            }
          }
