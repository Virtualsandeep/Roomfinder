                          onChanged: (value) {
                            setState(() {
                              available = value;
                            });
                          },
                        ),
                        const SizedBox(height: 15),
                        SizedBox(
                          height: 52,
                          child: FilledButton(
                            onPressed:
                                loading
                                    ? null
                                    : saveProperty,
                            child: loading
                                ? const SizedBox(
                                    width: 22,
                                    height: 22,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : Text(
                                    editing
                                        ? 'Update Property'
                                        : 'Add Property',
                                  ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class LandlordInquiriesScreen
              extends StatelessWidget {
