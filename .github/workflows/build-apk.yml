name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SET UP FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ============================================================
      # 3. CREATE FLUTTER PROJECT
      # ============================================================
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      # ============================================================
      # 4. CONFIGURE ANDROID APPLICATION ID
      # ============================================================
      - name: Configure Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "namespace = \"com.example.kothafinder_nepal\"",
              "namespace = \"com.kothafinder.nepal\""
          )

          text = text.replace(
              "applicationId = \"com.example.kothafinder_nepal\"",
              "applicationId = \"com.kothafinder.nepal\""
          )

          path.write_text(text)
          PY

      # ============================================================
      # 5. CONFIGURE MINIMUM ANDROID SDK
      # ============================================================
      - name: Configure minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          path.write_text(text)
          PY

      # ============================================================
      # 6. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        run: |
          grep -n "namespace" build_app/android/app/build.gradle
          grep -n "applicationId" build_app/android/app/build.gradle
          grep -n "minSdk" build_app/android/app/build.gradle

      # ============================================================
      # 7. COPY FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          test -f google-services.json
          cp google-services.json build_app/android/app/google-services.json

      # ============================================================
      # 8. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q "com.kothafinder.nepal" build_app/android/app/google-services.json

      # ============================================================
      # 9. ADD PACKAGES
      # ============================================================
      - name: Add Firebase and Maps packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add url_launcher

      # ============================================================
      # 10. CONFIGURE GOOGLE SERVICES GRADLE PLUGIN
      # ============================================================
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/settings.gradle")
          text = path.read_text()

          old = 'id "dev.flutter.flutter-plugin-loader" version "1.0.0"'

          new = '''id "dev.flutter.flutter-plugin-loader" version "1.0.0"
          id "com.google.gms.google-services" version "4.4.2" apply false'''

          if "com.google.gms.google-services" not in text:
              text = text.replace(old, new)

          path.write_text(text)

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          if 'id "com.google.gms.google-services"' not in text:
              marker = "plugins {"
              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "Could not find plugins block in app/build.gradle"
                  )

              insert_at = index + len(marker)

              text = (
                  text[:insert_at]
                  + '\n    id "com.google.gms.google-services"'
                  + text[insert_at:]
              )

          path.write_text(text)
          PY

      # ============================================================
      # 11. VERIFY FIREBASE ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Firebase Android configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q '"project_info"' build_app/android/app/google-services.json
          grep -q '"client"' build_app/android/app/google-services.json

      # ============================================================
      # 12. CREATE COMPLETE APPLICATION
      # ============================================================
      - name: Create application
        run: |
          cat > build_app/lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';

          final FirebaseAuth auth = FirebaseAuth.instance;
          final FirebaseFirestore db = FirebaseFirestore.instance;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: const Color(0xFF3156D3),
                  scaffoldBackgroundColor: const Color(0xFFF7F8FC),
                  inputDecorationTheme: const InputDecorationTheme(
                    border: OutlineInputBorder(),
                  ),
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: auth.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (!snapshot.hasData) {
                    return const AuthScreen();
                  }

                  return RoleGate(userId: snapshot.data!.uid);
                },
              );
            }
          }

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          class RoleGate extends StatelessWidget {
            final String userId;

            const RoleGate({
              super.key,
              required this.userId,
            });

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<
                  DocumentSnapshot<Map<String, dynamic>>>(
                stream: db.collection('users').doc(userId).snapshots(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (snapshot.hasError) {
                    return ErrorScreen(
                      message: 'Could not load your account.',
                    );
                  }

                  final data = snapshot.data?.data();
                  final role = data?['role'];

                  if (role == 'landlord') {
                    return const LandlordHome();
                  }

                  return CustomerHome(
                    needsRole: role == null,
                  );
                },
              );
            }
          }

          class ErrorScreen extends StatelessWidget {
            final String message;

            const ErrorScreen({
              super.key,
              required this.message,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(
                          Icons.error_outline,
                          size: 56,
                        ),
                        const SizedBox(height: 16),
                        Text(
                          message,
                          textAlign: TextAlign.center,
                        ),
                        const SizedBox(height: 20),
                        FilledButton(
                          onPressed: () {
                            auth.signOut();
                          },
                          child: const Text('Sign out'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> login() async {
              final email = emailController.text.trim();
              final password = passwordController.text.trim();

              if (email.isEmpty || password.isEmpty) {
                showMessage(
                  context,
                  'Please enter email and password.',
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                await auth.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  e.message ?? 'Login failed.',
                );
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Login failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(
                          maxWidth: 480,
                        ),
                        child: Card(
                          child: Padding(
                            padding: const EdgeInsets.all(24),
                            child: Column(
                              children: [
                                const Icon(
                                  Icons.home_work_rounded,
                                  size: 64,
                                ),
                                const SizedBox(height: 16),
                                const Text(
                                  'KothaFinder Nepal',
                                  style: TextStyle(
                                    fontSize: 28,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                const SizedBox(height: 8),
                                const Text(
                                  'Find rooms and properties in Nepal',
                                  textAlign: TextAlign.center,
                                ),
                                const SizedBox(height: 28),
                                TextField(
                                  controller: emailController,
                                  keyboardType:
                                      TextInputType.emailAddress,
                                  decoration: const InputDecoration(
                                    labelText: 'Email',
                                    prefixIcon: Icon(Icons.email_outlined),
                                  ),
                                ),
                                const SizedBox(height: 16),
                                TextField(
                                  controller: passwordController,
                                  obscureText: obscurePassword,
                                  decoration: InputDecoration(
                                    labelText: 'Password',
                                    prefixIcon:
                                        const Icon(Icons.lock_outline),
                                    suffixIcon: IconButton(
                                      onPressed: () {
                                        setState(() {
                                          obscurePassword =
                                              !obscurePassword;
                                        });
                                      },
                                      icon: Icon(
                                        obscurePassword
                                            ? Icons.visibility
                                            : Icons.visibility_off,
                                      ),
                                    ),
                                  ),
                                ),
                                const SizedBox(height: 20),
                                SizedBox(
                                  width: double.infinity,
                                  child: FilledButton(
                                    onPressed: loading ? null : login,
                                    child: loading
                                        ? const SizedBox(
                                            height: 20,
                                            width: 20,
                                            child:
                                                CircularProgressIndicator(
                                              strokeWidth: 2,
                                            ),
                                          )
                                        : const Text('Login'),
                                  ),
                                ),
                                const SizedBox(height: 8),
                                TextButton(
                                  onPressed: loading
                                      ? null
                                      : () {
                                          Navigator.push(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) =>
                                                  const RegisterScreen(),
                                            ),
                                          );
                                        },
                                  child: const Text(
                                    'Create a new account',
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() => _RegisterScreenState();
          }

          class _RegisterScreenState extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> register() async {
              final name = nameController.text.trim();
              final email = emailController.text.trim();
              final password = passwordController.text.trim();

              if (name.isEmpty ||
                  email.isEmpty ||
                  password.isEmpty) {
                showMessage(
                  context,
                  'Please complete all fields.',
                );
                return;
              }

              if (password.length < 6) {
                showMessage(
                  context,
                  'Password must contain at least 6 characters.',
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                final credential =
                    await auth.createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception('Account creation failed.');
                }

                await user.updateDisplayName(name);

                await db.collection('users').doc(user.uid).set({
                  'uid': user.uid,
                  'name': name,
                  'email': email,
                  'role': role,
                  'createdAt': FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                Navigator.pop(context);
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  e.message ?? 'Registration failed.',
                );
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Registration failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      children: [
                        TextField(
                          controller: nameController,
                          textCapitalization: TextCapitalization.words,
                          decoration: const InputDecoration(
                            labelText: 'Full name',
                            prefixIcon: Icon(Icons.person_outline),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller: emailController,
                          keyboardType:
                              TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            labelText: 'Email',
                            prefixIcon: Icon(Icons.email_outlined),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller: passwordController,
                          obscureText: true,
                          decoration: const InputDecoration(
                            labelText: 'Password',
                            prefixIcon: Icon(Icons.lock_outline),
                          ),
                        ),
                        const SizedBox(height: 20),
                        Align(
                          alignment: Alignment.centerLeft,
                          child: Text(
                            'Account type',
                            style: Theme.of(context)
                                .textTheme
                                .titleMedium,
                          ),
                        ),
                        const SizedBox(height: 8),
                        SegmentedButton<String>(
                          segments: const [
                            ButtonSegment(
                              value: 'customer',
                              label: Text('Customer'),
                              icon: Icon(Icons.person),
                            ),
                            ButtonSegment(
                              value: 'landlord',
                              label: Text('Landlord'),
                              icon: Icon(Icons.home_work),
                            ),
                          ],
                          selected: {role},
                          onSelectionChanged: loading
                              ? null
                              : (selection) {
                                  setState(() {
                                    role = selection.first;
                                  });
                                },
                        ),
                        const SizedBox(height: 24),
                        SizedBox(
                          width: double.infinity,
                          child: FilledButton(
                            onPressed: loading ? null : register,
                            child: loading
                                ? const SizedBox(
                                    height: 20,
                                    width: 20,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : const Text('Create Account'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class CustomerHome extends StatefulWidget {
            final bool needsRole;

            const CustomerHome({
              super.key,
              this.needsRole = false,
            });

            @override
            State<CustomerHome> createState() => _CustomerHomeState();
          }

          class _CustomerHomeState extends State<CustomerHome> {
            final searchController = TextEditingController();

            String selectedType = 'All';
            String selectedFurnished = 'All';
            int minBedrooms = 0;
            bool onlyAvailable = false;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            List<QueryDocumentSnapshot<Map<String, dynamic>>>
                filterProperties(
              List<QueryDocumentSnapshot<Map<String, dynamic>>> docs,
            ) {
              final search =
                  searchController.text.trim().toLowerCase();

              final filtered = docs.where((doc) {
                final data = doc.data();

                final title =
                    (data['title'] ?? '').toString().toLowerCase();
                final location =
                    (data['location'] ?? '').toString().toLowerCase();

                final propertyType =
                    (data['propertyType'] ?? 'Room').toString();

                final furnished =
                    (data['furnished'] ?? 'Unfurnished').toString();

                final bedrooms =
                    int.tryParse(
                          '${data['bedrooms'] ?? 0}',
                        ) ??
                        0;

                final available =
                    data['available'] == true;

                final searchMatch = search.isEmpty ||
                    title.contains(search) ||
                    location.contains(search);

                final typeMatch = selectedType == 'All' ||
                    propertyType == selectedType;

                final furnishedMatch =
                    selectedFurnished == 'All' ||
                        furnished == selectedFurnished;

                final bedroomMatch = bedrooms >= minBedrooms;

                final availabilityMatch =
                    !onlyAvailable || available;

                return searchMatch &&
                    typeMatch &&
                    furnishedMatch &&
                    bedroomMatch &&
                    availabilityMatch;
              }).toList();

              filtered.sort((a, b) {
                final aTime = a.data()['createdAt'];
                final bTime = b.data()['createdAt'];

                if (aTime is Timestamp && bTime is Timestamp) {
                  return bTime.compareTo(aTime);
                }

                return 0;
              });

              return filtered;
            }

            Future<void> openFilters() async {
              final result = await showModalBottomSheet<
                  Map<String, dynamic>>(
                context: context,
                isScrollControlled: true,
                builder: (_) {
                  return _FilterSheet(
                    selectedType: selectedType,
                    selectedFurnished: selectedFurnished,
                    minBedrooms: minBedrooms,
                    onlyAvailable: onlyAvailable,
                  );
                },
              );

              if (result == null || !mounted) return;

              setState(() {
                selectedType =
                    result['propertyType'] as String;
                selectedFurnished =
                    result['furnished'] as String;
                minBedrooms =
                    result['minBedrooms'] as int;
                onlyAvailable =
                    result['onlyAvailable'] as bool;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  actions: [
                    StreamBuilder<
                        QuerySnapshot<Map<String, dynamic>>>(
                      stream: db
                          .collection('inquiries')
                          .where(
                            'customerId',
                            isEqualTo: auth.currentUser?.uid,
                          )
                          .snapshots(),
                      builder: (context, snapshot) {
                        int unread = 0;

                        if (snapshot.hasData) {
                          unread = snapshot.data!.docs.where((doc) {
                            final data = doc.data();
                            return data['isRead'] != true;
                          }).length;
                        }

                        return Stack(
                          children: [
                            IconButton(
                              tooltip: 'My Inquiries',
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const CustomerInquiriesScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(
                                Icons.chat_bubble_outline,
                              ),
                            ),
                            if (unread > 0)
                              Positioned(
                                right: 7,
                                top: 6,
                                child: Container(
                                  padding: const EdgeInsets.symmetric(
                                    horizontal: 5,
                                    vertical: 2,
                                  ),
                                  decoration: BoxDecoration(
                                    color: Colors.red,
                                    borderRadius:
                                        BorderRadius.circular(10),
                                  ),
                                  child: Text(
                                    unread > 99
                                        ? '99+'
                                        : '$unread',
                                    style: const TextStyle(
                                      color: Colors.white,
                                      fontSize: 10,
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                ),
                              ),
                          ],
                        );
                      },
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: () async {
                        await auth.signOut();
                      },
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: db.collection('properties').snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Could not load properties.\n\n'
                            '${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs = snapshot.data?.docs ?? [];
                    final filtered = filterProperties(docs);

                    return Column(
                      children: [
                        Padding(
                          padding: const EdgeInsets.fromLTRB(
                            16,
                            16,
                            16,
                            8,
                          ),
                          child: Row(
                            children: [
                              Expanded(
                                child: TextField(
                                  controller: searchController,
                                  onChanged: (_) {
                                    setState(() {});
                                  },
                                  decoration: InputDecoration(
                                    hintText:
                                        'Search location or property',
                                    prefixIcon:
                                        const Icon(Icons.search),
                                    suffixIcon:
                                        searchController.text.isEmpty
                                            ? null
                                            : IconButton(
                                                onPressed: () {
                                                  searchController.clear();
                                                  setState(() {});
                                                },
                                                icon: const Icon(
                                                  Icons.clear,
                                                ),
                                              ),
                                  ),
                                ),
                              ),
                              const SizedBox(width: 8),
                              IconButton.filledTonal(
                                onPressed: openFilters,
                                icon: const Icon(Icons.tune),
                              ),
                            ],
                          ),
                        ),
                        Expanded(
                          child: filtered.isEmpty
                              ? const Center(
                                  child: Padding(
                                    padding: EdgeInsets.all(24),
                                    child: Text(
                                      'No properties found.\n'
                                      'Try changing your search or filters.',
                                      textAlign: TextAlign.center,
                                    ),
                                  ),
                                )
                              : ListView.builder(
                                  padding: const EdgeInsets.all(12),
                                  itemCount: filtered.length,
                                  itemBuilder: (context, index) {
                                    final doc = filtered[index];

                                    return PropertyCard(
                                      doc: doc,
                                      onTap: () {
                                        Navigator.push(
                                          context,
                                          MaterialPageRoute(
                                            builder: (_) =>
                                                PropertyDetailsScreen(
                                              doc: doc,
                                            ),
                                          ),
                                        );
                                      },
                                    );
                                  },
                                ),
                        ),
                      ],
                    );
                  },
                ),
              );
            }
          }

          class _FilterSheet extends StatefulWidget {
            final String selectedType;
            final String selectedFurnished;
            final int minBedrooms;
            final bool onlyAvailable;

            const _FilterSheet({
              required this.selectedType,
              required this.selectedFurnished,
              required this.minBedrooms,
              required this.onlyAvailable,
            });

            @override
            State<_FilterSheet> createState() => _FilterSheetState();
          }

          class _FilterSheetState extends State<_FilterSheet> {
            late String type;
            late String furnished;
            late int bedrooms;
            late bool available;

            @override
            void initState() {
              super.initState();

              type = widget.selectedType;
              furnished = widget.selectedFurnished;
              bedrooms = widget.minBedrooms;
              available = widget.onlyAvailable;
            }

