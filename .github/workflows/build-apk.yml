            const InquiryCard({
              super.key,
              required this.inquiryId,
              required this.data,
            });

            Future<void> markAsRead(
              BuildContext context,
            ) async {
              try {
                await FirebaseFirestore.instance
                    .collection('inquiries')
                    .doc(inquiryId)
                    .update({
                  'status': 'read',
                });
              } catch (e) {
                if (!context.mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      'Unable to update inquiry: $e',
                    ),
                  ),
                );
              }
            }

