          class PropertyDetailsScreen extends StatelessWidget {
            final String propertyId;
            final Map<String, dynamic> data;

            const PropertyDetailsScreen({
              super.key,
              required this.propertyId,
              required this.data,
            });

            Future<void> contactLandlord(
              BuildContext context,
            ) async {
              final landlordId =
                  data['landlordId']?.toString();

              if (landlordId == null ||
                  landlordId.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Landlord information is unavailable.',
                    ),
                  ),
                );
                return;
              }

              final customer = auth.currentUser;

              if (customer == null) return;

              final customerDoc =
                  await db
                      .collection('users')
                      .doc(customer.uid)
                      .get();

              final landlordDoc =
                  await db
                      .collection('users')
                      .doc(landlordId)
                      .get();

              final customerData =
                  customerDoc.data() ?? {};

              final landlordData =
                  landlordDoc.data() ?? {};

              final messageController =
                  TextEditingController();

              if (!context.mounted) return;

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text(
                      'Contact Landlord',
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment:
                          CrossAxisAlignment.start,
                      children: [
                        Text(
                          'Landlord: ${landlordData['name'] ?? 'Landlord'}',
                        ),
                        const SizedBox(height: 5),
                        Text(
                          'Email: ${landlordData['email'] ?? 'Not provided'}',
                        ),
                        const SizedBox(height: 18),
                        TextField(
                          controller: messageController,
                          maxLines: 4,
                          decoration:
                              const InputDecoration(
                            labelText: 'Your message',
                            hintText:
                                'I am interested in this property...',
                          ),
                        ),
                      ],
                    ),
                    actions: [
                      TextButton(
                        onPressed: () =>
                            Navigator.pop(dialogContext),
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () async {
                          final message =
                              messageController.text.trim();

                          if (message.isEmpty) {
                            ScaffoldMessenger.of(context)
                                .showSnackBar(
                              const SnackBar(
                                content: Text(
                                  'Please enter a message.',
                                ),
                              ),
                            );
                            return;
                          }

                          try {
                            await db
                                .collection('inquiries')
                                .add({
                              'customerId':
                                  customer.uid,
                              'customerName':
                                  customerData['name'] ??
                                      customer.displayName ??
                                      'Customer',
                              'customerEmail':
                                  customerData['email'] ??
                                      customer.email ??
                                      '',
                              'landlordId':
                                  landlordId,
                              'landlordName':
                                  landlordData['name'] ??
                                      'Landlord',
                              'landlordEmail':
                                  landlordData['email'] ??
                                      '',
                              'propertyId': propertyId,
                              'propertyTitle':
                                  data['title'] ??
                                      'Property',
                              'message': message,
                              'status': 'new',
                              'isRead': false,
                              'createdAt':
                                  FieldValue.serverTimestamp(),
                            });

                            if (dialogContext.mounted) {
                              Navigator.pop(dialogContext);
                            }

                            if (context.mounted) {
                              ScaffoldMessenger.of(context)
                                  .showSnackBar(
                                const SnackBar(
                                  content: Text(
                                    'Inquiry sent successfully.',
                                  ),
                                ),
                              );
                            }
                          } catch (e) {
                            if (context.mounted) {
                              ScaffoldMessenger.of(context)
                                  .showSnackBar(
                                SnackBar(
                                  content: Text(
                                    'Could not send inquiry: $e',
                                  ),
                                ),
                              );
                            }
                          }
                        },
                        child: const Text('Send'),
                      ),
                    ],
                  );
                },
              );

              messageController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final available =
                  data['available'] != false;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Property Details'),
                ),
                body: ListView(
