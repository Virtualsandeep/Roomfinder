          // ============================================================
          // INQUIRY DETAILS
          // ============================================================

          class InquiryDetailsScreen
              extends StatefulWidget {
            final QueryDocumentSnapshot<
                Map<String, dynamic>> doc;

            final bool landlordView;

            const InquiryDetailsScreen({
              super.key,
              required this.doc,
              required this.landlordView,
            });

            @override
            State<InquiryDetailsScreen> createState() =>
                _InquiryDetailsScreenState();
          }

          class _InquiryDetailsScreenState
              extends State<
                  InquiryDetailsScreen> {
            bool loading = false;

            @override
            void initState() {
              super.initState();

              markAsRead();
            }

            Future<void> markAsRead() async {
              try {
                await db
                    .collection('inquiries')
                    .doc(widget.doc.id)
                    .update({
                  'isRead': true,
                });
              } catch (_) {}
            }

            Future<void> updateStatus(
              String status,
            ) async {
              setState(() {
                loading = true;
              });

              try {
                await db
                    .collection('inquiries')
                    .doc(widget.doc.id)
                    .update({
                  'status': status,
                  'isRead': true,
                });

                if (!mounted) return;

                showMessage(
                  context,
                  'Inquiry status updated.',
                );
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Could not update status: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final data = widget.doc.data();

              final customerName =
                  data['customerName'] ??
                      'Customer';

              final customerEmail =
                  data['customerEmail'] ??
                      '';

              final landlordName =
                  data['landlordName'] ??
                      'Landlord';

              final landlordEmail =
                  data['landlordEmail'] ??
                      '';

              final propertyTitle =
                  data['propertyTitle'] ??
                      'Property';

              final message =
                  data['message'] ?? '';

              final status =
                  data['status'] ?? 'new';

              final createdAt =
                  data['createdAt'] as Timestamp?;

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('Inquiry Details'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      _InfoSection(
                        title: 'Property',
                        child: Text(
                          propertyTitle.toString(),
                          style:
                              const TextStyle(
                            fontSize: 20,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                      ),
                      _InfoSection(
                        title: widget.landlordView
                            ? 'Customer'
                            : 'Landlord',
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              widget.landlordView
                                  ? customerName
                                      .toString()
                                  : landlordName
                                      .toString(),
                              style:
                                  const TextStyle(
                                fontWeight:
                                    FontWeight.bold,
                              ),
                            ),
                            const SizedBox(
                              height: 4,
                            ),
                            Text(
                              widget.landlordView
                                  ? customerEmail
                                      .toString()
                                  : landlordEmail
                                      .toString(),
                            ),
                          ],
                        ),
                      ),
                      _InfoSection(
                        title: 'Message',
                        child: Text(
                          message.toString(),
                        ),
                      ),
                      _InfoSection(
                        title: 'Status',
                        child: _StatusChip(
                          status:
                              status.toString(),
                        ),
                      ),
                      if (createdAt != null)
                        _InfoSection(
                          title: 'Sent',
                          child: Text(
                            _formatDate(
                              createdAt,
                            ),
                          ),
                        ),
                      if (widget.landlordView) ...[
                        const SizedBox(height: 16),
                        const Text(
                          'Update Status',
                          style: TextStyle(
                            fontSize: 18,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        Wrap(
                          spacing: 8,
                          runSpacing: 8,
                          children: [
                            for (final value in [
                              'new',
                              'accepted',
                              'contacted',
                              'closed',
                            ])
                              ChoiceChip(
                                label:
                                    Text(value),
                                selected:
                                    status ==
                                        value,
                                onSelected: loading
                                    ? null
                                    : (_) {
                                        updateStatus(
                                          value,
                                        );
                                      },
                              ),
                          ],
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }

