                            '${data['bedrooms'] ?? 0} bedrooms',
                          ),
                          _detailChip(
                            Icons.bathtub_outlined,
                            '${data['bathrooms'] ?? 0} bathrooms',
                          ),
                          _detailChip(
                            Icons.weekend_outlined,
                            data['furnished'] == true
                                ? 'Furnished'
                                : 'Unfurnished',
                          ),
                          _detailChip(
