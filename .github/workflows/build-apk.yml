          class CustomerInquiriesScreen extends StatelessWidget {
            const CustomerInquiriesScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final user = FirebaseAuth.instance.currentUser;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('My Inquiries'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('inquiries')
                      .where(
                        'customerId',
                        isEqualTo: user?.uid,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Error loading inquiries:\n'
                            '${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs =
                        List<QueryDocumentSnapshot<
                            Map<String, dynamic>>>.from(
                      snapshot.data?.docs ?? [],
                    );

                    docs.sort((a, b) {
                      final aTime =
                          a.data()['createdAt'] as Timestamp?;
                      final bTime =
                          b.data()['createdAt'] as Timestamp?;

                      if (aTime == null && bTime == null) {
                        return 0;
                      }

                      if (aTime == null) return 1;
                      if (bTime == null) return -1;

                      return bTime.compareTo(aTime);
                    });

                    if (docs.isEmpty) {
                      return const Center(
                        child: Text(
                          'You have not sent any inquiries yet.',
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: docs.length,
                      itemBuilder: (context, index) {
                        final doc = docs[index];

                        return CustomerInquiryCard(
                          inquiryId: doc.id,
                          data: doc.data(),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

