          class AddPropertyScreen extends StatefulWidget {
            const AddPropertyScreen({
              super.key,
              this.documentId,
              this.existingData,
            });

            final String? documentId;
            final Map<String, dynamic>? existingData;

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            final titleController =
                TextEditingController();

            final locationController =
                TextEditingController();

            final rentController =
                TextEditingController();

            final discountController =
                TextEditingController();

            final bedroomsController =
                TextEditingController();

            final bathroomsController =
                TextEditingController();

            final descriptionController =
                TextEditingController();

            String propertyType = 'Room';
            String furnishedStatus =
                'Unfurnished';

            bool available = true;
            bool saving = false;
            String errorMessage = '';

            @override
            void initState() {
              super.initState();

              final data =
                  widget.existingData;

              if (data != null) {
                titleController.text =
                    (data['title'] ?? '')
                        .toString();

                locationController.text =
                    (data['location'] ?? '')
                        .toString();

                rentController.text =
                    (data['rent'] ?? '')
                        .toString();

                discountController.text =
                    (data['discount'] ?? 0)
                        .toString();

                bedroomsController.text =
                    (data['bedrooms'] ?? '')
                        .toString();

                bathroomsController.text =
                    (data['bathrooms'] ?? '')
                        .toString();

                descriptionController.text =
                    (data['description'] ?? '')
                        .toString();

                propertyType =
                    (data['propertyType'] ??
                            'Room')
                        .toString();

                furnishedStatus =
                    (data['furnished'] ??
                            'Unfurnished')
                        .toString();

                available =
                    data['available'] == true;
              }
            }

            Future<void> saveProperty() async {
              if (titleController.text
                  .trim()
                  .isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter a property title.';
                });
                return;
              }

              if (locationController.text
                  .trim()
                  .isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the location.';
                });
                return;
              }

              if (rentController.text
                  .trim()
                  .isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the monthly rent.';
                });
                return;
              }

              final rent =
                  double.tryParse(
                rentController.text.trim(),
              );

              if (rent == null ||
                  rent < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid rent amount.';
                });
                return;
              }

              final discountText =
                  discountController.text
                      .trim();

              final discount =
                  discountText.isEmpty
                      ? 0.0
                      : double.tryParse(
                          discountText,
                        );

              if (discount == null ||
                  discount < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid discount.';
                });
                return;
              }

              final bedrooms =
                  int.tryParse(
                bedroomsController.text
                    .trim(),
              );

              final bathrooms =
                  int.tryParse(
                bathroomsController.text
                    .trim(),
              );

              if (bedrooms == null ||
                  bedrooms < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid number of bedrooms.';
                });
                return;
              }

              if (bathrooms == null ||
                  bathrooms < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid number of bathrooms.';
                });
                return;
              }

              final user =
                  FirebaseAuth.instance
                      .currentUser;

              if (user == null) {
                setState(() {
                  errorMessage =
                      'You must be logged in.';
                });
                return;
              }

              setState(() {
                saving = true;
                errorMessage = '';
              });

              try {
                final data = {
                  'landlordId':
                      user.uid,
                  'title':
                      titleController.text
                          .trim(),
                  'propertyType':
                      propertyType,
                  'location':
                      locationController.text
                          .trim(),
                  'rent': rent,
                  'discount':
                      discount,
                  'bedrooms':
                      bedrooms,
                  'bathrooms':
                      bathrooms,
                  'description':
                      descriptionController
                          .text
                          .trim(),
                  'furnished':
                      furnishedStatus,
                  'available':
                      available,
                };

                if (widget.documentId ==
                    null) {
                  data['createdAt'] =
                      FieldValue
                          .serverTimestamp();

                  await FirebaseFirestore
                      .instance
                      .collection(
                          'properties')
                      .add(data);
                } else {
                  data['updatedAt'] =
                      FieldValue
                          .serverTimestamp();

                  await FirebaseFirestore
                      .instance
                      .collection(
                          'properties')
                      .doc(widget.documentId)
                      .update(data);
                }

                if (!mounted) return;

                ScaffoldMessenger.of(
                  context,
                ).showSnackBar(
                  SnackBar(
                    content: Text(
                      widget.documentId ==
                              null
                          ? 'Property added successfully.'
                          : 'Property updated successfully.',
                    ),
                  ),
                );

                Navigator.pop(context);
              } catch (_) {
                if (mounted) {
                  setState(() {
                    errorMessage =
                        'Could not save property. Please try again.';
                  });
                }
              } finally {
                if (mounted) {
                  setState(() {
                    saving = false;
                  });
                }
              }
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final editing =
                  widget.documentId != null;

              return Scaffold(
