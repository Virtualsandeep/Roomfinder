            });

            String statusLabel(String status) {
              switch (status) {
                case 'accepted':
                  return 'ACCEPTED';
                case 'contacted':
                  return 'CONTACTED';
                case 'closed':
                  return 'CLOSED';
                default:
                  return 'NEW';
              }
