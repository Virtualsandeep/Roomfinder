          class LandlordPropertyCard
              extends StatelessWidget {
            final String documentId;
            final Map<String, dynamic> data;

            const LandlordPropertyCard({
              super.key,
              required this.documentId,
              required this.data,
            });

            String textValue(
              String key, [
              String fallback = '',
            ]) {
              final value = data[key];

              if (value == null) {
                return fallback;
              }

              return value.toString();
            }

            @override
            Widget build(BuildContext context) {
              final title =
                  textValue(
                'title',
                'Property',
              );

              final location =
                  textValue('location');

              final type =
                  textValue('propertyType');

              final available =
                  data['available'] == true;

              final rent =
                  data['rent'] ?? 0;

              return Card(
                margin:
                    const EdgeInsets.only(
                  bottom: 15,
                ),
                child: ListTile(
                  leading:
                      const CircleAvatar(
                    child:
                        Icon(Icons.apartment),
                  ),
                  title: Text(
                    title,
                    style:
                        const TextStyle(
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  subtitle: Text(
                    '$type • $location\n'
                    'Rs. $rent/month • '
                    '${available ? 'Available' : 'Unavailable'}',
                  ),
                  isThreeLine: true,
                  trailing:
                      PopupMenuButton<String>(
                    onSelected:
                        (value) async {
                      if (value ==
                          'edit') {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                AddPropertyScreen(
                              documentId:
                                  documentId,
                              existingData:
                                  data,
                            ),
                          ),
                        );
                      }

                      if (value ==
                          'toggle') {
                        await FirebaseFirestore
                            .instance
                            .collection(
                                'properties')
                            .doc(
                              documentId,
                            )
                            .update({
                          'available':
                              !available,
                        });
                      }

                      if (value ==
                          'delete') {
                        final confirm =
                            await showDialog<
                                bool>(
                          context: context,
                          builder:
                              (context) {
                            return AlertDialog(
                              title:
                                  const Text(
                                'Delete Property?',
                              ),
                              content:
                                  const Text(
                                'This property will be permanently deleted.',
                              ),
                              actions: [
                                TextButton(
                                  onPressed:
                                      () {
                                    Navigator.pop(
                                      context,
                                      false,
                                    );
                                  },
                                  child:
                                      const Text(
                                    'Cancel',
                                  ),
                                ),
                                ElevatedButton(
                                  onPressed:
                                      () {
                                    Navigator.pop(
                                      context,
                                      true,
                                    );
                                  },
                                  child:
                                      const Text(
                                    'Delete',
                                  ),
                                ),
                              ],
                            );
                          },
                        );

                        if (confirm ==
                            true) {
                          await FirebaseFirestore
                              .instance
                              .collection(
                                  'properties')
                              .doc(
                                documentId,
                              )
                              .delete();
                        }
                      }
                    },
                    itemBuilder:
                        (context) {
                      return [
                        const PopupMenuItem(
                          value: 'edit',
                          child: Text(
                            'Edit Property',
                          ),
                        ),
                        PopupMenuItem(
                          value: 'toggle',
                          child: Text(
                            available
                                ? 'Mark Unavailable'
                                : 'Mark Available',
                          ),
                        ),
                        const PopupMenuItem(
                          value: 'delete',
                          child: Text(
                            'Delete Property',
                          ),
                        ),
                      ];
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Remove default tests
        working-directory: build_app
        run: |
          rm -rf test

      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
