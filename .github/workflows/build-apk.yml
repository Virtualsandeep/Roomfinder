            Widget build(BuildContext context) {
              final status =
                  data['status'] ?? 'new';

              final customerName =
                  data['customerName'] ??
                      'Customer';

              final customerEmail =
                  data['customerEmail'] ?? '';

              final propertyTitle =
                  data['propertyTitle'] ??
                      'Property';

              final message =
                  data['message'] ?? '';

              return Card(
                margin: const EdgeInsets.only(
                  bottom: 12,
