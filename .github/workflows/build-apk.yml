          class InquiryDetailsScreen extends StatefulWidget {
            final QueryDocumentSnapshot<Map<String, dynamic>> doc;
            final bool landlordView;

            const InquiryDetailsScreen({
              super.key,
              required this.doc,
              required this.landlordView,
            });

            @override
            State<InquiryDetailsScreen> createState() =>
                _InquiryDetailsScreenState();
          }

          class _InquiryDetailsScreenState
              extends State<InquiryDetailsScreen> {
            bool updating = false;

            Future<void> markAsRead() async {
              if (widget.doc.data()['isRead'] == true) {
                return;
              }

              try {
                await db
                    .collection('inquiries')
                    .doc(widget.doc.id)
                    .update({
                  'isRead': true,
                });
              } catch (_) {}
            }

            Future<void> updateStatus(
              String status,
            ) async {
              setState(() {
                updating = true;
              });

              try {
                await db
                    .collection('inquiries')
                    .doc(widget.doc.id)
                    .update({
                  'status': status,
                  'isRead': true,
                });

                if (mounted) {
                  showMessage(
                    context,
                    'Inquiry status updated.',
                  );
                }
              } catch (e) {
                if (mounted) {
                  showMessage(
                    context,
                    'Could not update inquiry: $e',
                  );
                }
              } finally {
                if (mounted) {
                  setState(() {
                    updating = false;
                  });
                }
              }
            }

            @override
            void initState() {
              super.initState();

              WidgetsBinding.instance.addPostFrameCallback((_) {
                markAsRead();
              });
            }

            @override
            Widget build(BuildContext context) {
              final data = widget.doc.data();

              final status =
                  (data['status'] ?? 'new').toString();

              final propertyTitle =
                  (data['propertyTitle'] ?? 'Property')
                      .toString();

              final customerName =
                  (data['customerName'] ?? 'Customer')
                      .toString();

              final customerEmail =
                  (data['customerEmail'] ?? '').toString();

              final landlordName =
                  (data['landlordName'] ?? 'Landlord')
                      .toString();

              final landlordEmail =
                  (data['landlordEmail'] ?? '').toString();

              final message =
                  (data['message'] ?? '').toString();

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Inquiry Details'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    Text(
                      propertyTitle,
                      style: const TextStyle(
                        fontSize: 24,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 16),
                    _InfoSection(
                      title: 'Inquiry',
                      children: [
                        _InfoRow(
                          label: 'Status',
                          value: status,
                        ),
                        _InfoRow(
                          label: 'Date',
                          value: _formatDate(
                            data['createdAt'],
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 16),
                    _InfoSection(
                      title: widget.landlordView
                          ? 'Customer'
                          : 'Landlord',
                      children: [
                        _InfoRow(
                          label: 'Name',
                          value: widget.landlordView
                              ? customerName
                              : landlordName,
                        ),
                        _InfoRow(
                          label: 'Email',
                          value: widget.landlordView
                              ? customerEmail
                              : landlordEmail,
                        ),
                      ],
                    ),
                    const SizedBox(height: 16),
                    _InfoSection(
                      title: 'Message',
                      children: [
                        Text(message),
                      ],
                    ),
                    if (widget.landlordView) ...[
                      const SizedBox(height: 24),
                      const Text(
                        'Update Status',
                        style: TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      DropdownButtonFormField<String>(
                        value: [
                          'new',
                          'accepted',
                          'contacted',
                          'closed',
                        ].contains(status)
                            ? status
                            : 'new',
                        decoration: const InputDecoration(
                          labelText: 'Inquiry status',
                        ),
                        items: const [
                          DropdownMenuItem(
                            value: 'new',
                            child: Text('New'),
                          ),
                          DropdownMenuItem(
                            value: 'accepted',
                            child: Text('Accepted'),
                          ),
                          DropdownMenuItem(
                            value: 'contacted',
                            child: Text('Contacted'),
                          ),
                          DropdownMenuItem(
                            value: 'closed',
                            child: Text('Closed'),
                          ),
                        ],
                        onChanged: updating
                            ? null
                            : (value) {
                                if (value != null &&
                                    value != status) {
                                  updateStatus(value);
                                }
                              },
                      ),
                    ],
                  ],
                ),
              );
            }
          }

          class _StatusChip extends StatelessWidget {
            final String label;
            final bool positive;

            const _StatusChip({
              required this.label,
              required this.positive,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.symmetric(
                  horizontal: 9,
                  vertical: 5,
                ),
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(20),
                  color: positive
                      ? Colors.green.withOpacity(0.12)
                      : Colors.grey.withOpacity(0.12),
                ),
                child: Text(
                  label,
                  style: TextStyle(
                    fontSize: 12,
                    fontWeight: FontWeight.w600,
                    color: positive
                        ? Colors.green.shade700
                        : Colors.grey.shade700,
                  ),
                ),
              );
            }
          }

          class _InfoSection extends StatelessWidget {
            final String title;
            final List<Widget> children;

            const _InfoSection({
              required this.title,
              required this.children,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        title,
                        style: const TextStyle(
                          fontSize: 17,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      ...children,
                    ],
                  ),
                ),
              );
            }
          }

          class _InfoRow extends StatelessWidget {
            final String label;
            final String value;

            const _InfoRow({
              required this.label,
              required this.value,
            });

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 10),
                child: Row(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    SizedBox(
                      width: 125,
                      child: Text(
                        label,
                        style: const TextStyle(
                          fontWeight: FontWeight.w600,
                        ),
                      ),
                    ),
                    Expanded(
                      child: Text(value),
                    ),
                  ],
                ),
              );
            }
          }

          String _formatDate(dynamic value) {
            if (value is Timestamp) {
              final date = value.toDate();

              final day =
                  date.day.toString().padLeft(2, '0');
              final month =
                  date.month.toString().padLeft(2, '0');
              final year = date.year.toString();

              final hour =
                  date.hour.toString().padLeft(2, '0');
              final minute =
                  date.minute.toString().padLeft(2, '0');

              return '$year-$month-$day $hour:$minute';
            }

            return 'Just now';
          }

          void showMessage(
            BuildContext context,
            String message,
          ) {
            ScaffoldMessenger.of(context)
              ..hideCurrentSnackBar()
              ..showSnackBar(
                SnackBar(
                  content: Text(message),
                ),
              );
          }
          DART

      # ============================================================
      # 13. GET DEPENDENCIES
      # ============================================================
      - name: Get Flutter dependencies
        working-directory: build_app
        run: |
          flutter pub get

      # ============================================================
      # 14. FORMAT DART CODE
      # ============================================================
      - name: Format Dart code
        working-directory: build_app
        run: |
          dart format lib/main.dart

      # ============================================================
      # 15. ANALYZE FLUTTER PROJECT
      # ============================================================
      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze --no-fatal-infos

      # ============================================================
      # 16. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      # ============================================================
      # 17. VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          test -f build_app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh build_app/build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 18. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
