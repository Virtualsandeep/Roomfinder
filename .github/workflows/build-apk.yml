                          decoration:
                              const InputDecoration(
                            labelText: 'Description',
                            alignLabelWithHint: true,
                          ),
                        ),
                        const SizedBox(height: 8),
                        SwitchListTile(
                          contentPadding:
                              EdgeInsets.zero,
                          title:
                              const Text('Furnished'),
                          value: furnished,
                          onChanged: (value) {
                            setState(() {
                              furnished = value;
                            });
                          },
                        ),
                        SwitchListTile(
                          contentPadding:
                              EdgeInsets.zero,
