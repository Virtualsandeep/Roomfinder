            });

            @override
            State<InquiryDetailsScreen> createState() =>
                _InquiryDetailsScreenState();
          }

          class _InquiryDetailsScreenState
              extends State<InquiryDetailsScreen> {
            bool loading = false;

            @override
            void initState() {
              super.initState();

              // STEP 8:
              // Opening the inquiry marks it read.
              // It does NOT change the inquiry status.
              markAsRead();
            }

            Future<void> markAsRead() async {
              if (widget.data['isRead'] == true) {
                return;
              }

              try {
                await db
                    .collection('inquiries')
                    .doc(widget.inquiryId)
                    .update({
                  'isRead': true,
                });
              } catch (_) {
                // Do not block the screen if read status
                // cannot be updated.
              }
            }

            Future<void> updateStatus(
              String status,
            ) async {
              setState(() => loading = true);

              try {
                await db
                    .collection('inquiries')
                    .doc(widget.inquiryId)
                    .update({
                  'status': status,
                  'isRead': true,
                });

                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content: Text(
                        'Status changed to $status.',
                      ),
                    ),
                  );
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content: Text(
                        'Could not update status: $e',
                      ),
                    ),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final status =
                  widget.data['status'] ?? 'new';

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('Inquiry Details'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    Text(
                      widget.data['customerName'] ??
                          'Customer',
                      style: const TextStyle(
                        fontSize: 25,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 7),
                    Text(
                      widget.data['customerEmail'] ??
                          '',
                    ),
                    const SizedBox(height: 22),
                    _InfoSection(
                      title: 'Property',
                      child: Text(
                        widget.data['propertyTitle'] ??
                            'Property',
                        style: const TextStyle(
                          fontSize: 17,
                          fontWeight: FontWeight.w600,
                        ),
                      ),
                    ),
                    _InfoSection(
                      title: 'Message',
                      child: Text(
                        widget.data['message'] ??
                            '',
                        style: const TextStyle(
                          fontSize: 16,
                          height: 1.5,
                        ),
                      ),
                    ),
                    _InfoSection(
                      title: 'Current Status',
                      child: _StatusChip(
                        text: status,
                        positive:
                            status == 'accepted',
                      ),
                    ),
                    const SizedBox(height: 10),
                    const Text(
                      'Change Status',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: [
                        for (final value in const [
                          'new',
                          'accepted',
                          'contacted',
                          'closed',
                        ])
                          ChoiceChip(
                            label: Text(value),
                            selected: status == value,
                            onSelected: loading
                                ? null
                                : (_) =>
                                    updateStatus(
                                      value,
                                    ),
                          ),
                      ],
                    ),
                  ],
                ),
              );
            }
          }

