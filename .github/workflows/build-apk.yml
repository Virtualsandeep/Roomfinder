                          .toDouble()
                      : 0.0;

              final discount =
                  data['discount'] is num
                      ? (data['discount'] as num)
                          .toDouble()
                      : 0.0;

              final finalRent =
                  rent - discount;

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text(
