name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      - name: Configure Android application ID
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'applicationId = "com.example.kothafinder_nepal"',
              'applicationId = "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId "com.example.kothafinder_nepal"',
              'applicationId "com.kothafinder.nepal"'
          )

          path.write_text(text)

          print("Application ID configured.")
          PY

      - name: Configure minimum Android SDK
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23'
          )

          text = text.replace(
              'minSdkVersion flutter.minSdkVersion',
              'minSdkVersion 23'
          )

          text = text.replace(
              'minSdkVersion 21',
              'minSdkVersion 23'
          )

          path.write_text(text)

          print("Minimum Android SDK configured to 23.")
          PY

      - name: Verify Android configuration
        working-directory: build_app
        run: |
          echo "Checking Android configuration..."

          echo "Application ID:"
          grep -n "applicationId" android/app/build.gradle || true

          echo "Minimum SDK:"
          grep -n "minSdk" android/app/build.gradle || true

          if grep -q 'com.kothafinder.nepal' android/app/build.gradle; then
            echo "Application ID is correct."
          else
            echo "ERROR: Application ID is incorrect."
            exit 1
          fi

          if grep -q 'minSdk = 23' android/app/build.gradle; then
            echo "Minimum SDK is 23."
          elif grep -q 'minSdkVersion 23' android/app/build.gradle; then
            echo "Minimum SDK is 23."
          else
            echo "ERROR: Minimum SDK is not 23."
            exit 1
          fi

      - name: Copy Firebase configuration
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json was not found."
            exit 1
          fi

          cp google-services.json \
            build_app/android/app/google-services.json

          echo "Firebase configuration copied."

      - name: Verify Firebase package
        run: |
          echo "Checking Firebase package..."

          if grep -q '"package_name": "com.kothafinder.nepal"' google-services.json; then
            echo "Firebase package matches com.kothafinder.nepal."
          else
            echo "ERROR: Firebase package does not match."
            exit 1
          fi

      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Configure Google Services
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          settings_text = settings.read_text()
          app_text = app.read_text()

          plugin = "com.google.gms.google-services"

          if plugin not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services' version '4.4.2' apply false""",
                  1
              )

          if plugin not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services'""",
                  1
              )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("Google Services configured.")
          PY

      - name: Create KothaFinder app
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'EOF'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (!snapshot.hasData) {
                    return const LoginScreen();
                  }

                  return const RoleLoadingScreen();
                },
              );
            }
          }

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          class RoleLoadingScreen extends StatelessWidget {
            const RoleLoadingScreen({super.key});

            Future<String?> getRole() async {
              final user = FirebaseAuth.instance.currentUser;

              if (user == null) {
                return null;
              }

              final document = await FirebaseFirestore.instance
                  .collection('users')
                  .doc(user.uid)
                  .get();

              if (!document.exists) {
                return null;
              }

              final data = document.data();

              return data?['role'] as String?;
            }

            @override
            Widget build(BuildContext context) {
              return FutureBuilder<String?>(
                future: getRole(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (snapshot.data == 'landlord') {
                    return const LandlordDashboard();
                  }

                  if (snapshot.data == 'customer') {
                    return const CustomerDashboard();
                  }

                  return const LoginScreen();
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            String errorMessage = '';

            Future<void> login() async {
              if (emailController.text.trim().isEmpty ||
                  passwordController.text.isEmpty) {
                setState(() {
                  errorMessage = 'Please enter email and password.';
                });
                return;
              }

              setState(() {
                loading = true;
                errorMessage = '';
              });

              try {
                await FirebaseAuth.instance.signInWithEmailAndPassword(
                  email: emailController.text.trim(),
                  password: passwordController.text,
                );
              } on FirebaseAuthException catch (e) {
                setState(() {
                  errorMessage = firebaseError(e.code);
                });
              } catch (_) {
                setState(() {
                  errorMessage = 'Login failed.';
                });
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            String firebaseError(String code) {
              switch (code) {
                case 'user-not-found':
                  return 'No account found with this email.';
                case 'wrong-password':
                case 'invalid-credential':
                  return 'Incorrect email or password.';
                case 'invalid-email':
                  return 'Invalid email address.';
                case 'too-many-requests':
                  return 'Too many attempts. Try again later.';
                default:
                  return 'Login failed. Please try again.';
              }
            }

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        children: [
                          const Icon(
                            Icons.home_work,
                            size: 80,
                          ),
                          const SizedBox(height: 20),
                          const Text(
                            'KothaFinder Nepal',
                            style: TextStyle(
                              fontSize: 30,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text('Login to continue'),
                          const SizedBox(height: 30),
                          TextField(
                            controller: emailController,
                            keyboardType:
                                TextInputType.emailAddress,
                            decoration: const InputDecoration(
                              labelText: 'Email',
                              prefixIcon: Icon(Icons.email),
                              border: OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: passwordController,
                            obscureText: true,
                            decoration: const InputDecoration(
                              labelText: 'Password',
                              prefixIcon: Icon(Icons.lock),
                              border: OutlineInputBorder(),
                            ),
                          ),
                          if (errorMessage.isNotEmpty)
                            Padding(
                              padding:
                                  const EdgeInsets.only(top: 12),
                              child: Text(
                                errorMessage,
                                style: const TextStyle(
                                  color: Colors.red,
                                ),
                              ),
                            ),
                          const SizedBox(height: 24),
                          SizedBox(
                            width: double.infinity,
                            height: 52,
                            child: ElevatedButton(
                              onPressed: loading ? null : login,
                              child: loading
                                  ? const SizedBox(
                                      width: 22,
                                      height: 22,
                                      child:
                                          CircularProgressIndicator(),
                                    )
                                  : const Text('Login'),
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextButton(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) =>
                                      const RegisterScreen(),
                                ),
                              );
                            },
                            child: const Text(
                              'Create a new account',
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() =>
                _RegisterScreenState();
          }

          class _RegisterScreenState
              extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;
            String errorMessage = '';

            Future<void> register() async {
              if (nameController.text.trim().isEmpty) {
                setState(() {
                  errorMessage = 'Please enter your name.';
                });
                return;
              }

              if (emailController.text.trim().isEmpty) {
                setState(() {
                  errorMessage = 'Please enter your email.';
                });
                return;
              }

              if (passwordController.text.length < 6) {
                setState(() {
                  errorMessage =
                      'Password must contain at least 6 characters.';
                });
                return;
              }

              setState(() {
                loading = true;
                errorMessage = '';
              });

              try {
                final credential = await FirebaseAuth.instance
                    .createUserWithEmailAndPassword(
                  email: emailController.text.trim(),
                  password: passwordController.text,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception('User creation failed.');
                }

                await FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .set({
                  'uid': user.uid,
                  'name': nameController.text.trim(),
                  'email': emailController.text.trim(),
                  'role': role,
                  'createdAt': FieldValue.serverTimestamp(),
                });
              } on FirebaseAuthException catch (e) {
                setState(() {
                  errorMessage = firebaseError(e.code);
                });
              } catch (_) {
                setState(() {
                  errorMessage =
                      'Account creation failed.';
                });
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            String firebaseError(String code) {
              switch (code) {
                case 'email-already-in-use':
                  return 'This email is already registered.';
                case 'invalid-email':
                  return 'Invalid email address.';
                case 'weak-password':
                  return 'Password is too weak.';
                default:
                  return 'Registration failed. Please try again.';
              }
            }

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      TextField(
                        controller: nameController,
                        decoration: const InputDecoration(
                          labelText: 'Full Name',
                          prefixIcon: Icon(Icons.person),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: emailController,
                        keyboardType:
                            TextInputType.emailAddress,
                        decoration: const InputDecoration(
                          labelText: 'Email',
                          prefixIcon: Icon(Icons.email),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: passwordController,
                        obscureText: true,
                        decoration: const InputDecoration(
                          labelText: 'Password',
                          prefixIcon: Icon(Icons.lock),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Align(
                        alignment: Alignment.centerLeft,
                        child: Text(
                          'I am a:',
                          style: TextStyle(
                            fontSize: 17,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      RadioListTile<String>(
                        title: const Text('Customer'),
                        value: 'customer',
                        groupValue: role,
                        onChanged: (value) {
                          setState(() {
                            role = value!;
                          });
                        },
                      ),
                      RadioListTile<String>(
                        title: const Text('Landlord'),
                        value: 'landlord',
                        groupValue: role,
                        onChanged: (value) {
                          setState(() {
                            role = value!;
                          });
                        },
                      ),
                      if (errorMessage.isNotEmpty)
                        Padding(
                          padding:
                              const EdgeInsets.only(bottom: 15),
                          child: Text(
                            errorMessage,
                            style: const TextStyle(
                              color: Colors.red,
                            ),
                          ),
                        ),
                      SizedBox(
                        width: double.infinity,
                        height: 52,
                        child: ElevatedButton(
                          onPressed:
                              loading ? null : register,
                          child: loading
                              ? const SizedBox(
                                  width: 22,
                                  height: 22,
                                  child:
                                      CircularProgressIndicator(),
                                )
                              : const Text(
                                  'Create Account',
                                ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CustomerDashboard extends StatefulWidget {
            const CustomerDashboard({super.key});

            @override
            State<CustomerDashboard> createState() =>
                _CustomerDashboardState();
          }

          class _CustomerDashboardState
              extends State<CustomerDashboard> {
            final searchController = TextEditingController();

            String selectedType = 'All';
            String selectedFurnished = 'All';

            double minRent = 0;
            double maxRent = 100000;

            int minimumBedrooms = 0;
            bool availableOnly = true;

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            bool matchesFilters(
              Map<String, dynamic> data,
            ) {
              final search =
                  searchController.text.trim().toLowerCase();

              final title =
                  (data['title'] ?? '').toString().toLowerCase();

              final location =
                  (data['location'] ?? '').toString().toLowerCase();

              final propertyType =
                  (data['propertyType'] ?? '').toString();

              final furnished =
                  (data['furnished'] ?? '').toString();

              final rentValue = data['rent'];

              final rent = rentValue is num
                  ? rentValue.toDouble()
                  : 0.0;

              final bedroomsValue = data['bedrooms'];

              final bedrooms = bedroomsValue is num
                  ? bedroomsValue.toInt()
                  : 0;

              final available =
                  data['available'] == true;

              if (search.isNotEmpty &&
                  !title.contains(search) &&
                  !location.contains(search)) {
                return false;
              }

              if (selectedType != 'All' &&
                  propertyType != selectedType) {
                return false;
              }

              if (selectedFurnished != 'All' &&
                  furnished != selectedFurnished) {
                return false;
              }

              if (rent < minRent ||
                  rent > maxRent) {
                return false;
              }

              if (bedrooms < minimumBedrooms) {
                return false;
              }

              if (availableOnly &&
                  !available) {
                return false;
              }

              return true;
            }

            void openFilters() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (context) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Padding(
                        padding: EdgeInsets.only(
                          left: 20,
                          right: 20,
                          top: 20,
                          bottom:
                              MediaQuery.of(context)
                                  .viewInsets
                                  .bottom +
                              20,
                        ),
                        child: SingleChildScrollView(
                          child: Column(
                            crossAxisAlignment:
                                CrossAxisAlignment.start,
                            children: [
                              Row(
                                mainAxisAlignment:
                                    MainAxisAlignment.spaceBetween,
                                children: [
                                  const Text(
                                    'Filters',
                                    style: TextStyle(
                                      fontSize: 24,
                                      fontWeight:
                                          FontWeight.bold,
                                    ),
                                  ),
                                  TextButton(
                                    onPressed: () {
                                      setModalState(() {
                                        selectedType =
                                            'All';
                                        selectedFurnished =
                                            'All';
                                        minRent = 0;
                                        maxRent =
                                            100000;
                                        minimumBedrooms =
                                            0;
                                        availableOnly =
                                            true;
                                      });
                                      setState(() {});
                                    },
                                    child:
                                        const Text('Reset'),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 20),

                              const Text(
                                'Property Type',
                                style: TextStyle(
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 8),

                              DropdownButtonFormField<String>(
                                value: selectedType,
                                decoration:
                                    const InputDecoration(
                                  border:
                                      OutlineInputBorder(),
                                ),
                                items: const [
                                  DropdownMenuItem(
                                    value: 'All',
                                    child:
                                        Text('All'),
                                  ),
                                  DropdownMenuItem(
                                    value: 'Room',
                                    child:
                                        Text('Room'),
                                  ),
                                  DropdownMenuItem(
                                    value: '1BHK',
                                    child:
                                        Text('1BHK'),
                                  ),
                                  DropdownMenuItem(
                                    value: '2BHK',
                                    child:
                                        Text('2BHK'),
                                  ),
                                  DropdownMenuItem(
                                    value: 'Flat',
                                    child:
                                        Text('Flat'),
                                  ),
                                ],
                                onChanged: (value) {
                                  if (value != null) {
                                    setModalState(() {
                                      selectedType =
                                          value;
                                    });
                                    setState(() {});
                                  }
                                },
                              ),

                              const SizedBox(height: 20),

                              const Text(
                                'Furnished',
                                style: TextStyle(
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 8),

                              DropdownButtonFormField<String>(
                                value:
                                    selectedFurnished,
                                decoration:
                                    const InputDecoration(
                                  border:
                                      OutlineInputBorder(),
                                ),
                                items: const [
                                  DropdownMenuItem(
                                    value: 'All',
                                    child:
                                        Text('All'),
                                  ),
                                  DropdownMenuItem(
                                    value:
                                        'Furnished',
                                    child:
                                        Text('Furnished'),
                                  ),
                                  DropdownMenuItem(
                                    value:
                                        'Unfurnished',
                                    child:
                                        Text('Unfurnished'),
                                  ),
                                ],
                                onChanged: (value) {
                                  if (value != null) {
                                    setModalState(() {
                                      selectedFurnished =
                                          value;
                                    });
                                    setState(() {});
                                  }
                                },
                              ),

                              const SizedBox(height: 20),

                              const Text(
                                'Minimum Bedrooms',
                                style: TextStyle(
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),

                              DropdownButtonFormField<int>(
                                value:
                                    minimumBedrooms,
                                decoration:
                                    const InputDecoration(
                                  border:
                                      OutlineInputBorder(),
                                ),
                                items: const [
                                  DropdownMenuItem(
                                    value: 0,
                                    child:
                                        Text('Any'),
                                  ),
                                  DropdownMenuItem(
                                    value: 1,
                                    child:
                                        Text('1+'),
                                  ),
                                  DropdownMenuItem(
                                    value: 2,
                                    child:
                                        Text('2+'),
                                  ),
                                  DropdownMenuItem(
                                    value: 3,
                                    child:
                                        Text('3+'),
                                  ),
                                ],
                                onChanged: (value) {
                                  if (value != null) {
                                    setModalState(() {
                                      minimumBedrooms =
                                          value;
                                    });
                                    setState(() {});
                                  }
                                },
                              ),

                              const SizedBox(height: 20),

                              Text(
                                'Maximum Rent: Rs. ${maxRent.toStringAsFixed(0)}',
                                style: const TextStyle(
                                  fontWeight:
                                      FontWeight.bold,
                                ),
                              ),

                              RangeSlider(
                                min: 0,
                                max: 100000,
                                divisions: 100,
                                values: RangeValues(
                                  minRent,
                                  maxRent,
                                ),
                                labels: RangeLabels(
                                  'Rs. ${minRent.toStringAsFixed(0)}',
                                  'Rs. ${maxRent.toStringAsFixed(0)}',
                                ),
                                onChanged:
                                    (values) {
                                  setModalState(() {
                                    minRent =
                                        values.start;
                                    maxRent =
                                        values.end;
                                  });
                                  setState(() {});
                                },
                              ),

                              SwitchListTile(
                                title: const Text(
                                  'Available properties only',
                                ),
                                value:
                                    availableOnly,
                                onChanged: (value) {
                                  setModalState(() {
                                    availableOnly =
                                        value;
                                  });
                                  setState(() {});
                                },
                              ),

                              const SizedBox(height: 10),

                              SizedBox(
                                width:
                                    double.infinity,
                                height: 50,
                                child:
                                    ElevatedButton(
                                  onPressed: () {
                                    Navigator.pop(
                                        context);
                                  },
                                  child:
                                      const Text(
                                    'Apply Filters',
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('KothaFinder'),
                  actions: [
                    IconButton(
                      onPressed: logout,
                      icon:
                          const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: StreamBuilder<
                    QuerySnapshot<
                        Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('properties')
                      .snapshots(),
                  builder:
                      (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child:
                            CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
