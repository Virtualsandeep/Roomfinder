          class LandlordInquiriesScreen
              extends StatelessWidget {
            const LandlordInquiriesScreen({
              super.key,
            });

            @override
            Widget build(BuildContext context) {
              final user = auth.currentUser;

              if (user == null) {
                return const AuthScreen();
              }

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('Inquiries'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<
                        Map<String, dynamic>>>(
                  stream: db
                      .collection('inquiries')
                      .where(
                        'landlordId',
                        isEqualTo: user.uid,
                      )
                      .snapshots(),
                  builder: (
                    context,
                    snapshot,
                  ) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child:
                            CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding:
                              const EdgeInsets.all(
                            24,
                          ),
                          child: Text(
                            snapshot.error
                                .toString(),
                            textAlign:
                                TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs =
                        snapshot.data?.docs ?? [];

                    final sorted =
                        [...docs];

                    sorted.sort(
                      (a, b) {
                        final aTime =
                            a.data()['createdAt']
                                as Timestamp?;

                        final bTime =
                            b.data()['createdAt']
                                as Timestamp?;

                        return (bTime?.millisecondsSinceEpoch ??
                                0)
                            .compareTo(
                          aTime?.millisecondsSinceEpoch ??
                              0,
                        );
                      },
                    );

                    if (sorted.isEmpty) {
                      return const Center(
                        child: Text(
                          'No inquiries yet.',
                        ),
                      );
                    }

                    return ListView.builder(
                      padding:
                          const EdgeInsets.all(16),
                      itemCount: sorted.length,
                      itemBuilder: (
                        context,
                        index,
                      ) {
                        return InquiryCard(
                          doc: sorted[index],
                          landlordView: true,
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

