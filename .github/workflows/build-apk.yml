name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SET UP FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ============================================================
      # 3. CREATE FLUTTER PROJECT
      # ============================================================
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      # ============================================================
      # 4. CONFIGURE ANDROID APPLICATION ID
      # ============================================================
      - name: Configure Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'namespace = "com.example.kothafinder_nepal"',
              'namespace = "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId = "com.example.kothafinder_nepal"',
              'applicationId = "com.kothafinder.nepal"'
          )

          path.write_text(text)
          PY

      # ============================================================
      # 5. CONFIGURE MINIMUM ANDROID SDK
      # ============================================================
      - name: Configure minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          path.write_text(text)
          PY

      # ============================================================
      # 6. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        run: |
          grep -n "namespace" build_app/android/app/build.gradle
          grep -n "applicationId" build_app/android/app/build.gradle
          grep -n "minSdk" build_app/android/app/build.gradle

      # ============================================================
      # 7. COPY FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          test -f google-services.json
          cp google-services.json build_app/android/app/google-services.json

      # ============================================================
      # 8. VERIFY FIREBASE CONFIGURATION
      # ============================================================
      - name: Verify Firebase configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q "com.kothafinder.nepal" build_app/android/app/google-services.json
          echo "Firebase configuration found."
          echo "Correct Android package name found."

      # ============================================================
      # 9. ADD FIREBASE AND URL LAUNCHER PACKAGES
      # ============================================================
      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add url_launcher

      # ============================================================
      # 10. CONFIGURE GOOGLE SERVICES GRADLE PLUGIN
      # ============================================================
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_path = Path(
              "build_app/android/settings.gradle"
          )

          text = settings_path.read_text()

          old = 'id "dev.flutter.flutter-plugin-loader" version "1.0.0"'

          new = '''id "dev.flutter.flutter-plugin-loader" version "1.0.0"
          id "com.google.gms.google-services" version "4.4.2" apply false'''

          if 'id "com.google.gms.google-services" version "4.4.2"' not in text:
              text = text.replace(old, new)

          settings_path.write_text(text)

          app_path = Path(
              "build_app/android/app/build.gradle"
          )

          app_text = app_path.read_text()

          if 'id "com.google.gms.google-services"' not in app_text:
              marker = 'id "dev.flutter.flutter-gradle-plugin"'

              app_text = app_text.replace(
                  marker,
                  marker + '\n    id "com.google.gms.google-services"'
              )

          app_path.write_text(app_text)
          PY

      # ============================================================
      # 11. VERIFY FIREBASE ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Firebase Android configuration
        run: |
          echo "Checking Firebase Android configuration..."

          test -f build_app/android/app/google-services.json

          grep -q '"package_name": "com.kothafinder.nepal"' \
            build_app/android/app/google-services.json

          grep -q 'com.google.gms.google-services' \
            build_app/android/app/build.gradle

          echo "Firebase Android configuration verified."

      # ============================================================
      # 12. CREATE COMPLETE KOTHAFINDER APPLICATION
      # ============================================================
      - name: Create application
        run: |
          cat > build_app/lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';

          // ============================================================
          // FIREBASE ACCESSORS
          //
          // IMPORTANT:
          // These are getters instead of top-level initialized objects.
          // Firebase must be initialized before FirebaseAuth.instance or
          // FirebaseFirestore.instance is accessed.
          // ============================================================

          FirebaseAuth get auth => FirebaseAuth.instance;

          FirebaseFirestore get db => FirebaseFirestore.instance;

          // ============================================================
          // MAIN
          // ============================================================

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            try {
              await Firebase.initializeApp();
            } catch (e) {
              runApp(
                FirebaseStartupError(
                  error: e,
                ),
              );
              return;
            }

            runApp(
              const KothaFinderApp(),
            );
          }

          // ============================================================
          // FIREBASE STARTUP ERROR
          // ============================================================

          class FirebaseStartupError extends StatelessWidget {
            final Object error;

            const FirebaseStartupError({
              super.key,
              required this.error,
            });

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: SafeArea(
                    child: Center(
                      child: Padding(
                        padding: const EdgeInsets.all(24),
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisAlignment:
                                MainAxisAlignment.center,
                            children: [
                              const Icon(
                                Icons.error_outline,
                                size: 72,
                              ),
                              const SizedBox(height: 20),
                              const Text(
                                'Firebase initialization failed',
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  fontSize: 22,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                              const SizedBox(height: 16),
                              Text(
                                error.toString(),
                                textAlign: TextAlign.center,
                                style: const TextStyle(
                                  fontSize: 14,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ============================================================
          // APP
          // ============================================================

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({
              super.key,
            });

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'KothaFinder Nepal',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.blue,
                ),
                home: const AuthGate(),
              );
            }
          }

          // ============================================================
          // AUTH GATE
          // ============================================================

          class AuthGate extends StatelessWidget {
            const AuthGate({
              super.key,
            });

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: auth.authStateChanges(),
                builder: (
                  context,
                  snapshot,
                ) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  final user = snapshot.data;

                  if (user == null) {
                    return const AuthScreen();
                  }

                  return RoleGate(
                    user: user,
                  );
                },
              );
            }
          }

          // ============================================================
          // LOADING SCREEN
          // ============================================================

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({
              super.key,
            });

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          // ============================================================
          // ROLE GATE
          // ============================================================

          class RoleGate extends StatelessWidget {
            final User user;

            const RoleGate({
              super.key,
              required this.user,
            });

            @override
            Widget build(BuildContext context) {
              return FutureBuilder<
                  DocumentSnapshot<Map<String, dynamic>>>(
                future: db
                    .collection('users')
                    .doc(user.uid)
                    .get(),
                builder: (
                  context,
                  snapshot,
                ) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (snapshot.hasError) {
                    return ErrorScreen(
                      message: snapshot.error.toString(),
                    );
                  }

                  final data = snapshot.data?.data();

                  if (data == null) {
                    return const AuthScreen();
                  }

                  final role = data['role'];

                  if (role == 'landlord') {
                    return const LandlordHome();
                  }

                  if (role == 'customer') {
                    return const CustomerHome();
                  }

                  return ErrorScreen(
                    message:
                        'Unknown account role. Please contact support.',
                  );
                },
              );
            }
          }

          // ============================================================
          // ERROR SCREEN
          // ============================================================

          class ErrorScreen extends StatelessWidget {
            final String message;

            const ErrorScreen({
              super.key,
              required this.message,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Error'),
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Text(
                      message,
                      textAlign: TextAlign.center,
                    ),
                  ),
                ),
              );
            }
          }

          // ============================================================
          // AUTH SCREEN
          // ============================================================

          class AuthScreen extends StatefulWidget {
            const AuthScreen({
              super.key,
            });

            @override
            State<AuthScreen> createState() =>
                _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final emailController = TextEditingController();
            final passwordController =
                TextEditingController();

            bool loading = false;

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> login() async {
              final email =
                  emailController.text.trim();

              final password =
                  passwordController.text.trim();

              if (email.isEmpty ||
                  password.isEmpty) {
                showMessage(
                  context,
                  'Please enter email and password.',
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                await auth.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  e.message ?? 'Login failed.',
                );
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Login failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        children: [
                          const Icon(
                            Icons.home_work_outlined,
                            size: 72,
                          ),
                          const SizedBox(height: 16),
                          const Text(
                            'KothaFinder Nepal',
                            style: TextStyle(
                              fontSize: 28,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Find your next room or property',
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 32),
                          TextField(
                            controller: emailController,
                            keyboardType:
                                TextInputType.emailAddress,
                            decoration:
                                const InputDecoration(
                              labelText: 'Email',
                              border:
                                  OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller:
                                passwordController,
                            obscureText: true,
                            decoration:
                                const InputDecoration(
                              labelText: 'Password',
                              border:
                                  OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 20),
                          SizedBox(
                            width: double.infinity,
                            child: FilledButton(
                              onPressed:
                                  loading ? null : login,
                              child: loading
                                  ? const SizedBox(
                                      height: 20,
                                      width: 20,
                                      child:
                                          CircularProgressIndicator(
                                        strokeWidth: 2,
                                      ),
                                    )
                                  : const Text('Login'),
                            ),
                          ),
                          const SizedBox(height: 12),
                          SizedBox(
                            width: double.infinity,
                            child: OutlinedButton(
                              onPressed: loading
                                  ? null
                                  : () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) =>
                                              const RegisterScreen(),
                                        ),
                                      );
                                    },
                              child:
                                  const Text('Create Account'),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ============================================================
          // REGISTER SCREEN
          // ============================================================

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({
              super.key,
            });

            @override
            State<RegisterScreen> createState() =>
                _RegisterScreenState();
          }

          class _RegisterScreenState
              extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController =
                TextEditingController();

            String role = 'customer';
            bool loading = false;

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> register() async {
              final name =
                  nameController.text.trim();

              final email =
                  emailController.text.trim();

              final password =
                  passwordController.text.trim();

              if (name.isEmpty ||
                  email.isEmpty ||
                  password.isEmpty) {
                showMessage(
                  context,
                  'Please fill all fields.',
                );
                return;
              }

              if (password.length < 6) {
                showMessage(
                  context,
                  'Password must be at least 6 characters.',
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                final credential = await auth
                    .createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception(
                    'Account creation failed.',
                  );
                }

                await user.updateDisplayName(name);

                await db
                    .collection('users')
                    .doc(user.uid)
                    .set({
                  'uid': user.uid,
                  'name': name,
                  'email': email,
                  'role': role,
                  'createdAt':
                      FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                Navigator.pop(context);
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  e.message ??
                      'Registration failed.',
                );
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Registration failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Create Account',
                  ),
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      children: [
                        TextField(
                          controller: nameController,
                          decoration:
                              const InputDecoration(
                            labelText: 'Name',
                            border:
                                OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller: emailController,
                          keyboardType:
                              TextInputType.emailAddress,
                          decoration:
                              const InputDecoration(
                            labelText: 'Email',
                            border:
                                OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller:
                              passwordController,
                          obscureText: true,
                          decoration:
                              const InputDecoration(
                            labelText: 'Password',
                            border:
                                OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 16),
                        DropdownButtonFormField<String>(
                          value: role,
                          decoration:
                              const InputDecoration(
                            labelText: 'Account Type',
                            border:
                                OutlineInputBorder(),
                          ),
                          items: const [
                            DropdownMenuItem(
                              value: 'customer',
                              child:
                                  Text('Customer'),
                            ),
                            DropdownMenuItem(
                              value: 'landlord',
                              child:
                                  Text('Landlord'),
                            ),
                          ],
                          onChanged: loading
                              ? null
                              : (value) {
                                  if (value == null) {
                                    return;
                                  }

                                  setState(() {
                                    role = value;
                                  });
                                },
                        ),
                        const SizedBox(height: 24),
                        SizedBox(
                          width: double.infinity,
                          child: FilledButton(
                            onPressed:
                                loading ? null : register,
                            child: loading
                                ? const SizedBox(
                                    height: 20,
                                    width: 20,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : const Text(
                                    'Register',
                                  ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // ============================================================
          // CUSTOMER HOME
          // ============================================================

          class CustomerHome extends StatefulWidget {
            const CustomerHome({
              super.key,
            });

            @override
            State<CustomerHome> createState() =>
                _CustomerHomeState();
          }

          class _CustomerHomeState
              extends State<CustomerHome> {
            final searchController =
                TextEditingController();

            String search = '';
            String? propertyType;
            String? furnished;
            int? minimumBedrooms;
            bool onlyAvailable = true;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            Future<void> logout() async {
              await auth.signOut();
            }

            void openFilters() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (_) {
                  return _FilterSheet(
                    propertyType: propertyType,
                    furnished: furnished,
                    minimumBedrooms:
                        minimumBedrooms,
                    onlyAvailable: onlyAvailable,
                    onApply: (
                      type,
                      furnishedValue,
                      bedrooms,
                      available,
                    ) {
                      setState(() {
                        propertyType = type;
                        furnished =
                            furnishedValue;
                        minimumBedrooms =
                            bedrooms;
                        onlyAvailable =
                            available;
                      });
                    },
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              final currentUser = auth.currentUser;

              if (currentUser == null) {
                return const AuthScreen();
              }

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('KothaFinder Nepal'),
                  actions: [
                    StreamBuilder<
                        QuerySnapshot<
                            Map<String, dynamic>>>(
                      stream: db
                          .collection('inquiries')
                          .where(
                            'customerId',
                            isEqualTo:
                                currentUser.uid,
                          )
                          .snapshots(),
                      builder: (
                        context,
                        snapshot,
                      ) {
                        final docs =
                            snapshot.data?.docs ?? [];

                        final unread = docs
                            .where(
                              (doc) =>
                                  doc.data()['isRead'] !=
                                  true,
                            )
                            .length;

                        return Stack(
                          children: [
                            IconButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const CustomerInquiriesScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(
                                Icons.message_outlined,
                              ),
                            ),
                            if (unread > 0)
                              Positioned(
                                right: 5,
                                top: 5,
                                child: CircleAvatar(
                                  radius: 9,
                                  child: Text(
                                    unread > 9
                                        ? '9+'
                                        : '$unread',
                                    style:
                                        const TextStyle(
                                      fontSize: 9,
                                    ),
                                  ),
                                ),
                              ),
                          ],
                        );
                      },
                    ),
                    IconButton(
                      onPressed: logout,
                      icon:
                          const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding:
                          const EdgeInsets.fromLTRB(
                        16,
                        16,
                        16,
                        8,
                      ),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller:
                                  searchController,
                              onChanged: (value) {
                                setState(() {
                                  search =
                                      value.trim()
                                          .toLowerCase();
                                });
                              },
                              decoration:
                                  InputDecoration(
                                hintText:
                                    'Search location or property',
                                prefixIcon:
                                    const Icon(
                                  Icons.search,
                                ),
                                border:
                                    const OutlineInputBorder(),
                                suffixIcon:
                                    IconButton(
                                  onPressed: () {
                                    searchController
                                        .clear();

                                    setState(() {
                                      search = '';
                                    });
                                  },
                                  icon:
                                      const Icon(
                                    Icons.clear,
                                  ),
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton(
                            onPressed: openFilters,
                            icon:
                                const Icon(Icons.tune),
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: StreamBuilder<
                          QuerySnapshot<
                              Map<String, dynamic>>>(
                        stream: db
                            .collection('properties')
                            .snapshots(),
                        builder: (
                          context,
                          snapshot,
                        ) {
                          if (snapshot.connectionState ==
                              ConnectionState.waiting) {
                            return const Center(
                              child:
                                  CircularProgressIndicator(),
                            );
                          }

                          if (snapshot.hasError) {
                            return Center(
                              child: Padding(
                                padding:
                                    const EdgeInsets.all(
                                  24,
                                ),
                                child: Text(
                                  snapshot.error
                                      .toString(),
                                  textAlign:
                                      TextAlign.center,
                                ),
                              ),
                            );
                          }

                          final docs =
                              snapshot.data?.docs ?? [];

                          final filtered = docs.where(
                            (doc) {
                              final data =
                                  doc.data();

                              final title =
                                  (data['title'] ??
                                          '')
                                      .toString()
                                      .toLowerCase();

                              final location =
                                  (data['location'] ??
                                          '')
                                      .toString()
                                      .toLowerCase();

                              final type =
                                  (data['propertyType'] ??
                                          '')
                                      .toString();

                              final furnishedValue =
                                  (data['furnished'] ??
                                          '')
                                      .toString();

                              final bedrooms =
                                  int.tryParse(
                                        '${data['bedrooms'] ?? 0}',
                                      ) ??
                                      0;

                              final available =
                                  data['available'] !=
                                      false;

                              if (search.isNotEmpty &&
                                  !title.contains(
                                    search,
                                  ) &&
                                  !location.contains(
                                    search,
                                  )) {
                                return false;
                              }

                              if (propertyType !=
                                      null &&
                                  propertyType!
                                      .isNotEmpty &&
                                  type !=
                                      propertyType) {
                                return false;
                              }

                              if (furnished !=
                                      null &&
                                  furnished!.isNotEmpty &&
                                  furnishedValue !=
                                      furnished) {
                                return false;
                              }

                              if (minimumBedrooms !=
                                      null &&
                                  bedrooms <
                                      minimumBedrooms!) {
                                return false;
                              }

                              if (onlyAvailable &&
                                  !available) {
                                return false;
                              }

                              return true;
                            },
                          ).toList();

                          if (filtered.isEmpty) {
                            return const Center(
                              child: Text(
                                'No properties found.',
                              ),
                            );
                          }

                          return ListView.builder(
                            padding:
                                const EdgeInsets.all(
                              16,
                            ),
                            itemCount:
                                filtered.length,
                            itemBuilder: (
                              context,
                              index,
                            ) {
                              final doc =
                                  filtered[index];

                              return PropertyCard(
                                doc: doc,
                              );
                            },
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

