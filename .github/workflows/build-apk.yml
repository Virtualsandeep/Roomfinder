            final String? propertyId;
            final Map<String, dynamic>? existingData;

            const AddPropertyScreen({
              super.key,
              this.propertyId,
              this.existingData,
            });

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            final titleController =
                TextEditingController();
            final locationController =
                TextEditingController();
            final rentController =
                TextEditingController();
            final discountController =
                TextEditingController();
            final bedroomsController =
                TextEditingController();
            final bathroomsController =
                TextEditingController();
            final descriptionController =
                TextEditingController();

            String propertyType = 'Room';
            bool furnished = false;
            bool available = true;
            bool loading = false;

            bool get editing =>
                widget.propertyId != null;

            @override
            void initState() {
              super.initState();

              final data = widget.existingData;

              if (data != null) {
                titleController.text =
                    data['title']?.toString() ?? '';
                locationController.text =
                    data['location']?.toString() ?? '';
                rentController.text =
                    data['monthlyRent']?.toString() ?? '';
                discountController.text =
                    data['discount']?.toString() ?? '';
                bedroomsController.text =
                    data['bedrooms']?.toString() ?? '';
                bathroomsController.text =
                    data['bathrooms']?.toString() ?? '';
                descriptionController.text =
                    data['description']?.toString() ?? '';

                propertyType =
                    data['propertyType']?.toString() ??
                        'Room';

                furnished =
                    data['furnished'] == true;

                available =
                    data['available'] != false;
              }
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            Future<void> saveProperty() async {
              final user = auth.currentUser;

              if (user == null) return;

              final title =
                  titleController.text.trim();
              final location =
                  locationController.text.trim();

              if (title.isEmpty ||
                  location.isEmpty) {
                showMessage(
                  'Title and location are required.',
                );
                return;
              }

              final rent =
                  double.tryParse(
                        rentController.text.trim(),
                      ) ??
                      0;

              final discount =
                  double.tryParse(
                        discountController.text.trim(),
                      ) ??
                      0;

              final bedrooms =
                  int.tryParse(
                        bedroomsController.text.trim(),
                      ) ??
                      0;

              final bathrooms =
                  int.tryParse(
                        bathroomsController.text.trim(),
                      ) ??
                      0;

              if (rent <= 0) {
                showMessage(
                  'Enter a valid monthly rent.',
                );
                return;
              }

              setState(() => loading = true);

              try {
                final data =
                    <String, dynamic>{
                  'title': title,
                  'propertyType':
                      propertyType,
                  'location': location,
                  'monthlyRent': rent,
                  'discount': discount,
                  'bedrooms': bedrooms,
                  'bathrooms': bathrooms,
                  'description':
                      descriptionController.text
                          .trim(),
                  'furnished': furnished,
                  'available': available,
                  'landlordId': user.uid,
                };

                if (editing) {
                  data['updatedAt'] =
                      FieldValue.serverTimestamp();

                  await db
                      .collection('properties')
                      .doc(widget.propertyId)
                      .update(data);
                } else {
                  data['createdAt'] =
                      FieldValue.serverTimestamp();

                  await db
                      .collection('properties')
                      .add(data);
                }

                if (mounted) {
                  Navigator.pop(context);
                }
              } catch (e) {
                showMessage(
                  'Could not save property: $e',
                );
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            void showMessage(String message) {
              if (!mounted) return;

              ScaffoldMessenger.of(context)
                  .showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    editing
                        ? 'Edit Property'
                        : 'Add Property',
                  ),
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(18),
                    child: Column(
                      crossAxisAlignment:
                          CrossAxisAlignment.stretch,
                      children: [
                        TextField(
                          controller: titleController,
                          decoration:
                              const InputDecoration(
                            labelText: 'Property title',
                            prefixIcon:
                                Icon(Icons.title),
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: locationController,
                          decoration:
                              const InputDecoration(
                            labelText: 'Location',
                            hintText:
                                'Kathmandu, Lalitpur, Bhaktapur...',
                            prefixIcon: Icon(
                              Icons.location_on_outlined,
                            ),
                          ),
                        ),
                        const SizedBox(height: 14),
                        DropdownButtonFormField<String>(
                          value: propertyType,
                          decoration:
                              const InputDecoration(
                            labelText: 'Property type',
                          ),
                          items: const [
                            'Room',
                            '1BHK',
                            '2BHK',
                            'Flat',
                          ]
                              .map(
                                (value) =>
                                    DropdownMenuItem(
                                  value: value,
                                  child: Text(value),
                                ),
                              )
                              .toList(),
                          onChanged: (value) {
                            if (value != null) {
                              setState(() {
                                propertyType = value;
                              });
                            }
                          },
                        ),
                        const SizedBox(height: 14),
                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller:
                                    rentController,
                                keyboardType:
                                    TextInputType.number,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'Monthly rent',
                                  prefixText: 'Rs. ',
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: TextField(
                                controller:
                                    discountController,
                                keyboardType:
                                    TextInputType.number,
                                decoration:
                                    const InputDecoration(
                                  labelText: 'Discount',
                                  prefixText: 'Rs. ',
                                ),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 14),
                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller:
                                    bedroomsController,
                                keyboardType:
                                    TextInputType.number,
                                decoration:
                                    const InputDecoration(
                                  labelText: 'Bedrooms',
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: TextField(
                                controller:
                                    bathroomsController,
                                keyboardType:
                                    TextInputType.number,
                                decoration:
                                    const InputDecoration(
                                  labelText: 'Bathrooms',
