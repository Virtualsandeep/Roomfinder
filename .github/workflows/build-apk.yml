            });

            @override
            State<InquiryDetailsScreen> createState() =>
                _InquiryDetailsScreenState();
          }

          class _InquiryDetailsScreenState
              extends State<InquiryDetailsScreen> {
            late String status;
            bool updating = false;

            @override
            void initState() {
              super.initState();

              status = (widget.data['status'] ?? 'new')
                  .toString();

              if (widget.landlordView && status == 'new') {
                markAsRead();
              }
            }

            Future<void> markAsRead() async {
              try {
                await FirebaseFirestore.instance
                    .collection('inquiries')
                    .doc(widget.inquiryId)
                    .update({
                  'status': 'read',
                  'updatedAt': FieldValue.serverTimestamp(),
                });

                if (mounted) {
                  setState(() {
                    status = 'read';
                  });
                }
              } catch (_) {}
            }

            Future<void> changeStatus(String newStatus) async {
              setState(() {
                updating = true;
              });

              try {
                await FirebaseFirestore.instance
                    .collection('inquiries')
                    .doc(widget.inquiryId)
                    .update({
                  'status': newStatus,
                  'updatedAt': FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                setState(() {
                  status = newStatus;
                });

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Status changed to ${newStatus.toUpperCase()}.',
                    ),
                  ),
                );
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Failed to update status: $e',
                    ),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() {
                    updating = false;
                  });
                }
              }
            }

            String displayStatus(String value) {
              switch (value) {
                case 'accepted':
                  return 'Accepted';
                case 'contacted':
                  return 'Contacted';
                case 'closed':
                  return 'Closed';
                case 'read':
                  return 'Read';
                default:
                  return 'New';
              }
