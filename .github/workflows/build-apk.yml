            Future<void> contactLandlord(
              BuildContext context,
            ) async {
              final customer = auth.currentUser;

              if (customer == null) {
                showMessage(
                  context,
                  'Please login first.',
                );
                return;
              }

              final data = doc.data();

              final landlordId =
                  data['landlordId']
                      ?.toString();

              if (landlordId == null ||
                  landlordId.isEmpty) {
                showMessage(
                  context,
                  'Landlord information is unavailable.',
                );
                return;
              }

              try {
                final customerDoc = await db
                    .collection('users')
                    .doc(customer.uid)
                    .get();

                final landlordDoc = await db
                    .collection('users')
                    .doc(landlordId)
                    .get();

                if (!landlordDoc.exists) {
                  if (!context.mounted) return;

                  showMessage(
                    context,
                    'Landlord account not found.',
                  );
                  return;
                }

                final customerData =
                    customerDoc.data() ?? {};

                final landlordData =
                    landlordDoc.data() ?? {};

                final controller =
                    TextEditingController();

                final message =
                    await showDialog<String>(
                  context: context,
                  builder: (dialogContext) {
                    return AlertDialog(
                      title: const Text(
                        'Contact Landlord',
                      ),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize:
                              MainAxisSize.min,
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              'Landlord: ${landlordData['name'] ?? 'Landlord'}',
                            ),
                            const SizedBox(height: 4),
                            Text(
                              'Email: ${landlordData['email'] ?? ''}',
                            ),
                            const SizedBox(height: 16),
                            TextField(
                              controller:
                                  controller,
                              maxLines: 5,
                              decoration:
                                  const InputDecoration(
                                labelText: 'Message',
                                hintText:
                                    'I am interested in this property...',
                                border:
                                    OutlineInputBorder(),
                              ),
                            ),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            Navigator.pop(
                              dialogContext,
                            );
                          },
                          child:
                              const Text('Cancel'),
                        ),
                        FilledButton(
                          onPressed: () {
                            final value =
                                controller.text
                                    .trim();

                            if (value.isEmpty) {
                              showMessage(
                                dialogContext,
                                'Please enter a message.',
                              );
                              return;
                            }

                            Navigator.pop(
                              dialogContext,
                              value,
                            );
                          },
                          child:
                              const Text('Send'),
                        ),
                      ],
                    );
                  },
                );

                controller.dispose();

                if (message == null ||
                    message.trim().isEmpty) {
                  return;
                }

                await db
                    .collection('inquiries')
                    .add({
                  'customerId':
                      customer.uid,
                  'customerName':
                      customerData['name'] ??
                          customer.displayName ??
                          'Customer',
                  'customerEmail':
                      customerData['email'] ??
                          customer.email ??
                          '',
                  'landlordId': landlordId,
                  'landlordName':
                      landlordData['name'] ??
                          'Landlord',
                  'landlordEmail':
                      landlordData['email'] ?? '',
                  'propertyId': doc.id,
                  'propertyTitle':
                      data['title'] ?? 'Property',
                  'message': message,
                  'status': 'new',
                  'isRead': false,
                  'createdAt':
                      FieldValue.serverTimestamp(),
                });

                if (!context.mounted) return;

                showMessage(
                  context,
                  'Inquiry sent successfully.',
                );
              } catch (e) {
                if (!context.mounted) return;

                showMessage(
                  context,
                  'Could not send inquiry: $e',
                );
              }
