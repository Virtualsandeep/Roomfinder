          class LandlordDashboard extends StatelessWidget {
            const LandlordDashboard({super.key});

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            Widget build(BuildContext context) {
              final user =
                  FirebaseAuth.instance.currentUser;

              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Landlord Dashboard',
                  ),
                  actions: [
                    IconButton(
                      tooltip: 'Inquiries',
                      onPressed: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                const LandlordInquiriesScreen(),
                          ),
                        );
                      },
                      icon: const Icon(
                        Icons.mark_unread_chat_alt_outlined,
                      ),
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) =>
                            const AddPropertyScreen(),
                      ),
                    );
                  },
                  icon: const Icon(Icons.add),
                  label: const Text('Add Property'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('properties')
                      .where(
                        'landlordId',
                        isEqualTo: user?.uid,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Unable to load your properties.\n\n'
                            '${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs =
                        snapshot.data?.docs ?? [];

                    if (docs.isEmpty) {
                      return const Center(
                        child: Padding(
                          padding: EdgeInsets.all(24),
                          child: Text(
                            'You have not added any properties yet.\n\n'
                            'Tap "Add Property" to create your first listing.',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: docs.length,
                      itemBuilder: (context, index) {
                        return LandlordPropertyCard(
                          propertyId: docs[index].id,
                          data: docs[index].data(),
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

          // =====================================================
          // LANDLORD INQUIRIES
          // =====================================================

          class LandlordInquiriesScreen extends StatelessWidget {
            const LandlordInquiriesScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final user =
                  FirebaseAuth.instance.currentUser;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Inquiries'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('inquiries')
                      .where(
                        'landlordId',
                        isEqualTo: user?.uid,
                      )
                      .orderBy(
                        'createdAt',
                        descending: true,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Unable to load inquiries.\n\n'
                            '${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs =
                        snapshot.data?.docs ?? [];

                    if (docs.isEmpty) {
                      return const Center(
                        child: Text(
                          'No inquiries yet.',
