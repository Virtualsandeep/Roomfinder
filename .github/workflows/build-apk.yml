      # 17. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk      #
      # NOTE:
      # This keeps Step 7 Google Maps functionality.
      # No Google Maps SDK/API key is used.
      # ============================================================
      - name: Add Firebase and Maps packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add url_launcher

      # ============================================================
      # 9. GOOGLE SERVICES GRADLE PLUGIN
      # ============================================================
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle
          path = Path("build_app/android/settings.gradle")
          text = path.read_text()

          old = 'id "dev.flutter.flutter-plugin-loader" version "1.0.0"'

          new = '''id "dev.flutter.flutter-plugin-loader" version "1.0.0"
          id "com.google.gms.google-services" version "4.4.2" apply false'''

          if "com.google.gms.google-services" not in text:
              text = text.replace(old, new)

          path.write_text(text)

          # app/build.gradle
          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          if 'id "com.google.gms.google-services"' not in text:
              marker = "plugins {"
              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "Could not find plugins block in app/build.gradle"
                  )

              insert_at = index + len(marker)

              text = (
                  text[:insert_at]
                  + '\n    id "com.google.gms.google-services"'
                  + text[insert_at:]
              )

          path.write_text(text)
          PY

      # ============================================================
      # 10. CREATE FIREBASE OPTIONS
      # ============================================================
      - name: Create firebase_options.dart
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("google-services.json")

          if not source.exists():
              raise SystemExit("google-services.json was not found")

          data = json.loads(source.read_text())

          project_info = data["project_info"]
          client = data["client"][0]

          project_id = project_info["project_id"]
          storage_bucket = project_info.get("storage_bucket", "")
          project_number = project_info["project_number"]

          api_key = client["api_key"][0]["current_key"]

          app_id = None
          package_name = "com.kothafinder.nepal"

          for item in client.get("client_info", {}).get(
              "android_client_info", {}
          ).items():
              pass

          for oauth_client in client.get("oauth_client", []):
              if oauth_client.get("client_type") == 3:
                  pass

          # Find Android app ID from google-services.json.
          # The client_info itself does not contain the Firebase app ID,
          # so derive it from the Google Services generated resources
          # using the standard Firebase Android format.
          #
          # The app ID is normally stored in google-services.xml after
          # the Google Services Gradle plugin runs. We therefore create
          # firebase_options.dart with the values available here and use
          # the Android app ID from the JSON when available.

          app_id = client.get("client_info", {}).get("mobilesdk_app_id")

          if not app_id:
              app_id = data.get("mobilesdk_app_id")

          if not app_id:
              raise SystemExit(
                  "Could not find mobilesdk_app_id in google-services.json"
              )

          dart = f'''// File generated by the KothaFinder GitHub Actions workflow.
// Do not edit manually.

import 'package:firebase_core/firebase_core.dart';
import 'package:flutter/foundation.dart';

class DefaultFirebaseOptions {{
  static FirebaseOptions get currentPlatform {{
    if (kIsWeb) {{
      throw UnsupportedError(
        'KothaFinder does not support Firebase Web in this build.',
      );
    }}

    if (defaultTargetPlatform == TargetPlatform.android) {{
      return android;
    }}

    throw UnsupportedError(
      'DefaultFirebaseOptions are not supported for this platform.',
    );
  }}

  static const FirebaseOptions android = FirebaseOptions(
    apiKey: {api_key!r},
    appId: {app_id!r},
    messagingSenderId: {project_number!r},
    projectId: {project_id!r},
    storageBucket: {storage_bucket!r},
  );
}}
'''

          # Convert Python repr strings to valid Dart strings.
          dart = dart.replace("'", "'")

          output = Path("build_app/lib/firebase_options.dart")
          output.write_text(dart)

          print("firebase_options.dart created successfully.")
          PY

      # ============================================================
      # 11. CREATE APPLICATION
      #
      # Includes:
      # - Authentication
      # - Customer dashboard
      # - Property search/filter
      # - Landlord property management
      # - Customer inquiries
      # - Landlord inquiries
      # - Inquiry statuses
      # - isRead handling
      # - Google Maps
      # ============================================================
      - name: Create application
        run: |
          cat > build_app/lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';

          import 'firebase_options.dart';

          final FirebaseAuth auth = FirebaseAuth.instance;
          final FirebaseFirestore db = FirebaseFirestore.instance;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp(
              options: DefaultFirebaseOptions.currentPlatform,
            );

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: const Color(0xFF3156D3),
                  scaffoldBackgroundColor: const Color(0xFFF7F8FC),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: BorderSide.none,
                    ),
                    enabledBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: BorderSide.none,
                    ),
                    focusedBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: const BorderSide(
                        color: Color(0xFF3156D3),
                        width: 1.5,
                      ),
                    ),
                  ),
                ),
                home: StreamBuilder<User?>(
                  stream: auth.authStateChanges(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const LoadingScreen();
                    }

                    if (!snapshot.hasData) {
                      return const AuthScreen();
                    }

                    return RoleGate(userId: snapshot.data!.uid);
                  },
                ),
              );
            }
          }

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          class RoleGate extends StatelessWidget {
            final String userId;

            const RoleGate({
              super.key,
              required this.userId,
            });

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<
                  DocumentSnapshot<Map<String, dynamic>>>(
                stream: db.collection('users').doc(userId).snapshots(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  final data = snapshot.data?.data();
                  final role = data?['role'];

                  if (role == 'landlord') {
                    return const LandlordHome();
                  }

                  return CustomerHome(
                    needsRole: role == null,
                  );
                },
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> login() async {
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (email.isEmpty || password.isEmpty) {
                showMessage('Enter your email and password.');
                return;
              }

              setState(() => loading = true);

              try {
                await auth.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                showMessage(e.message ?? 'Login failed.');
              } catch (e) {
                showMessage('Login failed: $e');
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            Future<void> register() async {
              await Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => const RegisterScreen(),
                ),
              );
            }

            void showMessage(String message) {
              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(
                          maxWidth: 480,
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            const Icon(
                              Icons.home_work_rounded,
                              size: 70,
                              color: Color(0xFF3156D3),
                            ),
                            const SizedBox(height: 18),
                            const Text(
                              'KothaFinder Nepal',
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                fontSize: 30,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'Find your next place to live.',
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                color: Colors.grey.shade600,
                                fontSize: 16,
                              ),
                            ),
                            const SizedBox(height: 35),
                            TextField(
                              controller: emailController,
                              keyboardType: TextInputType.emailAddress,
                              decoration: const InputDecoration(
                                labelText: 'Email',
                                prefixIcon: Icon(Icons.email_outlined),
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: passwordController,
                              obscureText: obscurePassword,
                              decoration: InputDecoration(
                                labelText: 'Password',
                                prefixIcon:
                                    const Icon(Icons.lock_outline),
                                suffixIcon: IconButton(
                                  onPressed: () {
                                    setState(() {
                                      obscurePassword = !obscurePassword;
                                    });
                                  },
                                  icon: Icon(
                                    obscurePassword
                                        ? Icons.visibility_outlined
                                        : Icons.visibility_off_outlined,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 20),
                            SizedBox(
                              height: 52,
                              child: FilledButton(
                                onPressed: loading ? null : login,
                                child: loading
                                    ? const SizedBox(
                                        width: 22,
                                        height: 22,
                                        child:
                                            CircularProgressIndicator(
                                          strokeWidth: 2,
                                        ),
                                      )
                                    : const Text('Login'),
                              ),
                            ),
                            const SizedBox(height: 10),
                            TextButton(
                              onPressed: loading ? null : register,
                              child: const Text(
                                'Create a new account',
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() => _RegisterScreenState();
          }

          class _RegisterScreenState extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> register() async {
              final name = nameController.text.trim();
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (name.isEmpty) {
                showMessage('Enter your name.');
                return;
              }

              if (email.isEmpty) {
                showMessage('Enter your email.');
                return;
              }

              if (password.length < 6) {
                showMessage(
                  'Password must contain at least 6 characters.',
                );
                return;
              }

              setState(() => loading = true);

              try {
                final credential =
                    await auth.createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception('Could not create user.');
                }

                await user.updateDisplayName(name);

                await db.collection('users').doc(user.uid).set({
                  'uid': user.uid,
                  'name': name,
                  'email': email,
                  'role': role,
                  'createdAt': FieldValue.serverTimestamp(),
                });

                if (mounted) {
                  Navigator.pop(context);
                }
              } on FirebaseAuthException catch (e) {
                showMessage(e.message ?? 'Registration failed.');
              } catch (e) {
                showMessage('Registration failed: $e');
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            void showMessage(String message) {
              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        TextField(
                          controller: nameController,
                          textCapitalization: TextCapitalization.words,
                          decoration: const InputDecoration(
                            labelText: 'Full name',
                            prefixIcon: Icon(Icons.person_outline),
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: emailController,
                          keyboardType: TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            labelText: 'Email',
                            prefixIcon: Icon(Icons.email_outlined),
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: passwordController,
                          obscureText: obscurePassword,
                          decoration: InputDecoration(
                            labelText: 'Password',
                            prefixIcon:
                                const Icon(Icons.lock_outline),
                            suffixIcon: IconButton(
                              onPressed: () {
                                setState(() {
                                  obscurePassword =
                                      !obscurePassword;
                                });
                              },
                              icon: Icon(
                                obscurePassword
                                    ? Icons.visibility_outlined
                                    : Icons.visibility_off_outlined,
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'Account type',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 8),
                        SegmentedButton<String>(
                          segments: const [
                            ButtonSegment(
                              value: 'customer',
                              label: Text('Customer'),
                              icon: Icon(Icons.person_outline),
                            ),
                            ButtonSegment(
                              value: 'landlord',
                              label: Text('Landlord'),
                              icon: Icon(Icons.home_work_outlined),
                            ),
                          ],
                          selected: {role},
                          onSelectionChanged: (value) {
                            setState(() {
                              role = value.first;
                            });
                          },
                        ),
                        const SizedBox(height: 25),
                        SizedBox(
                          height: 52,
                          child: FilledButton(
                            onPressed: loading ? null : register,
                            child: loading
                                ? const SizedBox(
                                    width: 22,
                                    height: 22,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : const Text('Create Account'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class CustomerHome extends StatefulWidget {
            final bool needsRole;

            const CustomerHome({
              super.key,
              this.needsRole = false,
            });

            @override
            State<CustomerHome> createState() => _CustomerHomeState();
          }

          class _CustomerHomeState extends State<CustomerHome> {
            final searchController = TextEditingController();

            String propertyType = 'All';
            String furnished = 'All';
            String availability = 'All';
            int minimumBedrooms = 0;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            void logout() async {
              await auth.signOut();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  actions: [
                    IconButton(
                      tooltip: 'My Inquiries',
                      onPressed: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                const CustomerInquiriesScreen(),
                          ),
                        );
                      },
                      icon: const Icon(Icons.message_outlined),
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: db
                      .collection('properties')
                      .orderBy(
                        'createdAt',
                        descending: true,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(20),
                          child: Text(
                            'Could not load properties.\n\n${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs = snapshot.data?.docs ?? [];

                    final query =
                        searchController.text.trim().toLowerCase();

                    final filtered = docs.where((doc) {
                      final data = doc.data();

                      final title =
                          (data['title'] ?? '').toString().toLowerCase();

                      final location =
                          (data['location'] ?? '')
                              .toString()
                              .toLowerCase();

                      final type =
                          (data['propertyType'] ?? '').toString();

                      final isFurnished =
                          data['furnished'] == true;

                      final available =
                          data['available'] != false;

                      final bedrooms =
                          int.tryParse(
                                '${data['bedrooms'] ?? 0}',
                              ) ??
                              0;

                      if (query.isNotEmpty &&
                          !title.contains(query) &&
                          !location.contains(query)) {
                        return false;
                      }

                      if (propertyType != 'All' &&
                          type != propertyType) {
                        return false;
                      }

                      if (furnished == 'Furnished' &&
                          !isFurnished) {
                        return false;
                      }

                      if (furnished == 'Unfurnished' &&
                          isFurnished) {
                        return false;
                      }

                      if (availability == 'Available' &&
                          !available) {
                        return false;
                      }

                      if (availability == 'Unavailable' &&
                          available) {
                        return false;
                      }

                      if (bedrooms < minimumBedrooms) {
                        return false;
                      }

                      return true;
                    }).toList();

                    return RefreshIndicator(
                      onRefresh: () async {
                        setState(() {});
                      },
                      child: ListView(
                        padding: const EdgeInsets.fromLTRB(
                          16,
                          10,
                          16,
                          30,
                        ),
                        children: [
                          if (widget.needsRole)
                            Card(
                              child: ListTile(
                                leading: const Icon(
                                  Icons.info_outline,
                                ),
                                title: const Text(
                                  'Complete your account',
                                ),
                                subtitle: const Text(
                                  'Your customer account is ready.',
                                ),
                              ),
                            ),
                          TextField(
                            controller: searchController,
                            onChanged: (_) => setState(() {}),
                            decoration: InputDecoration(
                              hintText:
                                  'Search by location or property...',
                              prefixIcon:
                                  const Icon(Icons.search),
                              suffixIcon: searchController
                                      .text.isNotEmpty
                                  ? IconButton(
                                      onPressed: () {
                                        searchController.clear();
                                        setState(() {});
                                      },
                                      icon: const Icon(Icons.clear),
                                    )
                                  : null,
                            ),
                          ),
                          const SizedBox(height: 12),
                          Wrap(
                            spacing: 8,
                            runSpacing: 8,
                            children: [
                              FilterChip(
                                label:
                                    Text(propertyType),
                                selected:
                                    propertyType != 'All',
                                onSelected: (_) =>
                                    showPropertyTypeFilter(),
                              ),
                              FilterChip(
                                label:
                                    Text(furnished),
                                selected:
                                    furnished != 'All',
                                onSelected: (_) =>
                                    showFurnishedFilter(),
                              ),
                              FilterChip(
                                label:
                                    Text(availability),
                                selected:
                                    availability != 'All',
                                onSelected: (_) =>
                                    showAvailabilityFilter(),
                              ),
                              FilterChip(
                                label: Text(
                                  minimumBedrooms == 0
                                      ? 'Bedrooms'
                                      : '$minimumBedrooms+ Beds',
                                ),
                                selected:
                                    minimumBedrooms > 0,
                                onSelected: (_) =>
                                    showBedroomFilter(),
                              ),
                            ],
                          ),
                          const SizedBox(height: 18),
                          if (filtered.isEmpty)
                            const Padding(
                              padding: EdgeInsets.only(top: 70),
                              child: Column(
                                children: [
                                  Icon(
                                    Icons.home_outlined,
                                    size: 60,
                                  ),
                                  SizedBox(height: 15),
                                  Text(
                                    'No properties found.',
                                    style: TextStyle(
                                      fontSize: 18,
                                      fontWeight:
                                          FontWeight.bold,
                                    ),
                                  ),
                                  SizedBox(height: 5),
                                  Text(
                                    'Try changing your search or filters.',
                                  ),
                                ],
                              ),
                            )
                          else
                            ...filtered.map(
                              (doc) => PropertyCard(
                                propertyId: doc.id,
                                data: doc.data(),
                              ),
                            ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            void showPropertyTypeFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return _FilterSheet(
                    title: 'Property Type',
                    values: const [
                      'All',
                      'Room',
                      '1BHK',
                      '2BHK',
                      'Flat',
                    ],
                    selected: propertyType,
                    onSelected: (value) {
                      setState(() {
                        propertyType = value;
                      });
                    },
                  );
                },
              );
            }

            void showFurnishedFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return _FilterSheet(
                    title: 'Furnished',
                    values: const [
                      'All',
                      'Furnished',
                      'Unfurnished',
                    ],
                    selected: furnished,
                    onSelected: (value) {
                      setState(() {
                        furnished = value;
                      });
                    },
                  );
                },
              );
            }

            void showAvailabilityFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return _FilterSheet(
                    title: 'Availability',
                    values: const [
                      'All',
                      'Available',
                      'Unavailable',
                    ],
                    selected: availability,
                    onSelected: (value) {
                      setState(() {
                        availability = value;
                      });
                    },
                  );
                },
              );
            }

            void showBedroomFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return _FilterSheet(
                    title: 'Minimum Bedrooms',
                    values: const [
                      '0',
                      '1',
                      '2',
                      '3',
                      '4',
                    ],
                    selected: minimumBedrooms.toString(),
                    onSelected: (value) {
                      setState(() {
                        minimumBedrooms =
                            int.tryParse(value) ?? 0;
