name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      - name: Configure Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "namespace = \"com.example.kothafinder_nepal\"",
              "namespace = \"com.kothafinder.nepal\""
          )

          text = text.replace(
              "applicationId = \"com.example.kothafinder_nepal\"",
              "applicationId = \"com.kothafinder.nepal\""
          )

          path.write_text(text)
          PY

      - name: Configure minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          path.write_text(text)
          PY

      - name: Verify Android configuration
        run: |
          grep -n "namespace" build_app/android/app/build.gradle
          grep -n "applicationId" build_app/android/app/build.gradle
          grep -n "minSdk" build_app/android/app/build.gradle

      - name: Copy Firebase configuration
        run: |
          test -f google-services.json
          cp google-services.json build_app/android/app/google-services.json

      - name: Verify Firebase configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q "com.kothafinder.nepal" build_app/android/app/google-services.json

      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/settings.gradle")
          text = path.read_text()

          old = "id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\""

          new = """id "dev.flutter.flutter-plugin-loader" version "1.0.0"
          id "com.google.gms.google-services" version "4.4.2" apply false"""

          if "com.google.gms.google-services" not in text:
              text = text.replace(old, new)

          path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          plugin_line = 'id "com.google.gms.google-services"'

          if plugin_line not in text:
              marker = 'plugins {'
              index = text.find(marker)

              if index != -1:
                  insert_at = index + len(marker)
                  text = (
                      text[:insert_at]
                      + '\n    id "com.google.gms.google-services"'
                      + text[insert_at:]
                  )

          path.write_text(text)
          PY

      - name: Create application
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'KothaFinder Nepal',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.indigo,
                  ),
                  useMaterial3: true,
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(),
                      ),
                    );
                  }

                  if (!snapshot.hasData) {
                    return const LoginScreen();
                  }

                  return const RoleLoadingScreen();
                },
              );
            }
          }

          class RoleLoadingScreen extends StatelessWidget {
            const RoleLoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final user = FirebaseAuth.instance.currentUser;

              if (user == null) {
                return const LoginScreen();
              }

              return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                stream: FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .snapshots(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(),
                      ),
                    );
                  }

                  if (snapshot.hasError) {
                    return Scaffold(
                      body: Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Error loading profile:\n${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      ),
                    );
                  }

                  final data = snapshot.data?.data();

                  if (data == null) {
                    return const LoginScreen();
                  }

                  final role = data['role'];

                  if (role == 'landlord') {
                    return const LandlordDashboard();
                  }

                  return const CustomerDashboard();
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> login() async {
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (email.isEmpty || password.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Please enter email and password.'),
                  ),
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                await FirebaseAuth.instance.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      e.message ?? 'Login failed.',
                    ),
                  ),
                );
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('Login failed: $e'),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  centerTitle: true,
                ),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: ConstrainedBox(
                      constraints: const BoxConstraints(
                        maxWidth: 500,
                      ),
                      child: Column(
                        children: [
                          const Icon(
                            Icons.home_work_outlined,
                            size: 80,
                          ),
                          const SizedBox(height: 16),
                          const Text(
                            'Find Your Next Home',
                            style: TextStyle(
                              fontSize: 26,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 32),
                          TextField(
                            controller: emailController,
                            keyboardType: TextInputType.emailAddress,
                            decoration: const InputDecoration(
                              labelText: 'Email',
                              border: OutlineInputBorder(),
                              prefixIcon: Icon(Icons.email_outlined),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: passwordController,
                            obscureText: obscurePassword,
                            decoration: InputDecoration(
                              labelText: 'Password',
                              border: const OutlineInputBorder(),
                              prefixIcon: const Icon(
                                Icons.lock_outline,
                              ),
                              suffixIcon: IconButton(
                                onPressed: () {
                                  setState(() {
                                    obscurePassword = !obscurePassword;
                                  });
                                },
                                icon: Icon(
                                  obscurePassword
                                      ? Icons.visibility
                                      : Icons.visibility_off,
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(height: 24),
                          SizedBox(
                            width: double.infinity,
                            height: 50,
                            child: FilledButton(
                              onPressed: loading ? null : login,
                              child: loading
                                  ? const SizedBox(
                                      width: 22,
                                      height: 22,
                                      child: CircularProgressIndicator(
                                        strokeWidth: 2,
                                      ),
                                    )
                                  : const Text('Login'),
                            ),
                          ),
                          const SizedBox(height: 12),
                          TextButton(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) => const RegisterScreen(),
                                ),
                              );
                            },
                            child: const Text(
                              'Create an account',
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() => _RegisterScreenState();
          }

          class _RegisterScreenState extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            Future<void> register() async {
              final name = nameController.text.trim();
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (name.isEmpty ||
                  email.isEmpty ||
                  password.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Please fill all fields.'),
                  ),
                );
                return;
              }

              if (password.length < 6) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Password must be at least 6 characters.',
                    ),
                  ),
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                final credential = await FirebaseAuth.instance
                    .createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception('Unable to create account.');
                }

                await user.updateDisplayName(name);

                await FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .set({
                  'uid': user.uid,
                  'name': name,
                  'email': email,
                  'role': role,
                  'createdAt': FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Account created successfully.',
                    ),
                  ),
                );

                Navigator.pop(context);
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      e.message ?? 'Registration failed.',
                    ),
                  ),
                );
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('Registration failed: $e'),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      TextField(
                        controller: nameController,
                        decoration: const InputDecoration(
                          labelText: 'Full Name',
                          border: OutlineInputBorder(),
                          prefixIcon: Icon(Icons.person_outline),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: emailController,
                        keyboardType: TextInputType.emailAddress,
                        decoration: const InputDecoration(
                          labelText: 'Email',
                          border: OutlineInputBorder(),
                          prefixIcon: Icon(Icons.email_outlined),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: passwordController,
                        obscureText: obscurePassword,
                        decoration: InputDecoration(
                          labelText: 'Password',
                          border: const OutlineInputBorder(),
                          prefixIcon: const Icon(Icons.lock_outline),
                          suffixIcon: IconButton(
                            onPressed: () {
                              setState(() {
                                obscurePassword = !obscurePassword;
                              });
                            },
                            icon: Icon(
                              obscurePassword
                                  ? Icons.visibility
                                  : Icons.visibility_off,
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 24),
                      Align(
                        alignment: Alignment.centerLeft,
                        child: Text(
                          'Account type',
                          style: Theme.of(context)
                              .textTheme
                              .titleMedium,
                        ),
                      ),
                      const SizedBox(height: 8),
                      RadioListTile<String>(
                        title: const Text('Customer'),
                        subtitle: const Text(
                          'Find and contact properties',
                        ),
                        value: 'customer',
                        groupValue: role,
                        onChanged: (value) {
                          if (value == null) return;

                          setState(() {
                            role = value;
                          });
                        },
                      ),
                      RadioListTile<String>(
                        title: const Text('Landlord'),
                        subtitle: const Text(
                          'List and manage properties',
                        ),
                        value: 'landlord',
                        groupValue: role,
                        onChanged: (value) {
                          if (value == null) return;

                          setState(() {
                            role = value;
                          });
                        },
                      ),
                      const SizedBox(height: 24),
                      SizedBox(
                        width: double.infinity,
                        height: 50,
                        child: FilledButton(
                          onPressed: loading ? null : register,
                          child: loading
                              ? const SizedBox(
                                  width: 22,
                                  height: 22,
                                  child: CircularProgressIndicator(
                                    strokeWidth: 2,
                                  ),
                                )
                              : const Text('Create Account'),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CustomerDashboard extends StatefulWidget {
            const CustomerDashboard({super.key});

            @override
            State<CustomerDashboard> createState() =>
                _CustomerDashboardState();
          }

          class _CustomerDashboardState
              extends State<CustomerDashboard> {
            final searchController = TextEditingController();

            String propertyType = 'All';
            String furnished = 'All';
            String availability = 'All';

            int minimumBedrooms = 0;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            void showTypeFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  final types = [
                    'All',
                    'Room',
                    '1BHK',
                    '2BHK',
                    'Flat',
                  ];

                  return SafeArea(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: types.map((type) {
                        return RadioListTile<String>(
                          title: Text(type),
                          value: type,
                          groupValue: propertyType,
                          onChanged: (value) {
                            if (value == null) return;

                            setState(() {
                              propertyType = value;
                            });

                            Navigator.pop(context);
                          },
                        );
                      }).toList(),
                    ),
                  );
                },
              );
            }

            void showFurnishedFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  const values = [
                    'All',
                    'Furnished',
                    'Unfurnished',
                  ];

                  return SafeArea(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: values.map((value) {
                        return RadioListTile<String>(
                          title: Text(value),
                          value: value,
                          groupValue: furnished,
                          onChanged: (selected) {
                            if (selected == null) return;

                            setState(() {
                              furnished = selected;
                            });

                            Navigator.pop(context);
                          },
                        );
                      }).toList(),
                    ),
                  );
                },
              );
            }

            void showAvailabilityFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  const values = [
                    'All',
                    'Available',
                    'Unavailable',
                  ];

                  return SafeArea(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: values.map((value) {
                        return RadioListTile<String>(
                          title: Text(value),
                          value: value,
                          groupValue: availability,
                          onChanged: (selected) {
                            if (selected == null) return;

                            setState(() {
                              availability = selected;
                            });

                            Navigator.pop(context);
                          },
                        );
                      }).toList(),
                    ),
                  );
                },
              );
            }

            void showBedroomFilter() {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  final values = [0, 1, 2, 3, 4];

                  return SafeArea(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: values.map((value) {
                        return RadioListTile<int>(
                          title: Text(
                            value == 0
                                ? 'Any bedrooms'
                                : '$value+ bedrooms',
                          ),
                          value: value,
                          groupValue: minimumBedrooms,
                          onChanged: (selected) {
                            if (selected == null) return;

                            setState(() {
                              minimumBedrooms = selected;
                            });

                            Navigator.pop(context);
                          },
                        );
                      }).toList(),
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  actions: [
                    IconButton(
                      tooltip: 'My Inquiries',
                      icon: const Icon(
                        Icons.question_answer_outlined,
                      ),
                      onPressed: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) =>
                                const CustomerInquiriesScreen(),
                          ),
                        );
                      },
                    ),
                    IconButton(
                      tooltip: 'Logout',
                      icon: const Icon(Icons.logout),
                      onPressed: logout,
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.fromLTRB(
                        16,
                        12,
                        16,
                        8,
                      ),
                      child: TextField(
                        controller: searchController,
                        onChanged: (_) {
                          setState(() {});
                        },
                        decoration: InputDecoration(
                          hintText: 'Search location or property...',
                          prefixIcon: const Icon(Icons.search),
                          suffixIcon: searchController.text.isEmpty
                              ? null
                              : IconButton(
                                  onPressed: () {
                                    searchController.clear();
                                    setState(() {});
                                  },
                                  icon: const Icon(Icons.clear),
                                ),
                          border: const OutlineInputBorder(),
                        ),
                      ),
                    ),
                    SizedBox(
                      height: 52,
                      child: ListView(
                        scrollDirection: Axis.horizontal,
                        padding: const EdgeInsets.symmetric(
                          horizontal: 12,
                        ),
                        children: [
                          Padding(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 4,
                            ),
                            child: FilterChip(
                              label: Text(
                                propertyType == 'All'
                                    ? 'Type'
                                    : propertyType,
                              ),
                              selected: propertyType != 'All',
                              onSelected: (_) => showTypeFilter(),
                            ),
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 4,
                            ),
                            child: FilterChip(
                              label: Text(
                                furnished == 'All'
                                    ? 'Furnished'
                                    : furnished,
                              ),
                              selected: furnished != 'All',
                              onSelected: (_) =>
                                  showFurnishedFilter(),
                            ),
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 4,
                            ),
                            child: FilterChip(
                              label: Text(
                                availability == 'All'
                                    ? 'Availability'
                                    : availability,
                              ),
                              selected: availability != 'All',
                              onSelected: (_) =>
                                  showAvailabilityFilter(),
                            ),
                          ),
                          Padding(
                            padding: const EdgeInsets.symmetric(
                              horizontal: 4,
                            ),
                            child: FilterChip(
                              label: Text(
                                minimumBedrooms == 0
                                    ? 'Bedrooms'
                                    : '$minimumBedrooms+ Beds',
                              ),
                              selected: minimumBedrooms > 0,
                              onSelected: (_) =>
                                  showBedroomFilter(),
                            ),
                          ),
                        ],
                      ),
                    ),
                    const Divider(height: 1),
                    Expanded(
                      child: StreamBuilder<
                          QuerySnapshot<Map<String, dynamic>>>(
                        stream: FirebaseFirestore.instance
                            .collection('properties')
                            .orderBy(
                              'createdAt',
                              descending: true,
                            )
                            .snapshots(),
                        builder: (context, snapshot) {
                          if (snapshot.connectionState ==
                              ConnectionState.waiting) {
                            return const Center(
                              child: CircularProgressIndicator(),
                            );
                          }

                          if (snapshot.hasError) {
                            return Center(
                              child: Padding(
                                padding: const EdgeInsets.all(24),
                                child: Text(
                                  'Error loading properties:\n'
                                  '${snapshot.error}',
                                  textAlign: TextAlign.center,
                                ),
                              ),
                            );
                          }

                          final query = searchController.text
                              .trim()
                              .toLowerCase();

                          final docs =
                              snapshot.data?.docs ?? [];

                          final filtered = docs.where((doc) {
                            final data = doc.data();

                            final title =
                                (data['title'] ?? '')
                                    .toString()
                                    .toLowerCase();

                            final location =
                                (data['location'] ?? '')
                                    .toString()
                                    .toLowerCase();

                            final type =
                                (data['propertyType'] ?? '')
                                    .toString();

                            final isFurnished =
                                data['furnished'] == true;

                            final isAvailable =
                                data['available'] != false;

                            final bedrooms =
                                (data['bedrooms'] ?? 0) as num;

                            if (query.isNotEmpty &&
                                !title.contains(query) &&
                                !location.contains(query)) {
                              return false;
                            }

                            if (propertyType != 'All' &&
                                type != propertyType) {
                              return false;
                            }

                            if (furnished == 'Furnished' &&
                                !isFurnished) {
                              return false;
                            }

                            if (furnished == 'Unfurnished' &&
                                isFurnished) {
                              return false;
                            }

                            if (availability == 'Available' &&
                                !isAvailable) {
                              return false;
                            }

                            if (availability == 'Unavailable' &&
                                isAvailable) {
                              return false;
                            }

                            if (bedrooms < minimumBedrooms) {
                              return false;
                            }

                            return true;
                          }).toList();

                          if (filtered.isEmpty) {
                            return const Center(
                              child: Text(
                                'No properties found.',
                                style: TextStyle(
                                  fontSize: 16,
                                ),
                              ),
                            );
                          }

                          return ListView.builder(
                            padding: const EdgeInsets.all(12),
