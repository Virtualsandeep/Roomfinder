                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),

                      const SizedBox(
                          height: 10),

                      Row(
                        children: [
                          const Icon(
                            Icons.location_on,
                            color:
                                Colors.red,
                          ),
                          const SizedBox(
                              width: 6),
                          Expanded(
                            child:
                                Text(
                              location,
                              style:
                                  const TextStyle(
                                fontSize: 16,
                              ),
                            ),
                          ),
                        ],
                      ),

                      const SizedBox(
                          height: 20),

                      Wrap(
                        spacing: 10,
                        runSpacing: 10,
                        children: [
                          _DetailChip(
                            icon:
                                Icons.home_work,
                            label: type,
                          ),
                          _DetailChip(
                            icon: Icons.bed,
                            label:
                                '$bedrooms Bedrooms',
                          ),
                          _DetailChip(
                            icon:
                                Icons.bathtub,
                            label:
                                '$bathrooms Bathrooms',
                          ),
                          _DetailChip(
                            icon:
                                Icons.chair,
                            label: furnished,
                          ),
                        ],
                      ),

                      const SizedBox(
                          height: 25),

                      const Text(
                        'Monthly Rent',
                        style:
                            TextStyle(
                          fontSize: 15,
                          fontWeight:
                              FontWeight.w500,
                        ),
                      ),

                      const SizedBox(
                          height: 5),

                      Text(
                        'Rs. ${rent.toStringAsFixed(0)}',
                        style:
                            const TextStyle(
                          fontSize: 28,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),

                      if (discount > 0)
                        Padding(
                          padding:
                              const EdgeInsets
                                  .only(
                            top: 5,
                          ),
                          child: Text(
                            'Discount: Rs. ${discount.toStringAsFixed(0)}\nFinal rent: Rs. ${finalRent.toStringAsFixed(0)}',
                            style:
                                const TextStyle(
                              color:
                                  Colors.green,
                              fontSize: 16,
                              fontWeight:
                                  FontWeight.w600,
