name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      - name: Configure Android application ID
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'applicationId = "com.example.kothafinder_nepal"',
              'applicationId = "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId "com.example.kothafinder_nepal"',
              'applicationId "com.kothafinder.nepal"'
          )

          path.write_text(text)

          print("Application ID configured.")
          PY

      - name: Configure minimum Android SDK
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23'
          )

          text = text.replace(
              'minSdkVersion flutter.minSdkVersion',
              'minSdkVersion 23'
          )

          text = text.replace(
              'minSdkVersion 21',
              'minSdkVersion 23'
          )

          path.write_text(text)

          print("Minimum Android SDK configured to 23.")
          PY

      - name: Verify Android configuration
        working-directory: build_app
        run: |
          echo "Checking Android configuration..."

          echo "Application ID:"
          grep -n "applicationId" android/app/build.gradle || true

          echo "Minimum SDK:"
          grep -n "minSdk" android/app/build.gradle || true

          if grep -q 'com.kothafinder.nepal' android/app/build.gradle; then
            echo "Application ID is correct."
          else
            echo "ERROR: Application ID is incorrect."
            exit 1
          fi

          if grep -q 'minSdk = 23' android/app/build.gradle; then
            echo "Minimum SDK is 23."
          elif grep -q 'minSdkVersion 23' android/app/build.gradle; then
            echo "Minimum SDK is 23."
          else
            echo "ERROR: Minimum SDK is not 23."
            exit 1
          fi

      - name: Copy Firebase configuration
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json was not found."
            exit 1
          fi

          cp google-services.json \
            build_app/android/app/google-services.json

          echo "Firebase configuration copied."

      - name: Verify Firebase package
        run: |
          echo "Checking Firebase package..."

          if grep -q '"package_name": "com.kothafinder.nepal"' google-services.json; then
            echo "Firebase package matches com.kothafinder.nepal."
          else
            echo "ERROR: Firebase package does not match."
            exit 1
          fi

      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Configure Google Services
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          settings_text = settings.read_text()
          app_text = app.read_text()

          plugin = "com.google.gms.google-services"

          if plugin not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services' version '4.4.2' apply false""",
                  1
              )

          if plugin not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services'""",
                  1
              )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("Google Services configured.")
          PY

      - name: Create KothaFinder app
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (!snapshot.hasData) {
                    return const LoginScreen();
                  }

                  return const RoleLoadingScreen();
                },
              );
            }
          }

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          class RoleLoadingScreen extends StatelessWidget {
            const RoleLoadingScreen({super.key});

            Future<String?> getRole() async {
              final user = FirebaseAuth.instance.currentUser;

              if (user == null) {
                return null;
              }

              final document = await FirebaseFirestore.instance
                  .collection('users')
                  .doc(user.uid)
                  .get();

              if (!document.exists) {
                return null;
              }

              final data = document.data();

              return data?['role'] as String?;
            }

            @override
            Widget build(BuildContext context) {
              return FutureBuilder<String?>(
                future: getRole(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState ==
                      ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  if (snapshot.data == 'landlord') {
                    return const LandlordDashboard();
                  }

                  if (snapshot.data == 'customer') {
                    return const CustomerDashboard();
                  }

                  return const LoginScreen();
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            String errorMessage = '';

            Future<void> login() async {
              if (emailController.text.trim().isEmpty ||
                  passwordController.text.isEmpty) {
                setState(() {
                  errorMessage = 'Please enter email and password.';
                });
                return;
              }

              setState(() {
                loading = true;
                errorMessage = '';
              });

              try {
                await FirebaseAuth.instance.signInWithEmailAndPassword(
                  email: emailController.text.trim(),
                  password: passwordController.text,
                );
              } on FirebaseAuthException catch (e) {
                setState(() {
                  errorMessage = firebaseError(e.code);
                });
              } catch (_) {
                setState(() {
                  errorMessage = 'Login failed.';
                });
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            String firebaseError(String code) {
              switch (code) {
                case 'user-not-found':
                  return 'No account found with this email.';
                case 'wrong-password':
                case 'invalid-credential':
                  return 'Incorrect email or password.';
                case 'invalid-email':
                  return 'Invalid email address.';
                case 'too-many-requests':
                  return 'Too many attempts. Try again later.';
                default:
                  return 'Login failed. Please try again.';
              }
            }

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        children: [
                          const Icon(
                            Icons.home_work,
                            size: 80,
                          ),
                          const SizedBox(height: 20),
                          const Text(
                            'KothaFinder Nepal',
                            style: TextStyle(
                              fontSize: 30,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text('Login to continue'),
                          const SizedBox(height: 30),
                          TextField(
                            controller: emailController,
                            keyboardType:
                                TextInputType.emailAddress,
                            decoration: const InputDecoration(
                              labelText: 'Email',
                              prefixIcon: Icon(Icons.email),
                              border: OutlineInputBorder(),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: passwordController,
                            obscureText: true,
                            decoration: const InputDecoration(
                              labelText: 'Password',
                              prefixIcon: Icon(Icons.lock),
                              border: OutlineInputBorder(),
                            ),
                          ),
                          if (errorMessage.isNotEmpty)
                            Padding(
                              padding:
                                  const EdgeInsets.only(top: 12),
                              child: Text(
                                errorMessage,
                                style: const TextStyle(
                                  color: Colors.red,
                                ),
                              ),
                            ),
                          const SizedBox(height: 24),
                          SizedBox(
                            width: double.infinity,
                            height: 52,
                            child: ElevatedButton(
                              onPressed: loading ? null : login,
                              child: loading
                                  ? const SizedBox(
                                      width: 22,
                                      height: 22,
                                      child:
                                          CircularProgressIndicator(),
                                    )
                                  : const Text('Login'),
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextButton(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) =>
                                      const RegisterScreen(),
                                ),
                              );
                            },
                            child: const Text(
                              'Create a new account',
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() =>
                _RegisterScreenState();
          }

          class _RegisterScreenState
              extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;
            String errorMessage = '';

            Future<void> register() async {
              if (nameController.text.trim().isEmpty) {
                setState(() {
                  errorMessage = 'Please enter your name.';
                });
                return;
              }

              if (emailController.text.trim().isEmpty) {
                setState(() {
                  errorMessage = 'Please enter your email.';
                });
                return;
              }

              if (passwordController.text.length < 6) {
                setState(() {
                  errorMessage =
                      'Password must contain at least 6 characters.';
                });
                return;
              }

              setState(() {
                loading = true;
                errorMessage = '';
              });

              try {
                final credential = await FirebaseAuth.instance
                    .createUserWithEmailAndPassword(
                  email: emailController.text.trim(),
                  password: passwordController.text,
                );

                final user = credential.user;

                if (user == null) {
                  throw Exception('User creation failed.');
                }

                await FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .set({
                  'uid': user.uid,
                  'name': nameController.text.trim(),
                  'email': emailController.text.trim(),
                  'role': role,
                  'createdAt': FieldValue.serverTimestamp(),
                });
              } on FirebaseAuthException catch (e) {
                setState(() {
                  errorMessage = firebaseError(e.code);
                });
              } catch (_) {
                setState(() {
                  errorMessage =
                      'Account creation failed.';
                });
              } finally {
                if (mounted) {
                  setState(() {
                    loading = false;
                  });
                }
              }
            }

            String firebaseError(String code) {
              switch (code) {
                case 'email-already-in-use':
                  return 'This email is already registered.';
                case 'invalid-email':
                  return 'Invalid email address.';
                case 'weak-password':
                  return 'Password is too weak.';
                default:
                  return 'Registration failed. Please try again.';
              }
            }

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      TextField(
                        controller: nameController,
                        decoration: const InputDecoration(
                          labelText: 'Full Name',
                          prefixIcon: Icon(Icons.person),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: emailController,
                        keyboardType:
                            TextInputType.emailAddress,
                        decoration: const InputDecoration(
                          labelText: 'Email',
                          prefixIcon: Icon(Icons.email),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: passwordController,
                        obscureText: true,
                        decoration: const InputDecoration(
                          labelText: 'Password',
                          prefixIcon: Icon(Icons.lock),
                          border: OutlineInputBorder(),
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Align(
                        alignment: Alignment.centerLeft,
                        child: Text(
                          'I am a:',
                          style: TextStyle(
                            fontSize: 17,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      RadioListTile<String>(
                        title: const Text('Customer'),
                        value: 'customer',
                        groupValue: role,
                        onChanged: (value) {
                          setState(() {
                            role = value!;
                          });
                        },
                      ),
                      RadioListTile<String>(
                        title: const Text('Landlord'),
                        value: 'landlord',
                        groupValue: role,
                        onChanged: (value) {
                          setState(() {
                            role = value!;
                          });
                        },
                      ),
                      if (errorMessage.isNotEmpty)
                        Padding(
                          padding:
                              const EdgeInsets.only(bottom: 15),
                          child: Text(
                            errorMessage,
                            style: const TextStyle(
                              color: Colors.red,
                            ),
                          ),
                        ),
                      SizedBox(
                        width: double.infinity,
                        height: 52,
                        child: ElevatedButton(
                          onPressed:
                              loading ? null : register,
                          child: loading
                              ? const SizedBox(
                                  width: 22,
                                  height: 22,
                                  child:
                                      CircularProgressIndicator(),
                                )
                              : const Text(
                                  'Create Account',
                                ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CustomerDashboard extends StatelessWidget {
            const CustomerDashboard({super.key});

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder'),
                  actions: [
                    IconButton(
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('properties')
                      .where('available', isEqualTo: true)
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(20),
                          child: Text(
                            'Unable to load properties.\n\n${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final properties = snapshot.data?.docs ?? [];

                    return ListView(
                      padding: const EdgeInsets.all(20),
                      children: [
                        const Text(
                          'Find Your New Home',
                          style: TextStyle(
                            fontSize: 28,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'Rooms, flats and apartments across Nepal.',
                        ),
                        const SizedBox(height: 25),
                        TextField(
                          decoration: InputDecoration(
                            hintText: 'Search location...',
                            prefixIcon:
                                const Icon(Icons.search),
                            border: OutlineInputBorder(
                              borderRadius:
                                  BorderRadius.circular(15),
                            ),
                          ),
                        ),
                        const SizedBox(height: 25),
                        if (properties.isEmpty)
                          const Card(
                            child: Padding(
                              padding: EdgeInsets.all(25),
                              child: Column(
                                children: [
                                  Icon(
                                    Icons.home_work_outlined,
                                    size: 55,
                                  ),
                                  SizedBox(height: 12),
                                  Text(
                                    'No properties available yet.',
                                    style: TextStyle(
                                      fontSize: 18,
                                      fontWeight:
                                          FontWeight.bold,
                                    ),
                                  ),
                                  SizedBox(height: 5),
                                  Text(
                                    'New listings will appear here.',
                                    textAlign: TextAlign.center,
                                  ),
                                ],
                              ),
                            ),
                          )
                        else
                          ...properties.map(
                            (document) {
                              final data = document.data();

                              return PropertyCard(
                                data: data,
                              );
                            },
                          ),
                      ],
                    );
                  },
                ),
              );
            }
          }

          class LandlordDashboard extends StatelessWidget {
            const LandlordDashboard({super.key});

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            Widget build(BuildContext context) {
              final user = FirebaseAuth.instance.currentUser;

              return Scaffold(
                appBar: AppBar(
                  title:
                      const Text('Landlord Dashboard'),
                  actions: [
                    IconButton(
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                  stream: FirebaseFirestore.instance
                      .collection('properties')
                      .where(
                        'landlordId',
                        isEqualTo: user?.uid,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    final properties =
                        snapshot.data?.docs ?? [];

                    return ListView(
                      padding: const EdgeInsets.all(20),
                      children: [
                        const Text(
                          'Landlord Dashboard',
                          style: TextStyle(
                            fontSize: 28,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'Manage your properties.',
                        ),
                        const SizedBox(height: 25),
                        SizedBox(
                          width: double.infinity,
                          height: 55,
                          child: ElevatedButton.icon(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) =>
                                      const AddPropertyScreen(),
                                ),
                              );
                            },
                            icon:
                                const Icon(Icons.add_home),
                            label: const Text(
                              'Add New Property',
                            ),
                          ),
                        ),
                        const SizedBox(height: 30),
                        const Text(
                          'My Properties',
                          style: TextStyle(
                            fontSize: 22,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 15),
                        if (properties.isEmpty)
                          const Card(
                            child: Padding(
                              padding: EdgeInsets.all(20),
                              child: Text(
                                'You have not added any properties yet.',
                                textAlign: TextAlign.center,
                              ),
                            ),
                          )
                        else
                          ...properties.map(
                            (document) {
                              final data = document.data();

                              return LandlordPropertyCard(
                                documentId: document.id,
                                data: data,
                              );
                            },
                          ),
                      ],
                    );
                  },
                ),
              );
            }
          }

          class AddPropertyScreen extends StatefulWidget {
            const AddPropertyScreen({super.key});

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            final titleController = TextEditingController();
            final locationController = TextEditingController();
            final rentController = TextEditingController();
            final discountController = TextEditingController();
            final bedroomsController = TextEditingController();
            final bathroomsController = TextEditingController();
            final descriptionController = TextEditingController();

            String propertyType = 'Room';
            String furnishedStatus = 'Unfurnished';
            bool available = true;
            bool saving = false;
            String errorMessage = '';

            Future<void> saveProperty() async {
              if (titleController.text.trim().isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter a property title.';
                });
                return;
              }

              if (locationController.text.trim().isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the location.';
                });
                return;
              }

              if (rentController.text.trim().isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the monthly rent.';
                });
                return;
              }

              if (bedroomsController.text.trim().isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the number of bedrooms.';
                });
                return;
              }

              if (bathroomsController.text.trim().isEmpty) {
                setState(() {
                  errorMessage =
                      'Please enter the number of bathrooms.';
                });
                return;
              }

              final rent =
                  double.tryParse(rentController.text.trim());

              if (rent == null || rent < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid rent amount.';
                });
                return;
              }

              final discountText =
                  discountController.text.trim();

              final discount = discountText.isEmpty
                  ? 0.0
                  : double.tryParse(discountText);

              if (discount == null || discount < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid discount.';
                });
                return;
              }

              final bedrooms =
                  int.tryParse(
                    bedroomsController.text.trim(),
                  );

              final bathrooms =
                  int.tryParse(
                    bathroomsController.text.trim(),
                  );

              if (bedrooms == null || bedrooms < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid number of bedrooms.';
                });
                return;
              }

              if (bathrooms == null || bathrooms < 0) {
                setState(() {
                  errorMessage =
                      'Please enter a valid number of bathrooms.';
                });
                return;
              }

              final user =
                  FirebaseAuth.instance.currentUser;

              if (user == null) {
                setState(() {
                  errorMessage =
                      'You must be logged in.';
                });
                return;
              }

              setState(() {
                saving = true;
                errorMessage = '';
              });

              try {
                await FirebaseFirestore.instance
                    .collection('properties')
                    .add({
                  'landlordId': user.uid,
                  'title':
                      titleController.text.trim(),
                  'propertyType': propertyType,
                  'location':
                      locationController.text.trim(),
                  'rent': rent,
                  'discount': discount,
                  'bedrooms': bedrooms,
                  'bathrooms': bathrooms,
                  'description':
                      descriptionController.text.trim(),
                  'furnished':
                      furnishedStatus,
                  'available': available,
                  'createdAt':
                      FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content:
                        Text('Property added successfully.'),
                  ),
                );

                Navigator.pop(context);
              } catch (e) {
                setState(() {
                  errorMessage =
