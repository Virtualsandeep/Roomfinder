name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name kothafinder_nepal --platforms=android build_app

      - name: Copy project files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml

          mkdir -p build_app/lib

          if [ -f firebase_options.dart ]; then
            cp firebase_options.dart build_app/lib/firebase_options.dart
          fi

          if [ -f main.dart ]; then
            cp main.dart build_app/lib/main.dart
          else
            printf '%s\n' "import 'package:flutter/material.dart'; void main() => runApp(const KothaFinderApp()); class KothaFinderApp extends StatelessWidget { const KothaFinderApp({super.key}); @override Widget build(BuildContext context) { return MaterialApp(debugShowCheckedModeBanner: false, title: 'KothaFinder Nepal', home: Scaffold(appBar: AppBar(title: const Text('KothaFinder Nepal')), body: const Center(child: Text('Find your room in Nepal')))); } }" > build_app/lib/main.dart
          fi

          if [ -f app_services.dart ]; then
            mkdir -p build_app/lib/services
            cp app_services.dart build_app/lib/services/app_services.dart
          fi

          if [ -f auth.dart ]; then
            mkdir -p build_app/lib/screens
            cp auth.dart build_app/lib/screens/auth.dart
          fi

          if [ -f customer.dart ]; then
            mkdir -p build_app/lib/screens
            cp customer.dart build_app/lib/screens/customer.dart
          fi

          if [ -f landlord.dart ]; then
            mkdir -p build_app/lib/screens
            cp landlord.dart build_app/lib/screens/landlord.dart
          fi

          if [ -f chat.dart ]; then
            mkdir -p build_app/lib/screens
            cp chat.dart build_app/lib/screens/chat.dart
          fi

          if [ -f map_search.dart ]; then
            mkdir -p build_app/lib/screens
            cp map_search.dart build_app/lib/screens/map_search.dart
          fi

          if [ -f post_room.dart ]; then
            mkdir -p build_app/lib/screens
            cp post_room.dart build_app/lib/screens/post_room.dart
          fi

          if [ -f room_detail.dart ]; then
            mkdir -p build_app/lib/screens
            cp room_detail.dart build_app/lib/screens/room_detail.dart
          fi

          if [ -f room.dart ]; then
            mkdir -p build_app/lib/models
            cp room.dart build_app/lib/models/room.dart
          fi

      - name: Get Flutter packages
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
