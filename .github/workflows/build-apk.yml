          DART

      # ============================================================
      # 12. REMOVE DEFAULT TESTS
      # ============================================================
      - name: Remove default tests
        run: |
          rm -rf build_app/test

      # ============================================================
      # 13. GET DEPENDENCIES
      # ============================================================
      - name: Get Flutter dependencies
        working-directory: build_app
        run: |
          flutter pub get

      # ============================================================
      # 14. ANALYZE
      # ============================================================
      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze --no-fatal-infos

      # ============================================================
      # 15. BUILD APK
      # ============================================================
      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          test -f build_app/build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build_app/build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
