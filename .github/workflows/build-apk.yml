          class PropertyDetailsScreen extends StatelessWidget {
            final QueryDocumentSnapshot<Map<String, dynamic>> doc;

            const PropertyDetailsScreen({
              super.key,
              required this.doc,
            });

            Future<void> contactLandlord(
              BuildContext context,
            ) async {
              final data = doc.data();

              final landlordId =
                  (data['landlordId'] ?? '').toString();

              if (landlordId.isEmpty) {
                showMessage(
                  context,
                  'Landlord information is unavailable.',
                );
                return;
              }

              final customer = auth.currentUser;

              if (customer == null) {
                showMessage(
                  context,
                  'Please login first.',
                );
                return;
              }

              final customerDoc = await db
                  .collection('users')
                  .doc(customer.uid)
                  .get();

              final landlordDoc = await db
                  .collection('users')
                  .doc(landlordId)
                  .get();

              if (!context.mounted) return;

              final customerData = customerDoc.data() ?? {};
              final landlordData = landlordDoc.data() ?? {};

              final messageController =
                  TextEditingController();

              final sent = await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text('Contact Landlord'),
                    content: SingleChildScrollView(
                      child: Column(
                        crossAxisAlignment:
                            CrossAxisAlignment.start,
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text(
                            'Landlord: '
                            '${landlordData['name'] ?? 'Landlord'}',
                          ),
                          const SizedBox(height: 4),
                          Text(
                            'Email: '
                            '${landlordData['email'] ?? ''}',
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: messageController,
                            minLines: 4,
                            maxLines: 6,
                            maxLength: 1000,
                            decoration: const InputDecoration(
                              labelText: 'Your message',
                              hintText:
                                  'I am interested in this property...',
                              alignLabelWithHint: true,
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(dialogContext, false);
                        },
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () async {
                          final message =
                              messageController.text.trim();

                          if (message.isEmpty) {
                            showMessage(
                              dialogContext,
                              'Please enter a message.',
                            );
                            return;
                          }

                          try {
                            await db
                                .collection('inquiries')
                                .add({
                              'customerId': customer.uid,
                              'customerName':
                                  customerData['name'] ??
                                      customer.displayName ??
                                      'Customer',
                              'customerEmail':
                                  customerData['email'] ??
                                      customer.email ??
                                      '',
                              'landlordId': landlordId,
                              'landlordName':
                                  landlordData['name'] ??
                                      'Landlord',
                              'landlordEmail':
                                  landlordData['email'] ?? '',
                              'propertyId': doc.id,
                              'propertyTitle':
                                  data['title'] ?? 'Property',
                              'message': message,
                              'status': 'new',
                              'isRead': false,
                              'createdAt':
                                  FieldValue.serverTimestamp(),
                            });

                            if (dialogContext.mounted) {
                              Navigator.pop(
                                dialogContext,
                                true,
                              );
                            }
                          } catch (e) {
                            if (dialogContext.mounted) {
                              showMessage(
                                dialogContext,
                                'Could not send inquiry: $e',
                              );
                            }
                          }
                        },
                        child: const Text('Send Inquiry'),
                      ),
                    ],
                  );
                },
              );

              messageController.dispose();

              if (sent == true && context.mounted) {
                showMessage(
                  context,
                  'Inquiry sent successfully.',
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final data = doc.data();

              final title =
                  (data['title'] ?? 'Property').toString();
              final location =
                  (data['location'] ?? '').toString();
              final type =
                  (data['propertyType'] ?? 'Room').toString();
              final furnished =
                  (data['furnished'] ?? 'Unfurnished')
                      .toString();
              final rent =
                  (data['monthlyRent'] ?? 0).toString();
              final discount =
                  (data['discount'] ?? 0).toString();
