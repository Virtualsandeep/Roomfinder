          class LandlordPropertyCard extends StatelessWidget {
            final QueryDocumentSnapshot<Map<String, dynamic>> doc;

            const LandlordPropertyCard({
              super.key,
              required this.doc,
            });

            Future<void> deleteProperty(
              BuildContext context,
            ) async {
              final confirmed = await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text('Delete Property'),
                    content: const Text(
                      'Are you sure you want to delete this property?',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(dialogContext, false);
                        },
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(dialogContext, true);
                        },
                        child: const Text('Delete'),
                      ),
                    ],
                  );
                },
              );

              if (confirmed != true) return;

              try {
                await db
                    .collection('properties')
                    .doc(doc.id)
                    .delete();

                if (context.mounted) {
                  showMessage(
                    context,
                    'Property deleted.',
                  );
                }
              } catch (e) {
                if (context.mounted) {
                  showMessage(
                    context,
                    'Could not delete property: $e',
                  );
                }
              }
            }

            Future<void> toggleAvailability(
              BuildContext context,
            ) async {
              final current =
                  doc.data()['available'] == true;

              try {
                await db
                    .collection('properties')
                    .doc(doc.id)
                    .update({
                  'available': !current,
                });
              } catch (e) {
                if (context.mounted) {
                  showMessage(
                    context,
                    'Could not update availability: $e',
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final data = doc.data();

              final title =
                  (data['title'] ?? 'Property').toString();
              final location =
                  (data['location'] ?? '').toString();
              final rent =
                  (data['monthlyRent'] ?? 0).toString();
              final available =
                  data['available'] == true;

              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              title,
                              style: const TextStyle(
                                fontSize: 18,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                          _StatusChip(
                            label: available
                                ? 'Available'
                                : 'Unavailable',
                            positive: available,
                          ),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Text(location),
                      const SizedBox(height: 6),
                      Text(
                        'Rs. $rent / month',
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Wrap(
                        spacing: 8,
                        children: [
                          OutlinedButton.icon(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (_) =>
                                      AddPropertyScreen(
                                    existing: doc,
                                  ),
                                ),
                              );
                            },
                            icon: const Icon(Icons.edit),
                            label: const Text('Edit'),
                          ),
                          OutlinedButton.icon(
                            onPressed: () {
                              toggleAvailability(context);
                            },
                            icon: Icon(
                              available
                                  ? Icons.visibility_off
                                  : Icons.visibility,
                            ),
                            label: Text(
                              available
                                  ? 'Hide'
                                  : 'Show',
                            ),
                          ),
                          OutlinedButton.icon(
                            onPressed: () {
                              deleteProperty(context);
                            },
                            icon: const Icon(
                              Icons.delete_outline,
                            ),
                            label: const Text('Delete'),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class LandlordInquiriesScreen extends StatelessWidget {
            const LandlordInquiriesScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final landlordId = auth.currentUser?.uid;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Inquiries'),
                ),
                body: StreamBuilder<
                    QuerySnapshot<Map<String, dynamic>>>(
                  stream: db
                      .collection('inquiries')
                      .where(
                        'landlordId',
                        isEqualTo: landlordId,
                      )
                      .snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState ==
                        ConnectionState.waiting) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    if (snapshot.hasError) {
                      return Center(
                        child: Padding(
                          padding: const EdgeInsets.all(24),
                          child: Text(
                            'Could not load inquiries.\n\n'
                            '${snapshot.error}',
                            textAlign: TextAlign.center,
                          ),
                        ),
                      );
                    }

                    final docs = [
                      ...(snapshot.data?.docs ?? []),
                    ];

                    docs.sort((a, b) {
                      final aTime = a.data()['createdAt'];
                      final bTime = b.data()['createdAt'];

                      if (aTime is Timestamp &&
                          bTime is Timestamp) {
                        return bTime.compareTo(aTime);
                      }

                      return 0;
                    });

                    if (docs.isEmpty) {
                      return const Center(
                        child: Text(
                          'No inquiries yet.',
                        ),
                      );
                    }

                    return ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: docs.length,
                      itemBuilder: (context, index) {
                        return InquiryCard(
                          doc: docs[index],
                          landlordView: true,
                        );
                      },
                    );
                  },
                ),
              );
            }
          }

