              BuildContext context,
            ) async {
              try {
                await db
                    .collection('properties')
                    .doc(propertyId)
                    .update({
                  'available':
                      !(data['available'] != false),
                  'updatedAt':
                      FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (context.mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(
                    SnackBar(
                      content: Text(
                        'Could not update property: $e',
                      ),
                    ),
                  );
                }
              }
            }

