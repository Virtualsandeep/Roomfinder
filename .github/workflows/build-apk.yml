name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name kothafinder_nepal --platforms=android build_app

      - name: Copy Flutter files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml

          mkdir -p build_app/lib

          if [ -f firebase_options.dart ]; then
            cp firebase_options.dart build_app/lib/firebase_options.dart
          fi

          if [ -f main.dart ]; then
            cp main.dart build_app/lib/main.dart
          else
            cat > build_app/lib/main.dart <<'EOF'
            import 'package:flutter/material.dart';

            void main() {
              runApp(const KothaFinderApp());
            }

            class KothaFinderApp extends StatelessWidget {
              const KothaFinderApp({super.key});

              @override
              Widget build(BuildContext context) {
                return MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'KothaFinder Nepal',
                  theme: ThemeData(
                    colorScheme: ColorScheme.fromSeed(
                      seedColor: Colors.blue,
                    ),
                    useMaterial3: true,
                  ),
                  home: const HomeScreen(),
                );
              }
            }

            class HomeScreen extends StatelessWidget {
              const HomeScreen({super.key});

              @override
              Widget build(BuildContext context) {
                return Scaffold(
                  appBar: AppBar(
                    title: const Text('KothaFinder Nepal'),
                  ),
                  body: ListView(
                    padding: const EdgeInsets.all(20),
                    children: [
                      const Text(
                        'Find your room in Nepal',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 20),

                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.search),
                          title: const Text('Find a Room'),
                          subtitle: const Text(
                            'Search rooms by location and rent',
                          ),
                          onTap: () {},
                        ),
                      ),

                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.home_work),
                          title: const Text('I am a Landlord'),
                          subtitle: const Text(
                            'Post your room for customers',
                          ),
                          onTap: () {},
                        ),
                      ),

                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.map),
                          title: const Text('Map Search'),
                          subtitle: const Text(
                            'Find rooms near you',
                          ),
                          onTap: () {},
                        ),
                      ),

                      Card(
                        child: ListTile(
                          leading: const Icon(Icons.favorite),
                          title: const Text('Saved Rooms'),
                          subtitle: const Text(
                            'View your favourite listings',
                          ),
                          onTap: () {},
                        ),
                      ),
                    ],
                  ),
                );
              }
            }
            EOF
          fi

      - name: Force compileSdk/targetSdk to 35
        working-directory: build_app
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi

          echo "Patching $GRADLE_FILE"

          # Kotlin DSL style
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$GRADLE_FILE" || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$GRADLE_FILE" || true

          # Groovy DSL style
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' "$GRADLE_FILE" || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' "$GRADLE_FILE" || true

          echo "----- Resulting android {} block -----"
          grep -A 15 "^android" "$GRADLE_FILE" || cat "$GRADLE_FILE"

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
