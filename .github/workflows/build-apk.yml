name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Flutter
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # 3. Create Flutter project
      # ---------------------------------------------------------
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      # ---------------------------------------------------------
      # 4. Configure Android application ID
      # ---------------------------------------------------------
      - name: Configure Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle was not found")

          text = path.read_text()

          text = text.replace(
              'applicationId = "com.example.kothafinder_nepal"',
              'applicationId = "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId "com.example.kothafinder_nepal"',
              'applicationId "com.kothafinder.nepal"'
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # 5. Configure minimum SDK
      # ---------------------------------------------------------
      - name: Configure minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")

          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # 6. Verify Android configuration
      # ---------------------------------------------------------
      - name: Verify Android configuration
        run: |
          echo "Checking application ID..."
          grep -n "applicationId" build_app/android/app/build.gradle || true

          echo "Checking minimum SDK..."
          grep -n "minSdk" build_app/android/app/build.gradle || true

      # ---------------------------------------------------------
      # 7. Copy Firebase configuration
      # ---------------------------------------------------------
      - name: Copy Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json was not found in repository root."
            exit 1
          fi

          mkdir -p build_app/android/app
          cp google-services.json build_app/android/app/google-services.json

      # ---------------------------------------------------------
      # 8. Verify Firebase package
      # ---------------------------------------------------------
      - name: Verify Firebase package
        run: |
          python3 - <<'PY'
          import json

          with open("build_app/android/app/google-services.json", "r") as f:
              data = json.load(f)

          package_name = (
              data["client"][0]["client_info"]["android_client_info"]["package_name"]
          )

          print("Firebase Android package:", package_name)

          if package_name != "com.kothafinder.nepal":
              raise SystemExit(
                  "ERROR: Firebase package must be com.kothafinder.nepal"
              )
          PY

      # ---------------------------------------------------------
      # 9. Add Firebase packages
      # ---------------------------------------------------------
      - name: Add Firebase packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      # ---------------------------------------------------------
      # 10. Configure Google Services Gradle plugin
      # ---------------------------------------------------------
      - name: Configure Google Services plugin
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle
          settings = Path("android/settings.gradle")
          text = settings.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id "com.google.gms.google-services" version "4.4.2" apply false"""
              )

          settings.write_text(text)

          # app/build.gradle
          app = Path("android/app/build.gradle")
          text = app.read_text()

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  "plugins {",
                  """plugins {
              id "com.google.gms.google-services" """
              )

          app.write_text(text)
          PY

      # ---------------------------------------------------------
      # 11. Create application
      # ---------------------------------------------------------
      - name: Create main.dart
        run: |
          mkdir -p build_app/lib

          cat > build_app/lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.indigo,
                  scaffoldBackgroundColor: const Color(0xfff7f8fc),
                  inputDecorationTheme: const InputDecorationTheme(
                    border: OutlineInputBorder(),
                  ),
                ),
                home: const AuthGate(),
              );
            }
          }

          // =====================================================
          // AUTH GATE
          // =====================================================

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(),
                      ),
                    );
                  }

                  if (!snapshot.hasData) {
                    return const LoginScreen();
                  }

                  return const RoleLoadingScreen();
                },
              );
            }
          }

          class RoleLoadingScreen extends StatelessWidget {
            const RoleLoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final user = FirebaseAuth.instance.currentUser;

              if (user == null) {
                return const LoginScreen();
              }

              return FutureBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                future: FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .get(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(),
                      ),
                    );
                  }

                  if (!snapshot.hasData || !snapshot.data!.exists) {
                    return const LoginScreen();
                  }

                  final data = snapshot.data!.data() ?? {};
                  final role = data['role'];

                  if (role == 'landlord') {
                    return const LandlordDashboard();
                  }

                  return const CustomerDashboard();
                },
              );
            }
          }

          // =====================================================
          // LOGIN
          // =====================================================

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;

            Future<void> login() async {
              final email = emailController.text.trim();
              final password = passwordController.text.trim();

              if (email.isEmpty || password.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Please enter email and password.'),
                  ),
                );
                return;
              }

              setState(() => loading = true);

              try {
                await FirebaseAuth.instance.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(e.message ?? 'Login failed.'),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(maxWidth: 500),
                        child: Column(
                          children: [
                            const Icon(
                              Icons.home_work_rounded,
                              size: 70,
                              color: Colors.indigo,
                            ),
                            const SizedBox(height: 16),
                            const Text(
                              'KothaFinder Nepal',
                              style: TextStyle(
                                fontSize: 28,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            const Text(
                              'Find rooms and properties in Nepal',
                              textAlign: TextAlign.center,
                            ),
                            const SizedBox(height: 32),
                            TextField(
                              controller: emailController,
                              keyboardType: TextInputType.emailAddress,
                              decoration: const InputDecoration(
                                labelText: 'Email',
                                prefixIcon: Icon(Icons.email_outlined),
                              ),
                            ),
                            const SizedBox(height: 16),
                            TextField(
                              controller: passwordController,
                              obscureText: true,
                              decoration: const InputDecoration(
                                labelText: 'Password',
                                prefixIcon: Icon(Icons.lock_outline),
                              ),
                            ),
                            const SizedBox(height: 24),
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: FilledButton(
                                onPressed: loading ? null : login,
                                child: loading
                                    ? const CircularProgressIndicator()
                                    : const Text('Login'),
                              ),
                            ),
                            const SizedBox(height: 16),
                            TextButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const RegisterScreen(),
                                  ),
                                );
                              },
                              child: const Text(
                                'Create a new account',
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // =====================================================
          // REGISTER
          // =====================================================

          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});

            @override
            State<RegisterScreen> createState() => _RegisterScreenState();
          }

          class _RegisterScreenState extends State<RegisterScreen> {
            final nameController = TextEditingController();
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            String role = 'customer';
            bool loading = false;

            Future<void> register() async {
              final name = nameController.text.trim();
              final email = emailController.text.trim();
              final password = passwordController.text.trim();

              if (name.isEmpty ||
                  email.isEmpty ||
                  password.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Please complete all fields.'),
                  ),
                );
                return;
              }

              if (password.length < 6) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Password must contain at least 6 characters.',
                    ),
                  ),
                );
                return;
              }

              setState(() => loading = true);

              try {
                final credential = await FirebaseAuth.instance
                    .createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user != null) {
                  await FirebaseFirestore.instance
                      .collection('users')
                      .doc(user.uid)
                      .set({
                    'uid': user.uid,
                    'name': name,
                    'email': email,
                    'role': role,
                    'createdAt': FieldValue.serverTimestamp(),
                  });
                }
              } on FirebaseAuthException catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(e.message ?? 'Registration failed.'),
                  ),
                );
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            @override
            void dispose() {
              nameController.dispose();
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Create Account'),
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      children: [
                        TextField(
                          controller: nameController,
                          decoration: const InputDecoration(
                            labelText: 'Full name',
                            prefixIcon: Icon(Icons.person_outline),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller: emailController,
                          keyboardType: TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            labelText: 'Email',
                            prefixIcon: Icon(Icons.email_outlined),
                          ),
                        ),
                        const SizedBox(height: 16),
                        TextField(
                          controller: passwordController,
                          obscureText: true,
                          decoration: const InputDecoration(
                            labelText: 'Password',
                            prefixIcon: Icon(Icons.lock_outline),
                          ),
                        ),
                        const SizedBox(height: 20),
                        Align(
                          alignment: Alignment.centerLeft,
                          child: Text(
                            'Account type',
                            style: Theme.of(context)
                                .textTheme
                                .titleMedium,
                          ),
                        ),
                        const SizedBox(height: 8),
                        SegmentedButton<String>(
                          segments: const [
                            ButtonSegment(
                              value: 'customer',
                              label: Text('Customer'),
                              icon: Icon(Icons.person),
                            ),
                            ButtonSegment(
                              value: 'landlord',
                              label: Text('Landlord'),
                              icon: Icon(Icons.home_work),
                            ),
                          ],
                          selected: {role},
                          onSelectionChanged: (value) {
                            setState(() {
                              role = value.first;
                            });
                          },
                        ),
                        const SizedBox(height: 28),
                        SizedBox(
                          width: double.infinity,
                          height: 52,
                          child: FilledButton(
                            onPressed: loading ? null : register,
                            child: loading
                                ? const CircularProgressIndicator()
                                : const Text('Create Account'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // =====================================================
          // CUSTOMER DASHBOARD
          // =====================================================

          class CustomerDashboard extends StatefulWidget {
            const CustomerDashboard({super.key});

            @override
            State<CustomerDashboard> createState() =>
                _CustomerDashboardState();
          }

          class _CustomerDashboardState
              extends State<CustomerDashboard> {
            final searchController = TextEditingController();

            String propertyType = 'All';
            String furnished = 'All';
            String available = 'All';
            int minimumBedrooms = 0;

            double? minimumRent;
            double? maximumRent;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            bool matchesProperty(
              Map<String, dynamic> data,
            ) {
              final search =
                  searchController.text.trim().toLowerCase();

              final title =
                  (data['title'] ?? '').toString().toLowerCase();

              final location =
                  (data['location'] ?? '').toString().toLowerCase();

              if (search.isNotEmpty &&
                  !title.contains(search) &&
                  !location.contains(search)) {
                return false;
              }

              final type =
                  (data['propertyType'] ?? '').toString();

              if (propertyType != 'All' &&
                  type != propertyType) {
                return false;
              }

              final isFurnished =
                  data['furnished'] == true;

              if (furnished == 'Furnished' &&
                  !isFurnished) {
                return false;
              }

              if (furnished == 'Unfurnished' &&
                  isFurnished) {
                return false;
              }

              final isAvailable =
                  data['available'] != false;

              if (available == 'Available' &&
                  !isAvailable) {
                return false;
              }

              final bedrooms =
                  int.tryParse(
                        '${data['bedrooms'] ?? 0}',
                      ) ??
                      0;

              if (bedrooms < minimumBedrooms) {
                return false;
              }

              final rent =
                  double.tryParse(
                        '${data['rent'] ?? 0}',
                      ) ??
                      0;

              if (minimumRent != null &&
                  rent < minimumRent!) {
                return false;
              }

              if (maximumRent != null &&
                  rent > maximumRent!) {
                return false;
              }

              return true;
            }

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  actions: [
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: TextField(
                        controller: searchController,
                        onChanged: (_) => setState(() {}),
                        decoration: InputDecoration(
                          hintText: 'Search by title or location',
                          prefixIcon: const Icon(Icons.search),
                          suffixIcon: searchController.text.isEmpty
                              ? null
                              : IconButton(
                                  onPressed: () {
                                    searchController.clear();
                                    setState(() {});
                                  },
                                  icon: const Icon(Icons.clear),
                                ),
                        ),
                      ),
                    ),
                    SizedBox(
                      height: 54,
                      child: ListView(
                        scrollDirection: Axis.horizontal,
                        padding: const EdgeInsets.symmetric(
                          horizontal: 12,
                        ),
                        children: [
                          _filterButton(
                            'Type',
                            propertyType,
                            [
                              'All',
                              'Room',
                              '1BHK',
                              '2BHK',
                              'Flat',
                            ],
                            (value) {
                              setState(() {
                                propertyType = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Furnished',
                            furnished,
                            [
                              'All',
                              'Furnished',
                              'Unfurnished',
                            ],
                            (value) {
                              setState(() {
                                furnished = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Availability',
                            available,
                            [
                              'All',
                              'Available',
                            ],
                            (value) {
                              setState(() {
                                available = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Bedrooms',
                            '$minimumBedrooms+',
                            [
                              '0+',
                              '1+',
                              '2+',
                              '3+',
                            ],
                            (value) {
                              setState(() {
                                minimumBedrooms =
                                    int.tryParse(
                                          value.replaceAll(
                                            '+',
                                            '',
                                          ),
                                        ) ??
                                        0;
                              });
                            },
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: StreamBuilder<
                          QuerySnapshot<Map<String, dynamic>>>(
                        stream: FirebaseFirestore.instance
                            .collection('properties')
                            .orderBy(
                              'createdAt',
                              descending: true,
                            )
                            .snapshots(),
                        builder: (context, snapshot) {
                          if (snapshot.connectionState ==
                              ConnectionState.waiting) {
                            return const Center(
                              child: CircularProgressIndicator(),
                            );
                          }

                          if (snapshot.hasError) {
                            return Center(
                              child: Padding(
                                padding: const EdgeInsets.all(24),
                                child: Text(
                                  'Unable to load properties.\n\n'
                                  '${snapshot.error}',
                                  textAlign: TextAlign.center,
                                ),
                              ),
                            );
                          }

                          final documents =
                              snapshot.data?.docs ?? [];

                          final filtered = documents.where((doc) {
                            return matchesProperty(doc.data());
                          }).toList();

                          if (filtered.isEmpty) {
                            return const Center(
                              child: Text(
                                'No properties found.',
                              ),
                            );
                          }

                          return ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: filtered.length,
                            itemBuilder: (context, index) {
                              final doc = filtered[index];

                              return PropertyCard(
                                propertyId: doc.id,
                                data: doc.data(),
                              );
                            },
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _filterButton(
              String title,
              String selected,
              List<String> options,
              ValueChanged<String> onSelected,
            ) {
              return Padding(
                padding: const EdgeInsets.only(right: 8),
                child: OutlinedButton.icon(
                  onPressed: () async {
                    final result =
                        await showModalBottomSheet<String>(
                      context: context,
                      builder: (context) {
                        return SafeArea(
                          child: ListView(
                            shrinkWrap: true,
                            children: options.map((option) {
                              return ListTile(
                                title: Text(option),
                                trailing: option == selected
                                    ? const Icon(
                                        Icons.check,
                                      )
                                    : null,
                                onTap: () {
                                  Navigator.pop(
                                    context,
                                    option,
                                  );
                                },
                              );
                            }).toList(),
                          ),
                        );
                      },
                    );

                    if (result != null) {
                      onSelected(result);
                    }
                  },
                  icon: const Icon(Icons.filter_list),
                  label: Text('$title: $selected'),
                ),
              );
            }
          }

          // =====================================================
          // PROPERTY CARD
          // =====================================================

          class PropertyCard extends StatelessWidget {
            final String propertyId;
            final Map<String, dynamic> data;

            const PropertyCard({
              super.key,
              required this.propertyId,
              required this.data,
            });

            @override
            Widget build(BuildContext context) {
              final available =
                  data['available'] != false;

              return Card(
                margin: const EdgeInsets.only(bottom: 12),
                child: InkWell(
                  borderRadius: BorderRadius.circular(12),
                  onTap: () {
                    Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) =>
                            PropertyDetailsScreen(
                          propertyId: propertyId,
                          data: data,
                        ),
                      ),
                    );
                  },
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      crossAxisAlignment:
                          CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            Expanded(
                              child: Text(
                                data['title'] ??
                                    'Untitled property',
                                style: const TextStyle(
                                  fontSize: 19,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),
                            Chip(
                              label: Text(
                                available
                                    ? 'Available'
                                    : 'Unavailable',
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        Row(
                          children: [
                            const Icon(
                              Icons.location_on_outlined,
                              size: 18,
                            ),
                            const SizedBox(width: 4),
                            Expanded(
                              child: Text(
                                data['location'] ?? '',
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 12),
                        Wrap(
                          spacing: 8,
                          runSpacing: 8,
                          children: [
                            _infoChip(
                              Icons.home_outlined,
                              data['propertyType'] ??
                                  'Property',
                            ),
                            _infoChip(
                              Icons.bed_outlined,
                              '${data['bedrooms'] ?? 0} bedrooms',
                            ),
                            _infoChip(
                              Icons.bathtub_outlined,
                              '${data['bathrooms'] ?? 0} bathrooms',
                            ),
                            _infoChip(
                              Icons.weekend_outlined,
                              data['furnished'] == true
                                  ? 'Furnished'
                                  : 'Unfurnished',
                            ),
                          ],
                        ),
                        const SizedBox(height: 14),
                        Text(
                          'Rs. ${data['rent'] ?? 0}/month',
                          style: const TextStyle(
                            fontSize: 18,
                            fontWeight: FontWeight.bold,
                            color: Colors.indigo,
                          ),
                        ),
