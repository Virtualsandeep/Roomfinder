name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      - name: Configure Android application ID
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          text = path.read_text()

          text = text.replace(
              'applicationId "com.example.kothafinder_nepal"',
              'applicationId "com.kothafinder.nepal"'
          )

          path.write_text(text)
          PY

      - name: Copy Firebase configuration
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json was not found in the repository root."
            exit 1
          fi

          cp google-services.json build_app/android/app/google-services.json

      - name: Add Firebase Core
        working-directory: build_app
        run: |
          flutter pub add firebase_core

      - name: Configure Google Services
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          settings_text = settings.read_text()
          app_text = app.read_text()

          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services' version '4.4.2' apply false""",
                  1
              )

          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  """plugins {
              id 'com.google.gms.google-services'""",
                  1
              )

          settings.write_text(settings_text)
          app.write_text(app_text)
          PY

      - name: Create KothaFinder app
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const WelcomeScreen(),
              );
            }
          }

          class WelcomeScreen extends StatelessWidget {
            const WelcomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  centerTitle: true,
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(
                          Icons.home_work,
                          size: 90,
                        ),
                        const SizedBox(height: 24),
                        const Text(
                          'KothaFinder Nepal',
                          style: TextStyle(
                            fontSize: 30,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        const Text(
                          'Find rooms, flats and apartments in Nepal.',
                          textAlign: TextAlign.center,
                          style: TextStyle(fontSize: 16),
                        ),
                        const SizedBox(height: 40),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton.icon(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (context) =>
                                      const CustomerHomeScreen(),
                                ),
                              );
                            },
                            icon: const Icon(Icons.search),
                            label: const Text('I am a Customer'),
                          ),
                        ),
                        const SizedBox(height: 16),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(
                                  builder: (context) =>
                                      const LandlordDashboard(),
                                ),
                              );
                            },
                            icon: const Icon(Icons.business),
                            label: const Text('I am a Landlord'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class CustomerHomeScreen extends StatelessWidget {
            const CustomerHomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Find a Property'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Text(
                      'Find Your Perfect Room',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    const Text(
                      'Search rooms, flats and apartments in Nepal.',
                    ),
                    const SizedBox(height: 24),
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search location...',
                        prefixIcon: const Icon(Icons.search),
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(15),
                        ),
                      ),
                    ),
                    const SizedBox(height: 20),
                    const PropertyCard(
                      title: 'Room in Kathmandu',
                      price: 'Rs. 10,000/month',
                      location: 'Kathmandu',
                    ),
                    const PropertyCard(
                      title: '1BHK Apartment',
                      price: 'Rs. 18,000/month',
                      location: 'Kathmandu',
                    ),
                    const PropertyCard(
                      title: 'Room in Lalitpur',
                      price: 'Rs. 8,000/month',
                      location: 'Lalitpur',
                    ),
                  ],
                ),
              );
            }
          }

          class PropertyCard extends StatelessWidget {
            final String title;
            final String price;
            final String location;

            const PropertyCard({
              super.key,
              required this.title,
              required this.price,
              required this.location,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 16),
                child: ListTile(
                  leading: const CircleAvatar(
                    child: Icon(Icons.home),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  subtitle: Text('$price • $location'),
                  trailing: const Icon(
                    Icons.arrow_forward_ios,
                    size: 18,
                  ),
                  onTap: () {},
                ),
              );
            }
          }

          class LandlordDashboard extends StatelessWidget {
            const LandlordDashboard({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Landlord Dashboard'),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Landlord Dashboard',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'Manage your properties.',
                        style: TextStyle(fontSize: 16),
                      ),
                      const SizedBox(height: 30),
                      SizedBox(
                        width: double.infinity,
                        height: 55,
                        child: ElevatedButton.icon(
                          onPressed: () {},
                          icon: const Icon(Icons.add_home),
                          label: const Text('Add New Property'),
                        ),
                      ),
                      const SizedBox(height: 25),
                      const Text(
                        'My Properties',
                        style: TextStyle(
                          fontSize: 22,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 15),
                      const Card(
                        child: ListTile(
                          leading: CircleAvatar(
                            child: Icon(Icons.apartment),
                          ),
                          title: Text('My 2BHK Apartment'),
                          subtitle: Text(
                            'Rs. 25,000/month • Available',
                          ),
                          trailing: Icon(Icons.edit),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Remove default tests
        working-directory: build_app
        run: |
          rm -rf test

      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
