          class _PropertyDetailsScreenState
              extends State<PropertyDetailsScreen> {
            bool sending = false;

            Future<void> showContactLandlord() async {
              final landlordId =
                  widget.data['landlordId'];

              if (landlordId == null ||
                  landlordId.toString().isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Landlord information is unavailable.',
                    ),
                  ),
                );
                return;
              }

              final landlordDoc =
                  await FirebaseFirestore.instance
                      .collection('users')
                      .doc(landlordId)
                      .get();

              final landlord =
                  landlordDoc.data() ?? {};

              final landlordName =
                  landlord['name'] ?? 'Landlord';

              final landlordEmail =
                  landlord['email'] ?? '';

              if (!mounted) return;

              final messageController =
                  TextEditingController();

              final submitted =
                  await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text(
                      'Contact Landlord',
                    ),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment:
                            CrossAxisAlignment.start,
                        children: [
                          Text(
                            landlordName,
                            style: const TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          if (landlordEmail
                              .toString()
                              .isNotEmpty) ...[
                            const SizedBox(height: 4),
                            Text(
                              landlordEmail,
                              style: const TextStyle(
                                color: Colors.grey,
                              ),
                            ),
                          ],
                          const SizedBox(height: 18),
                          TextField(
                            controller: messageController,
                            maxLines: 5,
                            decoration:
                                const InputDecoration(
                              labelText: 'Your message',
                              hintText:
                                  'I am interested in this property...',
                              alignLabelWithHint: true,
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(
                            dialogContext,
                            false,
                          );
                        },
                        child: const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () async {
                          if (messageController.text
                              .trim()
                              .isEmpty) {
                            ScaffoldMessenger.of(
                              dialogContext,
                            ).showSnackBar(
                              const SnackBar(
                                content: Text(
                                  'Please enter a message.',
                                ),
                              ),
                            );
                            return;
                          }

                          Navigator.pop(
                            dialogContext,
                            true,
                          );
                        },
                        child: const Text('Send Inquiry'),
                      ),
                    ],
                  );
                },
              );

              if (submitted != true) {
                messageController.dispose();
                return;
              }

              final customer =
                  FirebaseAuth.instance.currentUser;

              if (customer == null) {
                messageController.dispose();
                return;
              }

              setState(() => sending = true);

              try {
                final customerDoc =
                    await FirebaseFirestore.instance
                        .collection('users')
                        .doc(customer.uid)
                        .get();

                final customerData =
                    customerDoc.data() ?? {};

                await FirebaseFirestore.instance
                    .collection('inquiries')
                    .add({
                  'customerId': customer.uid,
                  'customerName':
                      customerData['name'] ??
                          customer.displayName ??
                          'Customer',
                  'customerEmail':
                      customerData['email'] ??
                          customer.email ??
                          '',
                  'landlordId': landlordId,
                  'landlordName': landlordName,
                  'propertyId': widget.propertyId,
                  'propertyTitle':
                      widget.data['title'] ??
                          'Property',
                  'message':
                      messageController.text.trim(),
                  'status': 'new',
                  'createdAt':
                      FieldValue.serverTimestamp(),
                });

                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Inquiry sent successfully.',
                    ),
                  ),
                );
              } catch (e) {
                if (!mounted) return;

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'Unable to send inquiry: $e',
                    ),
                  ),
                );
              } finally {
                messageController.dispose();

                if (mounted) {
                  setState(() => sending = false);
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              final data = widget.data;

              final available =
                  data['available'] != false;

              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Property Details',
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        data['title'] ??
                            'Property',
                        style: const TextStyle(
                          fontSize: 27,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 10),
                      Row(
                        children: [
                          const Icon(
                            Icons.location_on_outlined,
                          ),
                          const SizedBox(width: 6),
                          Expanded(
                            child: Text(
                              data['location'] ?? '',
                              style: const TextStyle(
                                fontSize: 16,
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(18),
                        decoration: BoxDecoration(
                          color: Colors.indigo
                              .withOpacity(0.08),
                          borderRadius:
                              BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              'Rs. ${data['rent'] ?? 0}/month',
                              style: const TextStyle(
                                fontSize: 24,
                                fontWeight: FontWeight.bold,
                                color: Colors.indigo,
                              ),
                            ),
                            if ((data['discount'] ?? '')
