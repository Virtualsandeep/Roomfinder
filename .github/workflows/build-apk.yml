name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # ============================================================
      # 3. CREATE FLUTTER PROJECT
      # ============================================================
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      # ============================================================
      # 4. ANDROID APPLICATION ID
      # ============================================================
      - name: Configure Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "namespace = \"com.example.kothafinder_nepal\"",
              "namespace = \"com.kothafinder.nepal\""
          )

          text = text.replace(
              "applicationId = \"com.example.kothafinder_nepal\"",
              "applicationId = \"com.kothafinder.nepal\""
          )

          path.write_text(text)
          PY

      # ============================================================
      # 5. MINIMUM ANDROID SDK
      # ============================================================
      - name: Configure minimum Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          path.write_text(text)
          PY

      # ============================================================
      # 6. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android configuration
        run: |
          grep -n "namespace" build_app/android/app/build.gradle
          grep -n "applicationId" build_app/android/app/build.gradle
          grep -n "minSdk" build_app/android/app/build.gradle

      # ============================================================
      # 7. FIREBASE CONFIGURATION
      # ============================================================
      - name: Copy Firebase configuration
        run: |
          test -f google-services.json
          cp google-services.json build_app/android/app/google-services.json

      - name: Verify Firebase configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q "com.kothafinder.nepal" build_app/android/app/google-services.json

      # ============================================================
      # 8. FIREBASE + GOOGLE MAPS URL LAUNCHER
      #
      # NOTE:
      # This keeps Step 7 Google Maps functionality.
      # No Google Maps SDK/API key is used.
      # ============================================================
      - name: Add Firebase and Maps packages
        working-directory: build_app
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add url_launcher

      # ============================================================
      # 9. GOOGLE SERVICES GRADLE PLUGIN
      # ============================================================
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle
          path = Path("build_app/android/settings.gradle")
          text = path.read_text()

          old = 'id "dev.flutter.flutter-plugin-loader" version "1.0.0"'

          new = '''id "dev.flutter.flutter-plugin-loader" version "1.0.0"
          id "com.google.gms.google-services" version "4.4.2" apply false'''

          if "com.google.gms.google-services" not in text:
              text = text.replace(old, new)

          path.write_text(text)

          # app/build.gradle
          path = Path("build_app/android/app/build.gradle")
          text = path.read_text()

          if 'id "com.google.gms.google-services"' not in text:
              marker = "plugins {"
              index = text.find(marker)

              if index == -1:
                  raise SystemExit(
                      "Could not find plugins block in app/build.gradle"
                  )

              insert_at = index + len(marker)

              text = (
                  text[:insert_at]
                  + '\n    id "com.google.gms.google-services"'
                  + text[insert_at:]
              )

          path.write_text(text)
          PY

      # ============================================================
      # 10. FIREBASE ANDROID CONFIGURATION
      #
      # Firebase uses the native Android configuration from
      # google-services.json.
      #
      # IMPORTANT:
      # We do NOT manually create firebase_options.dart here.
      # This removes the mobilesdk_app_id error from the previous
      # workflow.
      # ============================================================
      - name: Verify Firebase Android configuration
        run: |
          test -f build_app/android/app/google-services.json
          grep -q '"project_info"' build_app/android/app/google-services.json
          grep -q '"client"' build_app/android/app/google-services.json

      # ============================================================
      # 11. CREATE APPLICATION
      #
      # Includes:
      # - Authentication
      # - Customer dashboard
      # - Property search/filter
      # - Landlord property management
      # - Customer inquiries
      # - Landlord inquiries
      # - Inquiry statuses
      # - isRead handling
      # - Google Maps
      # ============================================================
      - name: Create application
        run: |
          cat > build_app/lib/main.dart <<'DART'
          // ignore_for_file: use_build_context_synchronously

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';

          final FirebaseAuth auth = FirebaseAuth.instance;
          final FirebaseFirestore db = FirebaseFirestore.instance;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: const Color(0xFF3156D3),
                  scaffoldBackgroundColor: const Color(0xFFF7F8FC),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: BorderSide.none,
                    ),
                    enabledBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: BorderSide.none,
                    ),
                    focusedBorder: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(14),
                      borderSide: const BorderSide(
                        color: Color(0xFF3156D3),
                        width: 1.5,
                      ),
                    ),
                  ),
                ),
                home: StreamBuilder<User?>(
                  stream: auth.authStateChanges(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const LoadingScreen();
                    }

                    if (!snapshot.hasData) {
                      return const AuthScreen();
                    }

                    return RoleGate(userId: snapshot.data!.uid);
                  },
                ),
              );
            }
          }

          class LoadingScreen extends StatelessWidget {
            const LoadingScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                body: Center(
                  child: CircularProgressIndicator(),
                ),
              );
            }
          }

          class RoleGate extends StatelessWidget {
            final String userId;

            const RoleGate({
              super.key,
              required this.userId,
            });

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                stream: db.collection('users').doc(userId).snapshots(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const LoadingScreen();
                  }

                  final data = snapshot.data?.data();
                  final role = data?['role'];

                  if (role == 'landlord') {
                    return const LandlordHome();
                  }

                  return CustomerHome(
                    needsRole: role == null,
                  );
                },
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final emailController = TextEditingController();
            final passwordController = TextEditingController();

            bool loading = false;
            bool obscurePassword = true;

            @override
            void dispose() {
              emailController.dispose();
              passwordController.dispose();
              super.dispose();
            }

            void showMessage(String message) {
              if (!mounted) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(message),
                ),
              );
            }

            Future<void> login() async {
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (email.isEmpty || password.isEmpty) {
                showMessage(
                  'Enter your email and password.',
                );
                return;
              }

              setState(() => loading = true);

              try {
                await auth.signInWithEmailAndPassword(
                  email: email,
                  password: password,
                );
              } on FirebaseAuthException catch (e) {
                showMessage(
                  e.message ?? 'Login failed.',
                );
              } catch (e) {
                showMessage(
                  'Login failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            Future<void> register() async {
              final email = emailController.text.trim();
              final password = passwordController.text;

              if (email.isEmpty || password.isEmpty) {
                showMessage(
                  'Enter your email and password.',
                );
                return;
              }

              if (password.length < 6) {
                showMessage(
                  'Password must contain at least 6 characters.',
                );
                return;
              }

              setState(() => loading = true);

              try {
                final credential =
                    await auth.createUserWithEmailAndPassword(
                  email: email,
                  password: password,
                );

                final user = credential.user;

                if (user != null) {
                  await db.collection('users').doc(user.uid).set(
                    {
                      'email': email,
                      'role': null,
                      'createdAt': FieldValue.serverTimestamp(),
                    },
                  );
                }

                showMessage(
                  'Account created successfully.',
                );
              } on FirebaseAuthException catch (e) {
                showMessage(
                  e.message ?? 'Registration failed.',
                );
              } catch (e) {
                showMessage(
                  'Registration failed: $e',
                );
              } finally {
                if (mounted) {
                  setState(() => loading = false);
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(
                          maxWidth: 500,
                        ),
                        child: Column(
                          children: [
                            const Icon(
                              Icons.home_work_outlined,
                              size: 72,
                            ),
                            const SizedBox(height: 18),
                            const Text(
                              'KothaFinder Nepal',
                              style: TextStyle(
                                fontSize: 30,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            const Text(
                              'Find your next room or property.',
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                fontSize: 16,
                              ),
                            ),
                            const SizedBox(height: 32),
                            TextField(
                              controller: emailController,
                              keyboardType:
                                  TextInputType.emailAddress,
                              decoration: const InputDecoration(
                                labelText: 'Email',
                                prefixIcon: Icon(
                                  Icons.email_outlined,
                                ),
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: passwordController,
                              obscureText: obscurePassword,
                              decoration: InputDecoration(
                                labelText: 'Password',
                                prefixIcon: const Icon(
                                  Icons.lock_outline,
                                ),
                                suffixIcon: IconButton(
                                  onPressed: () {
                                    setState(() {
                                      obscurePassword =
                                          !obscurePassword;
                                    });
                                  },
                                  icon: Icon(
                                    obscurePassword
                                        ? Icons.visibility_outlined
                                        : Icons
                                            .visibility_off_outlined,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 22),
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: FilledButton(
                                onPressed: loading ? null : login,
                                child: loading
                                    ? const SizedBox(
                                        height: 22,
                                        width: 22,
                                        child:
                                            CircularProgressIndicator(
                                          strokeWidth: 2,
                                        ),
                                      )
                                    : const Text('Login'),
                              ),
                            ),
                            const SizedBox(height: 10),
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: OutlinedButton(
                                onPressed:
                                    loading ? null : register,
                                child: const Text(
                                  'Create Account',
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
