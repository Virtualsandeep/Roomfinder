name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # 3. Create Flutter project
      - name: Create Flutter project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --org com.kothafinder \
            --platforms android \
            build_app

      # 4. Set the exact Android package ID required by Firebase
      - name: Configure Android package
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'namespace "com.kothafinder.kothafinder_nepal"',
              'namespace "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId "com.kothafinder.kothafinder_nepal"',
              'applicationId "com.kothafinder.nepal"'
          )

          text = text.replace(
              'namespace = "com.kothafinder.kothafinder_nepal"',
              'namespace = "com.kothafinder.nepal"'
          )

          text = text.replace(
              'applicationId = "com.kothafinder.kothafinder_nepal"',
              'applicationId = "com.kothafinder.nepal"'
          )

          path.write_text(text)

          print("Android package configured:")
          print("com.kothafinder.nepal")
          PY

      # 5. Copy Firebase configuration
      - name: Copy Firebase configuration
        run: |
          test -f google-services.json
          mkdir -p build_app/android/app
          cp google-services.json build_app/android/app/google-services.json

      # 6. Add Firebase Core
      - name: Add Firebase Core
        working-directory: build_app
        run: |
          flutter pub add firebase_core

      # 7. Configure Google Services
      - name: Configure Google Services
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          settings_text = settings.read_text()
          app_text = app.read_text()

          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  1
              )

          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("Google Services configured successfully.")
          PY

      # 8. Create KothaFinder app
      - name: Create KothaFinder app
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Firebase.initializeApp();

            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const WelcomeScreen(),
              );
            }
          }

          class WelcomeScreen extends StatelessWidget {
            const WelcomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(
                            Icons.home_work_rounded,
                            size: 90,
                            color: Colors.blue,
                          ),
                          const SizedBox(height: 25),
                          const Text(
                            'KothaFinder Nepal',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 32,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 12),
                          const Text(
                            'Find rooms, flats and apartments across Nepal.',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 17,
                              color: Colors.grey,
                            ),
                          ),
                          const SizedBox(height: 50),
                          const Text(
                            'How do you want to use KothaFinder?',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.w600,
                            ),
                          ),
                          const SizedBox(height: 25),

                          SizedBox(
                            width: double.infinity,
                            height: 58,
                            child: ElevatedButton.icon(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const CustomerHomeScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(Icons.search),
                              label: const Text(
                                'I am a Customer',
                                style: TextStyle(fontSize: 17),
                              ),
                            ),
                          ),

                          const SizedBox(height: 15),

                          SizedBox(
                            width: double.infinity,
                            height: 58,
                            child: OutlinedButton.icon(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        const LandlordDashboard(),
                                  ),
                                );
                              },
                              icon: const Icon(Icons.business),
                              label: const Text(
                                'I am a Landlord',
                                style: TextStyle(fontSize: 17),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class CustomerHomeScreen extends StatelessWidget {
            const CustomerHomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title:                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const WelcomeScreen(),
              );
            }
          }

          class WelcomeScreen extends StatelessWidget {
            const WelcomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(
                            Icons.home_work_rounded,
                            size: 90,
                            color: Colors.blue,
                          ),

                          const SizedBox(height: 25),

                          const Text(
                            'KothaFinder Nepal',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 32,
                              fontWeight: FontWeight.bold,
                            ),
                          ),

                          const SizedBox(height: 12),

                          const Text(
                            'Find rooms, flats and apartments across Nepal.',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 17,
                              color: Colors.grey,
                            ),
                          ),

                          const SizedBox(height: 50),

                          const Text(
                            'How do you want to use KothaFinder?',
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.w600,
                            ),
                          ),

                          const SizedBox(height: 25),

                          SizedBox(
                            width: double.infinity,
                            height: 58,
                            child: ElevatedButton.icon(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (context) =>
                                        const CustomerHomeScreen(),
                                  ),
                                );
                              },
                              icon: const Icon(Icons.search),
                              label: const Text(
                                'I am a Customer',
                                style: TextStyle(fontSize: 17),
                              ),
                            ),
                          ),

                          const SizedBox(height: 15),

                          SizedBox(
                            width: double.infinity,
                            height: 58,
                            child: OutlinedButton.icon(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (context) =>
                                        const LandlordDashboard(),
                                  ),
                                );
                              },
                              icon: const Icon(Icons.business),
                              label: const Text(
                                'I am a Landlord',
                                style: TextStyle(fontSize: 17),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class CustomerHomeScreen extends StatelessWidget {
            const CustomerHomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Find a Property'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Text(
                      'Find Your Perfect Room',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 8),

                    const Text(
                      'Search rooms, flats and apartments in Nepal.',
                      style: TextStyle(
                        fontSize: 16,
                        color: Colors.grey,
                      ),
                    ),

                    const SizedBox(height: 25),

                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search location...',
                        prefixIcon: const Icon(Icons.search),
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(15),
                        ),
                      ),
                    ),

                    const SizedBox(height: 20),

                    _propertyCard(
                      'Room in Kathmandu',
                      'Rs. 10,000/month',
                      'Available now',
                      Icons.home,
                    ),

                    _propertyCard(
                      '1BHK Apartment',
                      'Rs. 18,000/month',
                      'Kathmandu',
                      Icons.apartment,
                    ),

                    _propertyCard(
                      'Room in Lalitpur',
                      'Rs. 8,000/month',
                      'Available now',
                      Icons.house,
                    ),
                  ],
                ),
              );
            }

            Widget _propertyCard(
              String title,
              String price,
              String location,
              IconData icon,
            ) {
              return Card(
                margin: const EdgeInsets.only(bottom: 15),
                child: ListTile(
                  contentPadding: const EdgeInsets.all(12),
                  leading: CircleAvatar(
                    radius: 28,
                    child: Icon(icon),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                      fontSize: 17,
                    ),
                  ),
                  subtitle: Padding(
                    padding: const EdgeInsets.only(top: 6),
                    child: Text(
                      '$price • $location',
                    ),
                  ),
                  trailing: const Icon(
                    Icons.arrow_forward_ios,
                    size: 18,
                  ),
                  onTap: () {},
                ),
              );
            }
          }

          class LandlordDashboard extends StatelessWidget {
            const LandlordDashboard({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Landlord Dashboard'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Text(
                      'Welcome, Landlord',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 10),

                    const Text(
                      'Manage your properties from here.',
                      style: TextStyle(
                        fontSize: 16,
                        color: Colors.grey,
                      ),
                    ),

                    const SizedBox(height: 30),

                    SizedBox(
                      height: 58,
                      child: ElevatedButton.icon(
                        onPressed: () {},
                        icon: const Icon(Icons.add_home),
                        label: const Text(
                          'Add New Property',
                          style: TextStyle(fontSize: 17),
                        ),
                      ),
                    ),

                    const SizedBox(height: 25),

                    const Text(
                      'My Properties',
                      style: TextStyle(
                        fontSize: 22,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 15),

                    Card(
                      child: ListTile(
                        leading: const CircleAvatar(
                          child: Icon(Icons.apartment),
                        ),
                        title: const Text(
                          'My 2BHK Apartment',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        subtitle: const Text(
                          'Rs. 25,000/month • Available',
                        ),
                        trailing: const Icon(Icons.edit),
                        onTap: () {},
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      # 9. Remove default Flutter test
      - name: Remove default test
        working-directory: build_app
        run: |
          rm -rf test

      # 10. Get dependencies
      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      # 11. Analyze project
      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze

      # 12. Build APK
      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
