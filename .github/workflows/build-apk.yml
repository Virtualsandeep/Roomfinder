          class AddPropertyScreen extends StatefulWidget {
            final QueryDocumentSnapshot<Map<String, dynamic>>?
                existing;

            const AddPropertyScreen({
              super.key,
              this.existing,
            });

            bool get isEditing => existing != null;

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            final formKey = GlobalKey<FormState>();

            late final TextEditingController titleController;
            late final TextEditingController locationController;
            late final TextEditingController rentController;
            late final TextEditingController discountController;
            late final TextEditingController bedroomsController;
            late final TextEditingController bathroomsController;
            late final TextEditingController descriptionController;

            String propertyType = 'Room';
            String furnished = 'Unfurnished';
            bool available = true;
            bool saving = false;

            @override
            void initState() {
              super.initState();

              final data = widget.existing?.data();

              titleController = TextEditingController(
                text: data?['title']?.toString() ?? '',
              );

              locationController = TextEditingController(
                text: data?['location']?.toString() ?? '',
              );

              rentController = TextEditingController(
                text: data?['monthlyRent']?.toString() ?? '',
              );

              discountController = TextEditingController(
                text: data?['discount']?.toString() ?? '0',
              );

              bedroomsController = TextEditingController(
                text: data?['bedrooms']?.toString() ?? '0',
              );

              bathroomsController = TextEditingController(
                text: data?['bathrooms']?.toString() ?? '0',
              );

              descriptionController = TextEditingController(
                text: data?['description']?.toString() ?? '',
              );

              propertyType =
                  data?['propertyType']?.toString() ?? 'Room';

              furnished =
                  data?['furnished']?.toString() ?? 'Unfurnished';

              available = data?['available'] == false
                  ? false
                  : true;
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            Future<void> saveProperty() async {
              if (!formKey.currentState!.validate()) {
                return;
              }

              final user = auth.currentUser;

              if (user == null) {
                showMessage(
                  context,
                  'Please login again.',
                );
                return;
              }

              setState(() {
                saving = true;
              });

              try {
                final data = {
                  'title': titleController.text.trim(),
                  'location': locationController.text.trim(),
                  'monthlyRent':
                      int.tryParse(
                            rentController.text.trim(),
                          ) ??
                          0,
                  'discount':
                      int.tryParse(
                            discountController.text.trim(),
                          ) ??
                          0,
                  'bedrooms':
                      int.tryParse(
                            bedroomsController.text.trim(),
                          ) ??
                          0,
                  'bathrooms':
                      int.tryParse(
                            bathroomsController.text.trim(),
                          ) ??
                          0,
                  'description':
                      descriptionController.text.trim(),
                  'propertyType': propertyType,
                  'furnished': furnished,
                  'available': available,
                  'landlordId': user.uid,
                };

                if (widget.isEditing) {
                  await db
                      .collection('properties')
                      .doc(widget.existing!.id)
                      .update(data);
                } else {
                  await db.collection('properties').add({
                    ...data,
                    'createdAt':
                        FieldValue.serverTimestamp(),
                  });
                }

                if (!mounted) return;

                Navigator.pop(context);
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
                  'Could not save property: $e',
                );
              } finally {
                if (mounted) {
                  setState(() {
                    saving = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    widget.isEditing
                        ? 'Edit Property'
                        : 'Add Property',
                  ),
                ),
                body: Form(
                  key: formKey,
                  child: ListView(
                    padding: const EdgeInsets.all(20),
                    children: [
                      TextFormField(
                        controller: titleController,
                        textCapitalization:
                            TextCapitalization.sentences,
                        decoration: const InputDecoration(
                          labelText: 'Property title',
                        ),
                        validator: (value) {
                          if (value == null ||
                              value.trim().isEmpty) {
                            return 'Enter a property title.';
                          }
                          return null;
                        },
                      ),
                      const SizedBox(height: 16),
                      TextFormField(
                        controller: locationController,
                        textCapitalization:
                            TextCapitalization.words,
                        decoration: const InputDecoration(
                          labelText: 'Location',
                          hintText: 'Kathmandu, Nepal',
                        ),
                        validator: (value) {
                          if (value == null ||
                              value.trim().isEmpty) {
                            return 'Enter the location.';
                          }
                          return null;
                        },
                      ),
                      const SizedBox(height: 16),
                      DropdownButtonFormField<String>(
                        value: propertyType,
                        decoration: const InputDecoration(
                          labelText: 'Property type',
                        ),
                        items: const [
                          DropdownMenuItem(
                            value: 'Room',
                            child: Text('Room'),
                          ),
                          DropdownMenuItem(
                            value: '1BHK',
                            child: Text('1BHK'),
                          ),
                          DropdownMenuItem(
                            value: '2BHK',
                            child: Text('2BHK'),
                          ),
                          DropdownMenuItem(
                            value: 'Flat',
                            child: Text('Flat'),
                          ),
                        ],
                        onChanged: saving
                            ? null
                            : (value) {
                                if (value != null) {
                                  setState(() {
                                    propertyType = value;
                                  });
                                }
                              },
                      ),
                      const SizedBox(height: 16),
                      TextFormField(
                        controller: rentController,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: 'Monthly rent',
                          prefixText: 'Rs. ',
                        ),
                        validator: (value) {
                          final rent =
                              int.tryParse(
                            value?.trim() ?? '',
                          );

                          if (rent == null || rent < 0) {
                            return 'Enter a valid rent.';
                          }

                          return null;
                        },
                      ),
                      const SizedBox(height: 16),
                      TextFormField(
                        controller: discountController,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: 'Discount',
                          prefixText: 'Rs. ',
