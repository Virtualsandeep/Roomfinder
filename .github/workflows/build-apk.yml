          class PropertyDetailsScreen extends StatelessWidget {
            final String propertyId;
            final Map<String, dynamic> data;

            const PropertyDetailsScreen({
              super.key,
              required this.propertyId,
              required this.data,
            });

            Future<void> contactLandlord(
              BuildContext context,
            ) async {
              final landlordId = data['landlordId'];

              if (landlordId == null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Landlord information is unavailable.',
                    ),
                  ),
                );
                return;
              }

              final landlordDoc = await FirebaseFirestore.instance
                  .collection('users')
                  .doc(landlordId)
                  .get();

              final landlordData = landlordDoc.data();

              if (!context.mounted) return;

              final messageController =
                  TextEditingController();

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  bool sending = false;

                  return StatefulBuilder(
                    builder: (context, setDialogState) {
                      return AlertDialog(
                        title: const Text('Contact Landlord'),
                        content: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            crossAxisAlignment:
                                CrossAxisAlignment.start,
                            children: [
                              Text(
                                'Landlord: '
                                '${landlordData?['name'] ?? 'Landlord'}',
                              ),
                              const SizedBox(height: 4),
                              Text(
                                'Email: '
                                '${landlordData?['email'] ?? ''}',
                              ),
                              const SizedBox(height: 16),
                              TextField(
                                controller: messageController,
                                maxLines: 5,
                                decoration:
                                    const InputDecoration(
                                  labelText: 'Your message',
                                  hintText:
                                      'I am interested in this property...',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                            ],
                          ),
                        ),
                        actions: [
                          TextButton(
                            onPressed: sending
                                ? null
                                : () {
                                    Navigator.pop(dialogContext);
                                  },
                            child: const Text('Cancel'),
                          ),
                          FilledButton(
                            onPressed: sending
                                ? null
                                : () async {
                                    final message =
                                        messageController.text
                                            .trim();

                                    if (message.isEmpty) {
                                      ScaffoldMessenger.of(
                                        context,
                                      ).showSnackBar(
                                        const SnackBar(
                                          content: Text(
                                            'Please enter a message.',
                                          ),
                                        ),
                                      );
                                      return;
                                    }

                                    final customer =
                                        FirebaseAuth.instance
                                            .currentUser;

                                    if (customer == null) {
                                      return;
                                    }

                                    setDialogState(() {
                                      sending = true;
                                    });

                                    try {
                                      final customerDoc =
                                          await FirebaseFirestore
                                              .instance
                                              .collection('users')
                                              .doc(customer.uid)
                                              .get();

                                      final customerData =
                                          customerDoc.data();

                                      await FirebaseFirestore
                                          .instance
                                          .collection('inquiries')
                                          .add({
                                        'customerId':
                                            customer.uid,
                                        'customerName':
                                            customerData?['name'] ??
                                                customer.displayName ??
                                                'Customer',
                                        'customerEmail':
                                            customerData?['email'] ??
                                                customer.email ??
                                                '',
                                        'landlordId': landlordId,
                                        'landlordName':
                                            landlordData?['name'] ??
                                                'Landlord',
                                        'propertyId':
                                            propertyId,
                                        'propertyTitle':
                                            data['title'] ??
                                                'Property',
                                        'message': message,
                                        'status': 'new',
                                        'createdAt':
                                            FieldValue
                                                .serverTimestamp(),
                                      });

                                      if (!dialogContext.mounted) {
                                        return;
                                      }

                                      Navigator.pop(
                                        dialogContext,
                                      );

                                      if (!context.mounted) return;

                                      ScaffoldMessenger.of(
                                        context,
                                      ).showSnackBar(
                                        const SnackBar(
                                          content: Text(
                                            'Inquiry sent successfully.',
                                          ),
                                        ),
                                      );
                                    } catch (e) {
                                      if (!dialogContext.mounted) {
                                        return;
                                      }

                                      setDialogState(() {
                                        sending = false;
                                      });

                                      ScaffoldMessenger.of(
                                        context,
                                      ).showSnackBar(
                                        SnackBar(
                                          content: Text(
                                            'Failed to send inquiry: $e',
                                          ),
                                        ),
                                      );
                                    }
                                  },
                            child: sending
                                ? const SizedBox(
                                    width: 20,
                                    height: 20,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : const Text('Send'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );

              messageController.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final available = data['available'] != false;
              final rent = data['monthlyRent'] ?? 0;
              final discount = data['discount'] ?? 0;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Property Details'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        data['title'] ?? 'Property',
                        style: const TextStyle(
                          fontSize: 28,
