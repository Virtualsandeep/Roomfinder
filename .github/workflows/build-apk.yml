                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              customerName,
                              style: const TextStyle(
                                fontSize: 18,
                                fontWeight:
                                    FontWeight.bold,
                              ),
                            ),
                          ),
                          Chip(
                            label: Text(
                              status == 'new'
                                  ? 'NEW'
                                  : 'READ',
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 4),
                      if (customerEmail
                          .toString()
                          .isNotEmpty)
                        Text(
                          customerEmail,
                          style: const TextStyle(
                            color: Colors.grey,
                          ),
                        ),
                      const SizedBox(height: 12),
                      Text(
                        'Property: $propertyTitle',
                        style: const TextStyle(
                          fontWeight: FontWeight.w600,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: Colors.grey
                              .withOpacity(0.08),
                          borderRadius:
