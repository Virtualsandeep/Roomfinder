          // ============================================================

          class AddPropertyScreen
              extends StatefulWidget {
            final QueryDocumentSnapshot<
                Map<String, dynamic>>? existing;

            const AddPropertyScreen({
              super.key,
              this.existing,
            });

            @override
            State<AddPropertyScreen> createState() =>
                _AddPropertyScreenState();
          }

          class _AddPropertyScreenState
              extends State<AddPropertyScreen> {
            final titleController =
                TextEditingController();

            final locationController =
                TextEditingController();

            final rentController =
                TextEditingController();

            final discountController =
                TextEditingController();

            final bedroomsController =
                TextEditingController();

            final bathroomsController =
                TextEditingController();

            final descriptionController =
                TextEditingController();

            String propertyType = 'Room';
            String furnished = 'Unfurnished';
            bool available = true;
            bool loading = false;

            @override
            void initState() {
              super.initState();

              final existing =
                  widget.existing?.data();

              if (existing != null) {
                titleController.text =
                    '${existing['title'] ?? ''}';

                locationController.text =
                    '${existing['location'] ?? ''}';

                rentController.text =
                    '${existing['monthlyRent'] ?? ''}';

                discountController.text =
                    '${existing['discount'] ?? ''}';

                bedroomsController.text =
                    '${existing['bedrooms'] ?? ''}';

                bathroomsController.text =
                    '${existing['bathrooms'] ?? ''}';

                descriptionController.text =
                    '${existing['description'] ?? ''}';

                propertyType =
                    '${existing['propertyType'] ?? 'Room'}';

                furnished =
                    '${existing['furnished'] ?? 'Unfurnished'}';

                available =
                    existing['available'] != false;
              }
            }

            @override
            void dispose() {
              titleController.dispose();
              locationController.dispose();
              rentController.dispose();
              discountController.dispose();
              bedroomsController.dispose();
              bathroomsController.dispose();
              descriptionController.dispose();
              super.dispose();
            }

            Future<void> saveProperty() async {
              final user = auth.currentUser;

              if (user == null) {
                showMessage(
                  context,
                  'Please login first.',
                );
                return;
              }

              final title =
                  titleController.text.trim();

              final location =
                  locationController.text.trim();

              final rent =
                  int.tryParse(
                    rentController.text.trim(),
                  );

              final discount =
                  int.tryParse(
                    discountController.text.trim(),
                  ) ??
                  0;

              final bedrooms =
                  int.tryParse(
                    bedroomsController.text.trim(),
                  ) ??
                  0;

              final bathrooms =
                  int.tryParse(
                    bathroomsController.text.trim(),
                  ) ??
                  0;

              final description =
                  descriptionController.text.trim();

              if (title.isEmpty ||
                  location.isEmpty ||
                  rent == null) {
                showMessage(
                  context,
                  'Please enter title, location and valid rent.',
                );
                return;
              }

              setState(() {
                loading = true;
              });

              try {
                final data = {
                  'title': title,
                  'propertyType':
                      propertyType,
                  'location': location,
                  'monthlyRent': rent,
                  'discount': discount,
                  'bedrooms': bedrooms,
                  'bathrooms': bathrooms,
                  'description': description,
                  'furnished': furnished,
                  'available': available,
                  'landlordId': user.uid,
                  'updatedAt':
                      FieldValue.serverTimestamp(),
                };

                if (widget.existing == null) {
                  data['createdAt'] =
                      FieldValue.serverTimestamp();

                  await db
                      .collection('properties')
                      .add(data);
                } else {
                  await db
                      .collection('properties')
                      .doc(widget.existing!.id)
                      .update(data);
                }

                if (!mounted) return;

                Navigator.pop(context);
              } catch (e) {
                if (!mounted) return;

                showMessage(
                  context,
