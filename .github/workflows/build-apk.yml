name: Build KothaFinder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      # 3. Create a Flutter Android project
      - name: Create Flutter Android project
        run: |
          flutter create \
            --project-name kothafinder_nepal \
            --platforms android \
            build_app

      # 4. Create the KothaFinder app
      - name: Create KothaFinder app
        working-directory: build_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const KothaFinderApp());
          }

          class KothaFinderApp extends StatelessWidget {
            const KothaFinderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KothaFinder Nepal',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  centerTitle: true,
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Text(
                      'Find Your Perfect Room',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 8),

                    const Text(
                      'Find rooms, flats and apartments in Nepal.',
                      style: TextStyle(
                        fontSize: 16,
                        color: Colors.grey,
                      ),
                    ),

                    const SizedBox(height: 25),

                    TextField(
                      decoration: InputDecoration(
                        hintText: 'Search location...',
                        prefixIcon: const Icon(Icons.search),
                        border: OutlineInputBorder(
                          borderRadius: BorderRadius.circular(15),
                        ),
                      ),
                    ),

                    const SizedBox(height: 20),

                    Card(
                      child: ListTile(
                        leading: const CircleAvatar(
                          child: Icon(Icons.home),
                        ),
                        title: const Text(
                          'Room in Kathmandu',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        subtitle: const Text(
                          'Rs. 10,000/month • Available now',
                        ),
                        trailing: const Icon(
                          Icons.arrow_forward_ios,
                          size: 18,
                        ),
                        onTap: () {},
                      ),
                    ),

                    Card(
                      child: ListTile(
                        leading: const CircleAvatar(
                          child: Icon(Icons.apartment),
                        ),
                        title: const Text(
                          '1BHK Apartment',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        subtitle: const Text(
                          'Rs. 18,000/month • Kathmandu',
                        ),
                        trailing: const Icon(
                          Icons.arrow_forward_ios,
                          size: 18,
                        ),
                        onTap: () {},
                      ),
                    ),

                    Card(
                      child: ListTile(
                        leading: const CircleAvatar(
                          child: Icon(Icons.house),
                        ),
                        title: const Text(
                          'Room in Lalitpur',
                          style: TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        subtitle: const Text(
                          'Rs. 8,000/month • Available now',
                        ),
                        trailing: const Icon(
                          Icons.arrow_forward_ios,
                          size: 18,
                        ),
                        onTap: () {},
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      # 5. Get Flutter dependencies
      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      # 6. Check the Flutter project
      - name: Analyze Flutter project
        working-directory: build_app
        run: flutter analyze

      # 7. Build release APK
      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
