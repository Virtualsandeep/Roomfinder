          // =====================================================
          // CUSTOMER DASHBOARD
          // =====================================================

          class CustomerDashboard extends StatefulWidget {
            const CustomerDashboard({super.key});

            @override
            State<CustomerDashboard> createState() =>
                _CustomerDashboardState();
          }

          class _CustomerDashboardState
              extends State<CustomerDashboard> {
            final searchController = TextEditingController();

            String propertyType = 'All';
            String furnished = 'All';
            String available = 'All';
            int minimumBedrooms = 0;

            double? minimumRent;
            double? maximumRent;

            @override
            void dispose() {
              searchController.dispose();
              super.dispose();
            }

            bool matchesProperty(
              Map<String, dynamic> data,
            ) {
              final search =
                  searchController.text.trim().toLowerCase();

              final title =
                  (data['title'] ?? '').toString().toLowerCase();

              final location =
                  (data['location'] ?? '').toString().toLowerCase();

              if (search.isNotEmpty &&
                  !title.contains(search) &&
                  !location.contains(search)) {
                return false;
              }

              final type =
                  (data['propertyType'] ?? '').toString();

              if (propertyType != 'All' &&
                  type != propertyType) {
                return false;
              }

              final isFurnished =
                  data['furnished'] == true;

              if (furnished == 'Furnished' &&
                  !isFurnished) {
                return false;
              }

              if (furnished == 'Unfurnished' &&
                  isFurnished) {
                return false;
              }

              final isAvailable =
                  data['available'] != false;

              if (available == 'Available' &&
                  !isAvailable) {
                return false;
              }

              final bedrooms =
                  int.tryParse(
                        '${data['bedrooms'] ?? 0}',
                      ) ??
                      0;

              if (bedrooms < minimumBedrooms) {
                return false;
              }

              final rent =
                  double.tryParse(
                        '${data['rent'] ?? 0}',
                      ) ??
                      0;

              if (minimumRent != null &&
                  rent < minimumRent!) {
                return false;
              }

              if (maximumRent != null &&
                  rent > maximumRent!) {
                return false;
              }

              return true;
            }

            Future<void> logout() async {
              await FirebaseAuth.instance.signOut();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('KothaFinder Nepal'),
                  actions: [
                    IconButton(
                      tooltip: 'Logout',
                      onPressed: logout,
                      icon: const Icon(Icons.logout),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: TextField(
                        controller: searchController,
                        onChanged: (_) => setState(() {}),
                        decoration: InputDecoration(
                          hintText: 'Search by title or location',
                          prefixIcon: const Icon(Icons.search),
                          suffixIcon: searchController.text.isEmpty
                              ? null
                              : IconButton(
                                  onPressed: () {
                                    searchController.clear();
                                    setState(() {});
                                  },
                                  icon: const Icon(Icons.clear),
                                ),
                        ),
                      ),
                    ),
                    SizedBox(
                      height: 54,
                      child: ListView(
                        scrollDirection: Axis.horizontal,
                        padding: const EdgeInsets.symmetric(
                          horizontal: 12,
                        ),
                        children: [
                          _filterButton(
                            'Type',
                            propertyType,
                            [
                              'All',
                              'Room',
                              '1BHK',
                              '2BHK',
                              'Flat',
                            ],
                            (value) {
                              setState(() {
                                propertyType = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Furnished',
                            furnished,
                            [
                              'All',
                              'Furnished',
                              'Unfurnished',
                            ],
                            (value) {
                              setState(() {
                                furnished = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Availability',
                            available,
                            [
                              'All',
                              'Available',
                            ],
                            (value) {
                              setState(() {
                                available = value;
                              });
                            },
                          ),
                          _filterButton(
                            'Bedrooms',
                            '$minimumBedrooms+',
                            [
                              '0+',
                              '1+',
                              '2+',
                              '3+',
                            ],
                            (value) {
                              setState(() {
                                minimumBedrooms =
                                    int.tryParse(
                                          value.replaceAll(
                                            '+',
                                            '',
                                          ),
                                        ) ??
                                        0;
                              });
                            },
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 8),
                    Expanded(
                      child: StreamBuilder<
                          QuerySnapshot<Map<String, dynamic>>>(
                        stream: FirebaseFirestore.instance
                            .collection('properties')
                            .orderBy(
                              'createdAt',
                              descending: true,
                            )
                            .snapshots(),
                        builder: (context, snapshot) {
                          if (snapshot.connectionState ==
                              ConnectionState.waiting) {
                            return const Center(
                              child: CircularProgressIndicator(),
                            );
                          }

                          if (snapshot.hasError) {
                            return Center(
                              child: Padding(
                                padding: const EdgeInsets.all(24),
                                child: Text(
                                  'Unable to load properties.\n\n'
                                  '${snapshot.error}',
                                  textAlign: TextAlign.center,
                                ),
                              ),
                            );
                          }

                          final documents =
                              snapshot.data?.docs ?? [];

                          final filtered = documents.where((doc) {
                            return matchesProperty(doc.data());
                          }).toList();

                          if (filtered.isEmpty) {
                            return const Center(
                              child: Text(
                                'No properties found.',
                              ),
                            );
                          }

                          return ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: filtered.length,
                            itemBuilder: (context, index) {
                              final doc = filtered[index];

                              return PropertyCard(
                                propertyId: doc.id,
                                data: doc.data(),
                              );
                            },
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _filterButton(
              String title,
              String selected,
              List<String> options,
              ValueChanged<String> onSelected,
            ) {
              return Padding(
                padding: const EdgeInsets.only(right: 8),
                child: OutlinedButton.icon(
                  onPressed: () async {
                    final result =
                        await showModalBottomSheet<String>(
                      context: context,
                      builder: (context) {
                        return SafeArea(
                          child: ListView(
                            shrinkWrap: true,
                            children: options.map((option) {
                              return ListTile(
                                title: Text(option),
                                trailing: option == selected
                                    ? const Icon(
                                        Icons.check,
                                      )
                                    : null,
                                onTap: () {
                                  Navigator.pop(
                                    context,
                                    option,
                                  );
                                },
                              );
                            }).toList(),
                          ),
                        );
                      },
                    );

                    if (result != null) {
                      onSelected(result);
                    }
                  },
                  icon: const Icon(Icons.filter_list),
                  label: Text('$title: $selected'),
                ),
              );
            }
          }

