          class PropertyCard extends StatelessWidget {
            final Map<String, dynamic> data;

            const PropertyCard({
              super.key,
              required this.data,
            });

            String textValue(
              String key, [
              String fallback = '',
            ]) {
              final value = data[key];

              if (value == null) {
                return fallback;
              }

              return value.toString();
            }

            String moneyValue(String key) {
              final value = data[key];

              if (value is num) {
                return 'Rs. ${value.toStringAsFixed(0)}';
              }

              return 'Rs. ${value ?? '0'}';
            }

            @override
            Widget build(BuildContext context) {
              final title =
                  textValue('title', 'Property');

              final location =
                  textValue('location');

              final type =
                  textValue('propertyType');

              final bedrooms =
                  textValue('bedrooms', '0');

              final bathrooms =
                  textValue('bathrooms', '0');

              final furnished =
                  textValue('furnished');

              final description =
                  textValue('description');

              final rent =
                  moneyValue('rent');

              final discount =
                  data['discount'] is num
                      ? data['discount'] as num
                      : 0;

              final finalRent =
                  data['rent'] is num
                      ? (data['rent'] as num) -
                          discount
                      : null;

              return Card(
                margin:
                    const EdgeInsets.only(
                  bottom: 18,
                ),
                clipBehavior:
                    Clip.antiAlias,
                child: Padding(
                  padding:
                      const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          const CircleAvatar(
                            radius: 27,
                            child:
                                Icon(Icons.home),
                          ),
                          const SizedBox(
                            width: 12,
                          ),
                          Expanded(
                            child: Text(
                              title,
                              style:
                                  const TextStyle(
                                fontSize: 19,
                                fontWeight:
                                    FontWeight.bold,
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 14),

                      Row(
                        children: [
                          const Icon(
                            Icons.location_on,
                            size: 19,
                          ),
                          const SizedBox(width: 5),
                          Expanded(
                            child:
                                Text(location),
                          ),
                        ],
                      ),
                      const SizedBox(height: 10),

                      Wrap(
                        spacing: 8,
                        runSpacing: 8,
                        children: [
                          _InfoChip(
                            icon:
                                Icons.home_work,
                            text: type,
                          ),
                          _InfoChip(
                            icon: Icons.bed,
                            text:
                                '$bedrooms beds',
                          ),
                          _InfoChip(
                            icon:
                                Icons.bathtub,
                            text:
                                '$bathrooms baths',
                          ),
                          _InfoChip(
                            icon: Icons.chair,
                            text:
                                furnished,
                          ),
                        ],
                      ),
                      const SizedBox(height: 15),

                      Text(
                        rent,
                        style:
                            const TextStyle(
                          fontSize: 19,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),

                      if (discount > 0 &&
                          finalRent != null)
                        Padding(
                          padding:
                              const EdgeInsets.only(
                            top: 4,
                          ),
                          child: Text(
                            'Discount: Rs. ${discount.toStringAsFixed(0)}  •  Now Rs. ${finalRent.toStringAsFixed(0)}',
                            style:
                                const TextStyle(
                              color: Colors.green,
                              fontWeight:
                                  FontWeight.w600,
                            ),
                          ),
                        ),

                      if (description.isNotEmpty)
                        Padding(
                          padding:
                              const EdgeInsets.only(
                            top: 12,
                          ),
                          child: Text(
                            description,
                            style:
                                const TextStyle(
                              height: 1.4,
                            ),
                          ),
                        ),

                      const SizedBox(height: 10),

                      SizedBox(
                        width: double.infinity,
                        child:
                            OutlinedButton(
                          onPressed: () {},
                          child: const Text(
                            'View Property',
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class _InfoChip extends StatelessWidget {
            final IconData icon;
            final String text;

            const _InfoChip({
              required this.icon,
              required this.text,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                padding:
                    const EdgeInsets.symmetric(
                  horizontal: 10,
                  vertical: 7,
                ),
                decoration: BoxDecoration(
                  color: Theme.of(context)
                      .colorScheme
                      .surfaceContainerHighest,
                  borderRadius:
                      BorderRadius.circular(20),
                ),
                child: Row(
                  mainAxisSize:
                      MainAxisSize.min,
                  children: [
                    Icon(
                      icon,
                      size: 16,
                    ),
                    const SizedBox(width: 5),
                    Text(text),
                  ],
                ),
              );
            }
          }

          class LandlordPropertyCard
              extends StatelessWidget {
            final String documentId;
            final Map<String, dynamic> data;

            const LandlordPropertyCard({
              super.key,
              required this.documentId,
              required this.data,
            });

            String textValue(
              String key, [
              String fallback = '',
            ]) {
              final value = data[key];

              if (value == null) {
                return fallback;
              }

              return value.toString();
            }

            @override
            Widget build(BuildContext context) {
              final title =
                  textValue('title', 'Property');

              final location =
                  textValue('location');

              final type =
                  textValue('propertyType');

              final available =
                  data['available'] == true;

              final rent = data['rent'];

              return Card(
                margin:
                    const EdgeInsets.only(
                  bottom: 15,
                ),
                child: ListTile(
                  leading: const CircleAvatar(
                    child:
                        Icon(Icons.apartment),
                  ),
                  title: Text(
                    title,
                    style:
                        const TextStyle(
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  subtitle: Text(
                    '$type • $location\n'
                    'Rs. ${rent ?? 0}/month • '
                    '${available ? 'Available' : 'Unavailable'}',
                  ),
                  isThreeLine: true,
                  trailing: PopupMenuButton<String>(
                    onSelected: (value) async {
                      if (value == 'toggle') {
                        await FirebaseFirestore
                            .instance
                            .collection(
                                'properties')
                            .doc(documentId)
                            .update({
                          'available':
                              !available,
                        });
                      }

                      if (value == 'delete') {
                        await FirebaseFirestore
                            .instance
                            .collection(
                                'properties')
                            .doc(documentId)
                            .delete();
                      }
                    },
                    itemBuilder: (context) {
                      return [
                        PopupMenuItem(
                          value: 'toggle',
                          child: Text(
                            available
                                ? 'Mark Unavailable'
                                : 'Mark Available',
                          ),
                        ),
                        const PopupMenuItem(
                          value: 'delete',
                          child:
                              Text('Delete Property'),
                        ),
                      ];
                    },
                  ),
                ),
              );
            }
          }
          EOF

      - name: Remove default tests
        working-directory: build_app
        run: |
          rm -rf test

      - name: Get dependencies
        working-directory: build_app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: |
          flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KothaFinder-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
