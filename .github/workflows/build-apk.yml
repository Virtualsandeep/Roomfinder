          class LandlordPropertyCard
              extends StatelessWidget {
            final QueryDocumentSnapshot<
                Map<String, dynamic>> doc;

            const LandlordPropertyCard({
              super.key,
              required this.doc,
            });

            Future<void> toggleAvailability(
              BuildContext context,
              bool value,
            ) async {
              try {
                await db
                    .collection('properties')
                    .doc(doc.id)
                    .update({
                  'available': value,
                  'updatedAt':
                      FieldValue.serverTimestamp(),
                });
              } catch (e) {
                if (!context.mounted) return;

                showMessage(
                  context,
                  'Could not update property: $e',
                );
              }
            }

            Future<void> deleteProperty(
              BuildContext context,
            ) async {
              final confirmed =
                  await showDialog<bool>(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text(
                      'Delete Property',
                    ),
                    content: const Text(
                      'Are you sure you want to delete this property?',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(
                            dialogContext,
                            false,
                          );
                        },
                        child:
                            const Text('Cancel'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(
                            dialogContext,
                            true,
                          );
                        },
                        child:
                            const Text('Delete'),
                      ),
                    ],
                  );
                },
              );

              if (confirmed != true) {
                return;
              }

              try {
                await db
                    .collection('properties')
                    .doc(doc.id)
                    .delete();
              } catch (e) {
                if (!context.mounted) return;

                showMessage(
                  context,
                  'Could not delete property: $e',
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final data = doc.data();

              final title =
                  data['title'] ?? 'Property';

              final location =
                  data['location'] ?? '';

              final rent =
                  data['monthlyRent'] ?? 0;

              final available =
                  data['available'] != false;

              return Card(
                margin: const EdgeInsets.only(
                  bottom: 12,
                ),
                child: Padding(
                  padding:
                      const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Text(
                        title.toString(),
                        style:
                            const TextStyle(
                          fontSize: 18,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 8),
                      Text(
                        location.toString(),
                      ),
                      const SizedBox(height: 8),
                      Text(
                        'Rs. $rent / month',
                      ),
                      SwitchListTile(
                        contentPadding:
                            EdgeInsets.zero,
                        title: Text(
                          available
                              ? 'Available'
                              : 'Unavailable',
                        ),
                        value: available,
                        onChanged: (value) {
                          toggleAvailability(
                            context,
                            value,
                          );
                        },
                      ),
                      Row(
                        children: [
                          Expanded(
                            child: OutlinedButton.icon(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) =>
                                        AddPropertyScreen(
                                      existing: doc,
                                    ),
                                  ),
                                );
                              },
                              icon: const Icon(
                                Icons.edit_outlined,
                              ),
                              label:
                                  const Text('Edit'),
                            ),
                          ),
                          const SizedBox(width: 8),
                          Expanded(
                            child: OutlinedButton.icon(
                              onPressed: () {
                                deleteProperty(
                                  context,
                                );
                              },
                              icon: const Icon(
                                Icons.delete_outline,
                              ),
                              label: const Text(
                                'Delete',
                              ),
                            ),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

