          // ============================================================
          // GOOGLE MAPS
          // ============================================================

          Future<void> openGoogleMaps(
            BuildContext context,
            String location,
          ) async {
            final cleaned = location.trim();

            if (cleaned.isEmpty) {
              showMessage(
                context,
                'Location is not available.',
              );
              return;
            }

            final uri = Uri.https(
              'www.google.com',
              '/maps/search/',
              {
                'api': '1',
                'query': cleaned,
              },
            );

            try {
              final launched = await launchUrl(
                uri,
                mode:
                    LaunchMode.externalApplication,
              );

              if (!launched &&
                  context.mounted) {
                showMessage(
                  context,
                  'Could not open Google Maps.',
                );
              }
            } catch (e) {
              if (!context.mounted) return;

              showMessage(
                context,
                'Could not open Google Maps: $e',
              );
            }
          }

